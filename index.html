ent şöyledir:\n[P]X elementi: atom numarası 12\nY elementi: atom numarası 9\nZ elementi: atom numarası 10[/P]Bu elementlerle ilgili aşağıdakilerden hangisi doğrudur?","o":["Y ile Z aynı periyotta yer alır.","X ile Y aynı grupta yer alır.","X'in son katmanında 8 elektron bulunur.","Z, kimyasal tepkimelere en istekli elementtir."],"a":0,"e":"Önce elektron dizilimlerini yazalım:\nX (12): 2 — 8 — 2 → 3 katman, son katmanda 2 elektron → <b>3. periyot, 2A grubu</b>, metal\nY (9): 2 — 7 → 2 katman, son katmanda 7 elektron → <b>2. periyot, 7A grubu</b>, ametal\nZ (10): 2 — 8 → 2 katman, son katmanda 8 elektron → <b>2. periyot, 8A grubu</b>, soygaz\nY ve Z'nin ikisi de 2 katmanlı, yani aynı periyottadır ✔\nDiğer şıklar neden yanlış:\nB şıkkı: X 2A, Y 7A grubunda; grupları farklı. Aynı grup demek son katman elektron sayısı aynı demektir.\nC şıkkı: X'in son katmanında 2 elektron var, 8 değil. 8 elektronu olan Z'dir.\nD şıkkı: Z bir soygazdır; son katmanı dolu olduğu için tepkimelere <b>en isteksiz</b> elementtir.\nPüf noktası: <b>Katman sayısı = periyot numarası</b>, <b>son katmandaki elektron sayısı = grup numarası (A grupları için)</b>. Elektron dizilimini kenara yazmadan şıklara bakma."},{"s":"Fen Bilimleri","t":"Madde ve Endüstri · asit-baz ve pH","d":1,"q":"Dört çözeltinin pH değerleri ölçülerek aşağıdaki tabloya kaydedilmiştir.\n[P]Çözelti — pH değeri\nK — 2\nL — 7\nM — 9\nN — 13[/P]Buna göre aşağıdakilerden hangisi doğrudur?","o":["N çözeltisine batırılan kırmızı turnusol kâğıdı mavi renk alır.","L çözeltisi asit özelliği gösterir.","K çözeltisine su eklendikçe pH değeri küçülür.","M çözeltisi, N çözeltisinden daha kuvvetli bir bazdır."],"a":0,"e":"pH cetvelini hatırla:\n<b>0 — 7 arası asit</b> (0'a yaklaştıkça kuvvetlenir)\n<b>7 nötr</b>\n<b>7 — 14 arası baz</b> (14'e yaklaştıkça kuvvetlenir)\nN'nin pH'ı 13, yani kuvvetli bir bazdır. Bazlar kırmızı turnusolu <b>maviye</b> çevirir ✔\nDiğer şıklar neden yanlış:\nB şıkkı: L'nin pH'ı tam 7, yani nötrdür; asit değildir (saf su gibi).\nC şıkkı: Asite su eklemek onu <b>seyreltir</b>, pH 7'ye doğru yani <b>büyür</b>. Küçülmesi için daha çok asit eklemen gerekir.\nD şıkkı: pH ne kadar büyükse baz o kadar kuvvetlidir. 13 > 9 olduğundan asıl kuvvetli olan N'dir.\nPüf noktası: pH sayısı ile kuvvet ilişkisi asitlerde <b>ters</b>, bazlarda <b>düz</b>dür. Su eklemek her zaman pH'ı <b>7'ye doğru</b> iter — bu tek cümle, seyreltme sorularının hepsini çözer."},{"s":"Fen Bilimleri","t":"Madde ve Endüstri · kütlenin korunumu","d":2,"q":"Kapalı bir kapta karbon ile oksijen gazı tepkimeye sokularak karbon dioksit elde ediliyor. İki deneyin ölçüm sonuçları şöyledir:\n[P]Deney — Karbon (g) — Oksijen (g) — Oluşan karbon dioksit (g)\n1 — 6 — 16 — 22\n2 — 9 — ? — 33[/P]Buna göre 2. deneyde harcanan oksijen kütlesi kaç gramdır?","o":["18","24","32","44"],"a":1,"e":"Kütlenin korunumu yasası: <b>Tepkimeye girenlerin toplam kütlesi = oluşan ürünlerin toplam kütlesi</b>\n1. deneyde kontrol edelim: 6 + 16 = 22 ✓ Yasa sağlanıyor.\n2. deneyde:\nKarbon + Oksijen = Karbon dioksit\n9 + ? = 33\n? = 33 − 9 = <b>24 gram</b> ✔\nDiğer şıklar neden yanlış:\nA şıkkı (18): 9'un iki katı; oranı yanlış kurmaktan çıkar.\nC şıkkı (32): 1. deneydeki 16'nın iki katı, ama karbon 6'dan 9'a çıkmış, yani 1,5 katına çıkmış. 16 × 1,5 = 24 olmalı.\nD şıkkı (44): Bu, 33 + 11 gibi hatalı bir toplama; oksijen ürün kütlesini geçemez.\nPüf noktası: Kapalı kapta yapılan tepkimede toplam kütle <b>asla değişmez</b>. Bu sorularda tek yapman gereken çıkarma işlemidir. Tabloya bir kez daha bak: 1. deneydeki oranlar (6 : 16 : 22) ile 2. deneydekiler (9 : 24 : 33) tam 1,5 katı — cevabın tutarlı olduğunu böyle kontrol edersin."},{"s":"Fen Bilimleri","t":"Basit Makineler · kaldıraç dengesi","d":3,"q":"Ağırlığı önemsiz bir kaldıraç şöyle kurulmuştur:\n[P]Destek noktasının SOLUNDA:\n• 30 cm uzaklıkta 40 N'luk yük\n• 60 cm uzaklıkta 30 N'luk yük\nDestek noktasının SAĞINDA:\n• 50 cm uzaklıkta X N'luk yük[/P]Kaldıracın dengede kalabilmesi için X kaç N olmalıdır?","o":["50","60","70","90"],"a":1,"e":"Kaldıraç dengesi kuralı: <b>Soldaki tüm (yük × uzaklık) toplamı = Sağdaki tüm (yük × uzaklık) toplamı</b>\nSol taraf:\n40 N × 30 cm = 1200\n30 N × 60 cm = 1800\nSol toplam = 1200 + 1800 = 3000\nSağ taraf:\nX × 50 = 3000\nX = 3000 ÷ 50 = <b>60 N</b> ✔\nDiğer şıklar neden yanlış:\nA şıkkı (50): Yalnızca 40 N'luk yükü hesaba katıp (40 × 30 = 1200, 1200 ÷ 50 = 24) ya da uzaklıkları toplayıp bulunan kaba bir değer; soldaki iki yükün <b>ikisini birden</b> eklemelisin.\nC şıkkı (70): 40 + 30 = 70 — yüklerin ağırlıklarını doğrudan toplamak. Uzaklıkları unutmuşsun.\nD şıkkı (90): 3000 ÷ 33 gibi yanlış bir bölme ya da uzaklıkları toplayıp (30 + 60 = 90) yazmaktan gelir.\nPüf noktası: Aynı tarafta kaç yük varsa <b>hepsinin</b> ayrı ayrı (kuvvet × uzaklık) çarpımını bul ve topla. Uzaklıklar hep <b>destek noktasından</b> ölçülür, yüklerin birbirine olan uzaklığından değil."},{"s":"Fen Bilimleri","t":"Basit Makineler · hareketli makara ve işten kazanç","d":2,"q":"Sürtünmelerin ve makara ağırlığının önemsiz olduğu bir düzenekte, <b>600 N</b> ağırlığındaki bir yük <b>hareketli makara</b> kullanılarak <b>3 metre</b> yükseltiliyor.\nBuna göre uygulanan kuvvet ve çekilen ip uzunluğu sırasıyla hangi seçenekte doğru verilmiştir?","o":["150 N — 6 m","300 N — 1,5 m","300 N — 6 m","600 N — 3 m"],"a":2,"e":"Hareketli makarada yük <b>iki ip</b> tarafından taşınır:\nKuvvet = Yük ÷ 2 = 600 ÷ 2 = <b>300 N</b>\nKuvvetten 2 kat kazanç sağladığın için yoldan 2 kat kaybedersin:\nÇekilen ip = Yükün çıktığı yol × 2 = 3 × 2 = <b>6 m</b> ✔\nKontrol (işten kazanç yoktur):\nYükün işi: 600 × 3 = 1800 J\nSenin işin: 300 × 6 = 1800 J → eşit ✓\nDiğer şıklar neden yanlış:\nA şıkkı: 150 N, yükü kaldırmaya yetmez; bu ancak iki hareketli makarada olur. İş 150 × 6 = 900 J çıkar, yani enerji yoktan var olmuş olurdu.\nB şıkkı: Kuvvet doğru ama ip uzunluğu yanlış. Kuvvet yarıya inerken yol <b>yarıya inmez</b>, iki katına çıkar.\nD şıkkı: Bu, makara hiç kullanılmamış hâli; hareketli makara kuvvetten kazandırır.\nPüf noktası: Basit makineler <b>işten kazanç sağlamaz</b>. Bulduğun cevabı Kuvvet × Yol çarpımıyla test et; sonuç Yük × Yükseklik ile aynı çıkmıyorsa cevap yanlıştır."},{"s":"Fen Bilimleri","t":"Enerji Dönüşümleri ve Çevre Bilimi · besin zinciri","d":1,"q":"Bir ekosistemde gözlenen besin zinciri şöyledir:\n[P]Buğday → Çekirge → Kurbağa → Yılan → Şahin[/P]Buna göre bu besin zinciri ile ilgili aşağıdakilerden hangisi <u>çıkarılamaz</u>?","o":["Zincirdeki tek üretici canlı buğdaydır.","Kurbağaların tamamı yok olursa yılan sayısı azalır.","Zincirde depolanan enerji miktarı en fazla buğdayda bulunur.","Zincirde soldan sağa gidildikçe canlıların vücut büyüklüğü artar."],"a":3,"e":"Besin zincirinde ok, \"enerjinin gittiği yönü\" gösterir. Bu zincirden enerji ve beslenme ilişkileri çıkarılabilir, ama <b>canlıların boyu</b> hakkında bir bilgi yoktur. Doğada tersi de sık görülür (örneğin aslanı hasta eden minik bir parazit). Bu yüzden D şıkkı çıkarılamaz ✔\nDiğer şıklar neden çıkarılabilir:\nA şıkkı: Zincir her zaman bir üreticiyle başlar; buradaki tek fotosentez yapan canlı buğdaydır.\nB şıkkı: Yılanın besini kurbağadır; besini biten yılanın sayısı azalır.\nC şıkkı: Enerji piramidinde her basamakta enerjinin yaklaşık %10'u üste aktarılır, gerisi ısı olarak kaybolur. Bu yüzden en çok enerji <b>en alt basamakta</b>, yani üreticide bulunur.\nPüf noktası: \"Çıkarılamaz\" soruları metinde/şemada <b>hiç geçmeyen</b> bilgiyi arar. Yanlış bilgiyi değil, <b>bilgisi olmayanı</b> ararsın. Şıkları okurken \"bunu bana kim söyledi?\" diye sor; cevabı olmayan şık senin cevabındır."},{"s":"Fen Bilimleri","t":"Elektrik Yükleri · elektroskop ve dokunmayla elektriklenme","d":1,"q":"Yaprakları açık, <b>negatif yüklü</b> bir elektroskobun topuzuna, yalıtkan bir sapla tutulan <b>nötr</b> bir metal küre dokunduruluyor. Küre çekildiğinde elektroskobun yapraklarının açıklığının <b>azaldığı ama tamamen kapanmadığı</b> gözleniyor.\nBuna göre aşağıdakilerden hangisi doğrudur?","o":["Küre negatif yükle yüklenmiştir.","Elektroskop tamamen nötr hâle gelmiştir.","Küreden elektroskoba elektron geçmiştir.","Küre pozitif yükle yüklenmiştir."],"a":0,"e":"Dokunarak elektriklenmede iki cisim birbirine değdiğinde <b>elektronlar</b> yer değiştirir ve sonunda <b>her ikisi de aynı cins yükle</b> yüklenir.\nElektroskop negatif yüklüydü, yani fazla elektronu vardı. Nötr küre dokununca bu elektronların bir kısmı küreye geçti → küre <b>negatif</b> yüklendi ✔\nElektroskopta hâlâ fazla elektron kaldığı için yapraklar biraz açık kalmaya devam etti.\nDiğer şıklar neden yanlış:\nB şıkkı: Yapraklar tamamen kapanmadığına göre elektroskopta hâlâ yük var, nötr değil. (Nötr olması için topraklanması gerekirdi.)\nC şıkkı: Elektron akışının yönü ters verilmiş. Elektron, <b>fazla olduğu yerden az olduğu yere</b> geçer; burada fazla elektron elektroskoptaydı.\nD şıkkı: Elektroskoptan küreye pozitif yük değil elektron geçer; küre elektron aldığına göre pozitif olamaz.\nPüf noktası: Katılarda sadece <b>elektronlar</b> hareket eder, protonlar yerinden kıpırdamaz. \"Ne geçti?\" diye sorduğunda cevap her zaman elektrondur; sen sadece yönünü bulacaksın."},{"s":"Fen Bilimleri","t":"Elektrik Enerjisi · güç ve kWh hesabı","d":2,"q":"Bir evde kullanılan üç elektrikli cihazın gücü ve her gün çalıştırılma süresi tabloda verilmiştir.\n[P]Cihaz — Gücü — Günlük çalışma süresi\nBuzdolabı — 150 W — 8 saat\nÜtü — 1000 W — 0,5 saat\nTelevizyon — 200 W — 3 saat[/P]Bu cihazlar her gün aynı sürelerde çalıştırıldığına göre, <b>30 günde</b> harcanan toplam elektrik enerjisi kaç kWh'tir?","o":["2,3","23","36","69"],"a":3,"e":"Enerji = Güç × Süre formülünü her cihaz için ayrı uygula:\nBuzdolabı: 150 W × 8 sa = 1200 Wh\nÜtü: 1000 W × 0,5 sa = 500 Wh\nTelevizyon: 200 W × 3 sa = 600 Wh\nGünlük toplam: 1200 + 500 + 600 = 2300 Wh\nkWh'ye çevir: 2300 ÷ 1000 = 2,3 kWh (bir günde)\n30 gün için: 2,3 × 30 = <b>69 kWh</b> ✔\nDiğer şıklar neden yanlış:\nA şıkkı (2,3): Bu yalnızca <b>bir günün</b> tüketimi; 30 ile çarpmayı unutmuşsun. Soru \"30 günde\" diyor.\nB şıkkı (23): 2,3'ü 10 ile çarpmaktan gelir, ayda 30 gün var.\nC şıkkı (36): Sadece buzdolabının aylık tüketimi (1,2 × 30); diğer iki cihazı eklemelisin.\nPüf noktası: 1 kWh = 1000 Wh. Watt'ı kilowatt'a çevirmeyi işlemin <b>sonunda</b> yap, baştan çevirmeye çalışırsan 0,5 ve 0,15 gibi sayılarla uğraşırsın. Ve her zaman sorunun son satırındaki süreye (gün mü, ay mı) bir kez daha bak."}],"intro":"<b>Bu senin ilk tam provan.</b> 90 soru, 155 dakika — gerçek LGS düzeni: önce 50 sözel soru (Türkçe, İnkılap, Din, İngilizce), sonra 40 sayısal soru (Matematik, Fen).<br><br>Bugünün amacı yüksek net değil, <b>oturabilmek ve tempoyu tutturmak</b>. Yıl sonunda sorulacak her konudan soru var; okulda daha işlemediğin çok şey çıkacak. Onları tahmin etmeye çalışma, <b>\"Bu konuyu okulda henüz görmedik\"</b> düğmesine bas — netini düşürmez, bize müfredat haritası çıkarır.<br><br>Bildiğin sorularda ise acele etme: soru başına <b>1 dakika 43 saniyen</b> var. Özellikle <b>\"hangisi değildir / yanlıştır / çıkarılamaz\"</b> köklerine dikkat — bu provada 22 tane var. Kolay gelsin."},

  {s:"Türkçe",t:"Fiilimsiler · adlaşmış sıfat-fiil",d:2,
   q:"Aşağıdaki cümlelerde altı çizili sözcüklerden hangisi <u>adlaşmış sıfat-fiil değildir</u>?",
   o:["<u>Bilenler</u> her zaman bir adım öne çıkar.","<u>Yazdıkları</u>nı uzun süre kimseye göstermedi.","<u>Gülen</u> gözleri hepimizi bir anda rahatlattı.","<u>Konuşulanlar</u> beni hiç ilgilendirmiyor."],
   a:2,
   e:"Adlaşmış sıfat-fiil, nitelediği ismin düşüp yerine kendisinin geçtiği sıfat-fiildir. Tek testi şudur: <b>hemen arkasında nitelediği isim duruyor mu?</b>\nDuruyorsa adlaşmamıştır, normal sıfat-fiildir.\nC'de \"gülen\" sözcüğünün arkasında <b>gözleri</b> ismi duruyor → nitelenen isim yerinde → adlaşmamış. ✔ Aradığımız şık bu.\nA: \"bilenler\" = \"bilen <b>kişiler</b>\" — isim düşmüş → adlaşmış.\nB: \"yazdıkları\" = \"yazdığı <b>şeyler</b>\" → adlaşmış.\nD: \"konuşulanlar\" = \"konuşulan <b>sözler</b>\" → adlaşmış.\nBu konuyu üçüncü kez soruyorum çünkü ilk iki denemede de burada takıldın. Kısa yol: sözcüğün arkasına gizli bir isim <b>koyman gerekiyorsa</b> adlaşmıştır; isim <b>zaten oradaysa</b> adlaşmamıştır."},

  {s:"Türkçe",t:"Fiilimsiler · üç türü bir arada bulma",d:3,
   q:"Aşağıdaki cümlelerin hangisinde isim-fiil, sıfat-fiil ve zarf-fiil <u>birlikte</u> kullanılmıştır?",
   o:["Yürüyerek gelen misafirleri kapıda karşıladık.","Okumayı sevenler, kitap okurken zamanın nasıl geçtiğini anlamaz.","Gülerek konuştu ve hemen çıkıp gitti.","Çalışmak, insanı zamanla güçlü kılar."],
   a:1,
   e:"Her şıkkı tek tek tarayalım. Önce yüklemin üstünü çiz, kalan eylemlere bak.\nB → yüklem \"anlamaz\".\n• oku<b>ma</b>yı → isim-fiil (neyi seviyorlar? okumayı)\n• sev<b>en</b>ler → sıfat-fiil (adlaşmış hâlde)\n• oku<b>rken</b> → zarf-fiil (ne zaman anlamaz?)\nÜçü de var. ✔\nA → yürü<b>yerek</b> (zarf-fiil) + gel<b>en</b> (sıfat-fiil) = iki tür, isim-fiil yok.\nC → gül<b>erek</b> ve çık<b>ıp</b> — ikisi de zarf-fiil, tek tür.\nD → çalış<b>mak</b> yalnızca isim-fiil.\nPüf noktası: \"birlikte kullanılmıştır\" soruları aslında sayma sorusudur. Şıkları okurken her fiilimsinin yanına İ / S / Z harfini yaz; üç harfi de gördüğün şık cevaptır. Kafanda tutmaya çalışma, işaretle."},

  {s:"Türkçe",t:"Parçada anlam · akışı bozan cümle",d:2,
   q:"[P](I) Kitap okumak, başka hayatların içine girip çıkmaktır.\n(II) Okurken kendi yaşamadığımız duyguları tanır, hiç gitmediğimiz yerleri geziyormuş gibi oluruz.\n(III) Bugün dünyada en çok satan kitaplar polisiye türündedir.\n(IV) Bu yüzden çok okuyan bir insanın, başkalarını anlama becerisi de gelişir.[/P]Bu parçada düşüncenin akışını bozan cümle hangisidir?",
   o:["I","II","III","IV"],
   a:2,
   e:"Parçanın konusu tek: <b>okumanın insanı başkalarını anlamaya götürmesi</b>.\nI konuyu açıyor, II bunu açıklıyor, IV \"bu yüzden\" diyerek sonuca bağlıyor. Üçü birbirine zincir gibi bağlı.\nIII ise kitapların <b>satış rakamlarından</b> söz ediyor — bambaşka bir konu. Çıkarıldığında parçada hiçbir boşluk kalmıyor; hatta II ile IV daha da iyi birleşiyor. ✔\nBu soru tipinde iki kontrol yeter:\n<b>1)</b> Cümleyi parçadan çıkar, geriye kalan akıyor mu? Akıyorsa akışı bozan odur.\n<b>2)</b> \"Bu yüzden, ancak, çünkü, oysa\" gibi bağlayıcılara bak; bunlar bir önceki cümleye tutunur. IV'ün \"bu yüzden\"i III'e değil, II'ye tutunuyor — III araya sıkışmış demektir."},

  {s:"Türkçe",t:"Cümlede anlam · koşul (şart)",d:1,
   q:"Aşağıdaki cümlelerin hangisinde koşul (şart) anlamı vardır?",
   o:["Erken çıkarsan otobüse rahatça yetişirsin.","Yağmur yağdığı için maç ertelendi.","Sınavı kazanmak için gece gündüz çalıştı.","Ders bitince hep birlikte dışarı çıktık."],
   a:0,
   e:"Koşul cümlesinde bir eylemin gerçekleşmesi, başka bir eylemin şartına bağlanır. İşaretleri: <b>-sa / -se</b>, \"ancak\", \"...mak şartıyla\", \"yeter ki\".\nA: Otobüse yetişmek, erken çıkmaya bağlanmış → koşul. ✔\nB: \"-dığı için\" → <b>neden-sonuç</b>.\nC: \"kazanmak için\" → <b>amaç-sonuç</b> (henüz gerçekleşmemiş bir hedef).\nD: \"bitince\" → <b>zaman</b>.\nAyırt etme sorusu: \"Bu olmazsa şu da olmaz mı?\" Cevap evetse koşuldur. Erken çıkmazsan otobüse yetişemezsin → evet → koşul."},

  {s:"Türkçe",t:"Yazım · kesme işareti",d:2,
   q:"Aşağıdaki cümlelerin hangisinde kesme işareti (') <u>yanlış</u> kullanılmıştır?",
   o:["Atatürk'ün Samsun'a çıkışı 19 Mayıs 1919'da gerçekleşti.","Ankara'lı arkadaşım yaz tatilinde bizi ziyaret edecek.","Kitabı Ayşe'nin çantasında unutmuşum.","TBMM'nin açılışı 23 Nisan 1920'dedir."],
   a:1,
   e:"Kuralı ikiye ayır:\n• Özel adlara gelen <b>çekim ekleri</b> (hâl, iyelik, bildirme) kesmeyle <b>ayrılır</b>: Atatürk'ün, Samsun'a, Ayşe'nin, 1919'da, TBMM'nin.\n• Özel adlara gelen <b>yapım ekleri</b> kesmeyle <b>ayrılmaz</b>: -lı/-li, -cı/-ci, -lık/-lik.\nB'de \"-lı\" bir yapım ekidir; doğrusu <b>Ankaralı</b>'dır, kesme işareti fazladır. ✔\nDoğru yazılan örnekler: Ankaralı, İstanbullu, Türkçe, Avrupalı, Kayserili, Konyalı.\nKarıştırmamak için: ek sözcüğe <b>yeni bir anlam</b> katıyorsa (Ankara = şehir, Ankaralı = kişi) yapım ekidir, ayırma. Ek yalnızca cümledeki görevi belirliyorsa (Ankara'ya, Ankara'dan) çekim ekidir, ayır."},

  /* --- MATEMATİK (5) --- */
  {s:"Matematik",t:"Asal çarpanlara ayırma",d:1,
   q:"120 sayısının birbirinden farklı asal çarpanlarının çarpımı kaçtır?",
   o:["15","24","30","60"],
   a:2,
   e:"Önce 120'yi asal çarpanlarına ayıralım:\n120 = 2 · 60 = 2 · 2 · 30 = 2 · 2 · 2 · 15 = 2³ · 3 · 5\nBirbirinden <b>farklı</b> asal çarpanlar: 2, 3 ve 5.\nÇarpımları: 2 · 3 · 5 = <b>30</b> ✔\nDiğer şıklar nereden geliyor:\n• 15 = 3 · 5 → 2'yi unutanlar için.\n• 24 = 2³ · 3 → üsleri de çarpıma katanlar için (2 · 2 · 2 · 3).\n• 60 = 2² · 3 · 5 → 2'yi iki kez sayanlar için.\nGeçen denemede bu konuyu <b>ilk seferde doğru yapmış, ikinci seferde kaçırmıştın</b> — bilgi eksiği değil, dikkat meselesi. \"Farklı\" kelimesinin altını çiz: aynı asal kaç kez çıkarsa çıksın <b>bir kez</b> yazılır."},

  {s:"Matematik",t:"Üslü ifadeler · çarpma ve bölme",d:2,
   q:"(3⁴ · 3⁻²) ÷ 3⁵ işleminin sonucu kaçtır?",
   o:["1/27","1/9","9","27"],
   a:0,
   e:"Tabanlar aynı olduğu için kurallar basit: <b>çarpmada üsler toplanır, bölmede çıkarılır.</b>\nAdım 1: 3⁴ · 3⁻² = 3⁴⁺⁽⁻²⁾ = 3²\nAdım 2: 3² ÷ 3⁵ = 3²⁻⁵ = 3⁻³\nAdım 3: Negatif üs sayıyı <b>ters çevirir</b>, eksi yapmaz:\n3⁻³ = 1/3³ = <b>1/27</b> ✔\nKontrol edelim: 81 · (1/9) = 9, sonra 9 ÷ 243 = 1/27 ✔\nSık yapılan hatalar:\n• 3⁻³'ü −27 sanmak. Üssün eksisi, sayının eksisi değildir.\n• Üsleri çıkarırken sırayı şaşırmak: <b>üstteki eksi alttaki</b> (2 − 5), tersi değil.\nAklında kalsın: negatif üs gördüğünde önce kesir çizgisinin diğer tarafına geçir, sonra hesapla."},

  {s:"Matematik",t:"Üslü ifadeler · sıralama",d:3,
   q:"a = 2⁻²\nb = (−2)³\nc = (1/2)⁻²\nolduğuna göre a, b ve c'nin küçükten büyüğe doğru sıralanışı aşağıdakilerden hangisidir?",
   o:["b < a < c","a < b < c","b < c < a","c < a < b"],
   a:0,
   e:"Sıralama sorularında tek yol var: <b>hepsini normal sayıya çevir</b>, sonra sırala.\na = 2⁻² = 1/2² = 1/4 = <b>0,25</b> → pozitif, 1'den küçük\nb = (−2)³ = (−2)·(−2)·(−2) = <b>−8</b> → negatif (tek üs, işaret eksi kalır)\nc = (1/2)⁻² = 2² = <b>4</b> → kesrin negatif üssü, kesri ters çevirip üssü pozitif yapar\nSıralama: −8 < 0,25 < 4 → <b>b < a < c</b> ✔\nÜç kural, üç satır:\n• <b>Negatif taban, tek üs</b> → sonuç negatif. Çift üs → pozitif. (−2)³ = −8 ama (−2)² = +4.\n• <b>Negatif üs</b> → sayıyı ters çevir: 2⁻² = 1/4, (1/2)⁻² = 2² = 4.\n• Bir negatif sayı, her pozitif sayıdan küçüktür. b'yi görür görmez en başa koyabilirdin — bu tek adım bile iki şıkkı eler."},

  {s:"Matematik",t:"EBOB problemi · kaç tane",d:2,
   q:"Bir çiçekçi 36 gül ve 54 karanfili hiç artmayacak biçimde buketler hâline getirecektir. Her bukette eşit sayıda çiçek olacak ve bir bukette yalnızca bir çeşit çiçek bulunacaktır.\nBuket sayısı mümkün olan en az olduğuna göre çiçekçi toplam kaç buket hazırlar?",
   o:["3","5","9","18"],
   a:1,
   e:"Buket sayısı <b>en az</b> olacaksa, bir bukete konan çiçek sayısı <b>en çok</b> olmalı. Hem 36'yı hem 54'ü tam bölen en büyük sayı → EBOB.\n36 = 2² · 3²\n54 = 2 · 3³\nEBOB = 2 · 3² = <b>18</b> → bir bukette 18 çiçek.\nGüllerden: 36 ÷ 18 = 2 buket\nKaranfillerden: 54 ÷ 18 = 3 buket\nToplam: 2 + 3 = <b>5 buket</b> ✔\n<b>Dikkat!</b> D şıkkındaki 18, bir buketteki çiçek sayısı — soru <b>buket sayısını</b> istiyor. Bu tam olarak ilk iki denemede de düştüğün tuzak: EBOB'u doğru buluyorsun, sonra onu işaretliyorsun.\nÜç saniyelik alışkanlık: işlem bitince şıklara bakmadan sorunun <b>son cümlesini</b> tekrar oku. \"Bulduğum sayı, istenen sayı mı?\""},

  {s:"Matematik",t:"EKOK problemi",d:2,
   q:"Bir iskeleden A vapuru 20 dakikada bir, B vapuru 30 dakikada bir kalkmaktadır. İki vapur saat 09.00'da birlikte kalkmıştır.\nAynı gün saat 12.00'ye kadar (12.00 dâhil) iki vapur kaç kez daha birlikte kalkar?",
   o:["2","3","4","6"],
   a:1,
   e:"\"Birlikte kalkma\" tekrar eden bir olaydır → ortak kat → <b>EKOK</b>.\n20 = 2² · 5\n30 = 2 · 3 · 5\nEKOK = 2² · 3 · 5 = <b>60 dakika</b> → her 60 dakikada bir birlikte kalkarlar.\n09.00'dan 12.00'ye kadar geçen süre: 3 saat = <b>180 dakika</b>.\n180 ÷ 60 = <b>3 kez</b> ✔\nTek tek de yazabilirsin: 10.00, 11.00, 12.00 → 3 kez.\n<b>Dikkat:</b> soru \"kaç kez <b>daha</b>\" diyor; 09.00'daki ilk kalkış sayılmaz. Eğer onu da sayarsan 4 çıkar ve C şıkkına düşersin — çeldirici tam bunun için konuldu.\nHatırlatma: <b>bölüyorsan EBOB, bekliyorsan EKOK.</b>"},

  /* --- FEN (4) --- */
  {s:"Fen Bilimleri",t:"DNA · kalıtım birimlerinin sıralanışı",d:1,
   q:"Kalıtım birimleriyle ilgili aşağıdakilerden hangisi <u>büyükten küçüğe</u> doğru bir sıralamadır?",
   o:["Nükleotid → Gen → DNA → Kromozom","DNA → Kromozom → Gen → Nükleotid","Gen → Nükleotid → DNA → Kromozom","Kromozom → DNA → Gen → Nükleotid"],
   a:3,
   e:"İç içe geçmiş kutular gibi düşün:\n<b>Kromozom</b> en dıştaki yapıdır; içinde DNA bulunur.\n<b>DNA</b> uzun bir ipliktir; üzerinde sıra sıra genler dizilidir.\n<b>Gen</b>, DNA'nın bir özelliği belirleyen anlamlı parçasıdır (göz rengi geni gibi).\n<b>Nükleotid</b> en küçük yapı taşıdır; genleri oluşturan tuğlalardır.\nDoğru sıra: Kromozom → DNA → Gen → Nükleotid ✔\nA aynı sıralamanın tersidir — soru \"büyükten küçüğe\" dediği için tuzaktır, \"küçükten büyüğe\" deseydi A doğru olurdu. Soruyu okurken bu yön ifadesinin altını çiz.\nAkılda tutma cümlesi: <b>Kromozomun içinde DNA, DNA'nın üstünde gen, genin içinde nükleotid.</b>"},

  {s:"Fen Bilimleri",t:"Kalıtım · çaprazlama",d:2,
   q:"Bezelyelerde uzun gövde (U), kısa gövdeye (u) baskındır. Melez uzun gövdeli bir bezelye ile kısa gövdeli bir bezelye çaprazlanıyor.\nOluşacak bireylerin kaçta kaçının kısa gövdeli olması beklenir?",
   o:["Tamamı","3/4","1/2","1/4"],
   a:2,
   e:"Önce genotipleri yaz:\n• Melez uzun = <b>Uu</b> (melez demek, iki geni farklı demek)\n• Kısa gövdeli = <b>uu</b> (çekinik özellik ancak iki çekinik genle görünür)\nÇaprazlama: Uu × uu\nPunnett karesi:\n\n        u      u\nU  →   Uu     Uu\nu  →   uu     uu\n\nSonuçlar: 2 tane Uu (uzun), 2 tane uu (kısa)\nKısa gövdeli olma olasılığı: 2/4 = <b>1/2</b> ✔\nDiğer şıklar nereden geliyor:\n• 1/4 → Uu × Uu çaprazlamasının sonucudur; soruyu yanlış okuyanlar için.\n• 3/4 → aynı çaprazlamada uzun olanların oranı.\n• Tamamı → uu × uu olsaydı doğru olurdu.\nPüf noktası: çaprazlamaya başlamadan önce iki genotipi kenara yaz. Soruların yarısı, genotipi yanlış yazmaktan kaybediliyor. \"Melez\" = Uu, \"arı döl / saf\" = UU ya da uu."},

  {s:"Fen Bilimleri",t:"DNA · zincirler ve baz eşleşmesi",d:3,
   q:"Bir DNA molekülünün bir zincirinde 200, diğer zincirinde 150 adenin nükleotidi bulunmaktadır.\nBuna göre bu DNA molekülünün tamamında toplam kaç tane timin nükleotidi vardır?",
   o:["150","200","350","700"],
   a:2,
   e:"İki zincir birbirinin karşılığıdır: bir zincirdeki her adeninin <b>tam karşısında</b>, diğer zincirde bir timin bulunur.\nAdım adım:\n• 1. zincirdeki 200 adeninin karşısında → 2. zincirde <b>200 timin</b>\n• 2. zincirdeki 150 adeninin karşısında → 1. zincirde <b>150 timin</b>\nToplam timin = 200 + 150 = <b>350</b> ✔\n<b>Kısa yol:</b> molekülün tamamında A = T kuralı geçerlidir. Toplam adenin 200 + 150 = 350 olduğuna göre toplam timin de 350'dir. Tek satırda biter.\nDiğer şıklar:\n• 200 ya da 150 → yalnızca bir zincire bakıp durmak.\n• 700 → gereksiz yere ikiyle çarpmak; 350 zaten iki zincirin toplamı.\nDikkat edilecek ayrım: <b>A = T ve G = C kuralı molekülün tamamı için geçerlidir</b>, tek bir zincir için değil. Bir zincirde 200 adenin varken aynı zincirde kaç timin olduğunu bilemeyiz — o yüzden soru hep \"toplamda\" diye sorar."},

  {s:"Fen Bilimleri",t:"Mevsimler · 21 Aralık ve Güney Yarım Küre",d:2,
   q:"21 Aralık tarihinde <u>Güney Yarım Küre</u>'de aşağıdakilerden hangisi yaşanır?",
   o:["Kış mevsimi başlar.","Gündüz süresi yılın en uzun değerine ulaşır.","Güneş ışınları Yengeç Dönencesi'ne dik düşer.","Gece ve gündüz süreleri birbirine eşit olur."],
   a:1,
   e:"21 Aralık'ta Güneş ışınları <b>Oğlak Dönencesi'ne dik</b> düşer. Oğlak Dönencesi Güney Yarım Küre'dedir — yani bu tarihte Güney, yılın en dik ışınlarını alır.\nSonuç: Güney Yarım Küre'de <b>yaz mevsimi başlar</b> ve <b>gündüz yılın en uzun hâline</b> ulaşır. ✔\nA yanlış: kış mevsimi <b>Kuzey</b> Yarım Küre'de başlar. İki yarım kürede her zaman zıt mevsimler yaşanır.\nC yanlış: Yengeç Dönencesi'ne dik düşme tarihi <b>21 Haziran</b>'dır.\nD yanlış: gece-gündüz eşitliği (ekinoks) 21 Mart ve 23 Eylül'dedir.\n<b>Bu soruda asıl tuzak yarım küre.</b> Bu konuyu iki denemede de eksiksiz yaptın; seni düşürecek tek şey, soruyu okurken \"Güney\" kelimesini atlamak olur. Tarih sorularında önce yarım küreyi bul, sonra cevapla.\nDört tarih, tek tablo:\n• 21 Mart / 23 Eylül → Ekvator'a dik, her yerde gece = gündüz\n• 21 Haziran → Yengeç'e dik, Kuzey'de yaz\n• 21 Aralık → Oğlak'a dik, Güney'de yaz"},

  /* --- İNKILAP (2) --- */
  {s:"İnkılap Tarihi",t:"Trablusgarp Savaşı",d:2,
   q:"Mustafa Kemal ve bazı Osmanlı subayları, 1911'de başlayan Trablusgarp Savaşı'na gazeteci ya da tüccar kılığında, gizlice gitmişlerdir.\nSubayların bölgeye bu şekilde gitmek zorunda kalmasının temel nedeni aşağıdakilerden hangisidir?",
   o:["İtalya'nın savaşı kazanacağının baştan belli olması","Subayların gazetecilik mesleğini öğrenmek istemesi","Trablusgarp halkının Osmanlı Devleti'ne karşı ayaklanmış olması","Osmanlı Devleti'nin bölgeye kara ve deniz yoluyla asker gönderememesi"],
   a:3,
   e:"Trablusgarp bugünkü Libya'dır ve Osmanlı'nın Kuzey Afrika'daki son toprağıydı. Oraya ulaşmanın iki yolu vardı, ikisi de kapalıydı:\n• <b>Deniz yolu:</b> Osmanlı donanması yetersizdi, Akdeniz'de İtalyan donanması üstündü.\n• <b>Kara yolu:</b> aradaki Mısır, İngiltere'nin işgali altındaydı ve İngiltere geçişe izin vermedi.\nBu yüzden düzenli ordu gönderilemedi; gönüllü subaylar <b>kılık değiştirip gizlice</b> gitti ve yerli halkı örgütleyerek savaştı. ✔\nA yanlış: subaylar tam tersine kazanmak için gitti; Derne ve Tobruk'ta İtalyanları durdurdular.\nB yanlış: gazetecilik gerçek amaç değil, sınırı geçmek için kullanılan <b>kılıftı</b>. (Mustafa Kemal \"Şerif\" takma adını kullandı.)\nC yanlış: yerli halk Osmanlı'nın yanında, İtalyanlara karşı savaştı.\nSavaş, <b>Balkan Savaşları</b> çıkınca Uşi Antlaşması ile son buldu (1912) ve Trablusgarp kaybedildi."},

  {s:"İnkılap Tarihi",t:"Balkan Savaşları ve fikir akımları",d:1,
   q:"Balkan Savaşları'nda, Osmanlı Devleti'nin yüzyıllardır bir arada yaşadığı Balkan uluslarının ayaklanarak bağımsızlıklarını ilan etmesi, aşağıdaki fikir akımlarından hangisinin geçerliliğini yitirdiğini göstermiştir?",
   o:["Türkçülük","Batıcılık","Osmanlıcılık","İslamcılık"],
   a:2,
   e:"<b>Osmanlıcılık</b>, din-dil-ırk ayrımı yapmadan bütün Osmanlı vatandaşlarını \"Osmanlı\" kimliği altında eşit sayarak devleti bir arada tutmayı savunuyordu.\nBalkan Savaşları'nda Sırp, Bulgar, Yunan ve Karadağlıların ayaklanıp bağımsızlık ilan etmesi, bu ortak kimliğin tutmadığını gösterdi → Osmanlıcılık fiilen sona erdi. ✔\nDiğerleri neden değil:\n• <b>Türkçülük</b> tam tersine bu dönemden sonra <b>güçlendi</b>.\n• <b>İslamcılık</b> ise I. Dünya Savaşı'nda Arapların ayaklanmasıyla geçerliliğini yitirecektir.\n• <b>Batıcılık</b> bir kimlik politikası değil, yenileşme önerisidir; savaşla doğrudan çürütülmez.\nAkımların bitiş noktalarını eşleştir, sınavda bu sorulur:\n<b>Osmanlıcılık → Balkan Savaşları</b> · <b>İslamcılık → Arap İsyanı (I. Dünya Savaşı)</b>"},

  /* --- DİN (2) --- */
  {s:"Din Kültürü",t:"Kader · kaza · tevekkül",d:2,
   q:"Aşağıdaki kavram–örnek eşleştirmelerinden hangisi <u>yanlıştır</u>?",
   o:["Bir insanın ömrünün ezelde belirlenmiş olması — kader","Ezelde takdir edilen bir bebeğin dünyaya gelmesi — kaza","Suyun 100 °C'de kaynayacağının önceden ölçülüp belirlenmiş olması — kader","Hiçbir tedbir almadan sonucun gerçekleşmesini beklemek — tevekkül"],
   a:3,
   e:"Üç kavramı yan yana koyalım:\n• <b>Kader</b> = Allah'ın her şeyi ezelde bilip ölçmesi, takdir etmesi → <b>plan</b>\n• <b>Kaza</b> = takdir edilenin zamanı gelince gerçekleşmesi → <b>uygulama</b>\n• <b>Tevekkül</b> = elden gelen <b>tedbiri aldıktan sonra</b> sonucu Allah'a bırakmak\nD'deki tanım tevekkül değildir; tedbirsizce beklemek tembellik ya da tevekkülün yanlış anlaşılmasıdır. \"Deveni bağla, sonra tevekkül et.\" hadisi tam bunu anlatır. ✔ Aradığımız yanlış eşleştirme bu.\nA ve C: ikisinde de \"belirlenmiş olması\" var → bilme/ölçme aşaması → kader. Doğru.\nB: bir olay <b>fiilen gerçekleşmiş</b> → kaza. Doğru.\nBu ayrım ilk iki denemede de gitti, o yüzden üçüncü kez ve bu kez üç kavram bir arada soruldu.\nTek cümlede: <b>Kader yazılır, kaza yaşanır, tevekkül çalıştıktan sonra gelir.</b>"},

  {s:"Din Kültürü",t:"Evrendeki yasalar",d:1,
   q:"Bir tohumun toprakta çimlenmesi, büyüyüp gelişmesi ve zamanı gelince meyve vermesi, Allah'ın evrene koyduğu hangi tür yasalarla açıklanır?",
   o:["Fiziksel yasalar","Biyolojik yasalar","Toplumsal yasalar","Ahlaki yasalar"],
   a:1,
   e:"Allah'ın evrene koyduğu değişmez yasalara <b>sünnetullah</b> denir ve üçe ayrılır:\n• <b>Fiziksel yasalar</b> — madde ve enerji: suyun kaynaması, yer çekimi, ışığın yayılması.\n• <b>Biyolojik yasalar</b> — canlılar: doğum, çimlenme, büyüme, üreme, ölüm. ✔\n• <b>Toplumsal yasalar</b> — toplumlar: adaletin olmadığı toplumların çözülmesi, birliğin güç getirmesi.\nTohum bir <b>canlıdır</b>; çimlenmesi, büyümesi ve meyve vermesi canlılık olaylarıdır → biyolojik yasalar.\nD şıkkı çeldirici: ahlaki yasalar insanın davranışlarıyla ilgilidir ve evrenin işleyiş yasalarından ayrıdır.\nAyırt etme yolu: olayın <b>öznesine</b> bak. Canlı mı (biyolojik), madde mi (fiziksel), toplum mu (toplumsal)?\nİnce ayrım: \"tohumun büyümesi\" biyolojik, ama \"tohuma düşen güneş ışığı\" fiziksel yasadır."},

  /* --- İNGİLİZCE (2) --- */
  {s:"İngilizce",t:"Friendship · personality adjectives",d:1,
   q:"Ceren never shares anything with her friends. She only thinks about herself and her own plans. She is really ................ .",
   o:["generous","patient","honest","selfish"],
   a:3,
   e:"Önce cümlenin işaretini bul: hiçbir şeyi paylaşmıyor, sadece kendini düşünüyor → açıkça <b>olumsuz</b> bir özellik.\nŞıkların anlamları:\n• generous = cömert (olumlu)\n• patient = sabırlı (olumlu)\n• honest = dürüst (olumlu)\n• <b>selfish = bencil</b> (olumsuz) ✔\nÜç şık olumlu, bir şık olumsuz. Sadece \"never shares\" ve \"only thinks about herself\" ifadelerini anlayarak doğruyu bulabilirdin — \"selfish\" kelimesini hiç bilmesen bile.\nBu üç adımlık sıra her boşluk doldurma sorusunda işler:\n<b>1)</b> Cümle olumlu mu olumsuz mu? <b>2)</b> Bildiğin şıkları ele. <b>3)</b> Kalanı işaretle.\nUnit 1 tekrar kelimeleri: selfish (bencil), generous (cömert), supportive (destekleyici), reliable (sözünde duran), stubborn (inatçı), jealous (kıskanç), trustworthy (güvenilir), helpful (yardımsever)."},

  {s:"İngilizce",t:"Teen Life · reading a schedule",d:3,
   q:"[P]DENIZ'S WEEK\nMonday – Friday: study English (2 hours a day)\nSaturday: play basketball, visit his grandparents\nSunday: get up at 11 a.m., read books[/P]According to the schedule, which one is <u>true</u>?",
   o:["Deniz spends ten hours a week studying English.","Deniz plays basketball both at the weekend and on weekdays.","Deniz gets up early on Sundays.","Deniz visits his grandparents twice a week."],
   a:0,
   e:"Bu soru bir çizelge yorumu — LGS İngilizce'sinde her yıl bu tipten soru çıkar. Şıkları tek tek çizelgeyle karşılaştır:\nA → Pazartesi'den Cuma'ya <b>5 gün</b>, günde <b>2 saat</b>. 5 × 2 = <b>10 saat</b>. ✔ Doğru olan bu.\nB → Basketbol yalnızca Cumartesi günü var. \"Weekdays\" (hafta içi) günlerinde basketbol yok → yanlış.\nC → Pazar günü saat <b>11'de</b> kalkıyor; bu \"early\" (erken) değil, \"late\" (geç) olur → yanlış.\nD → Büyükanne-büyükbabasını yalnızca Cumartesi, yani <b>haftada bir kez</b> ziyaret ediyor; \"twice a week\" iki kez demek → yanlış.\nBilmen gereken sözcükler: <b>weekday</b> = hafta içi günü, <b>weekend</b> = hafta sonu, <b>once a week</b> = haftada bir, <b>twice a week</b> = haftada iki, <b>three times a week</b> = haftada üç.\nPüf noktası: çizelge sorularında şıkları <b>okumadan</b> çizelgeye bakma. Her şıkta bir sayı ya da bir gün adı vardır; onu çizelgede bul, tut. Doğru şık genelde küçük bir hesap gerektirir — burada 5 × 2 idi."}
  ]
},
{

  questions:[
  /* --- TÜRKÇE (5) --- */
  {s:"Türkçe",t:"Fiilimsiler · adlaşmış sıfat-fiil",d:2,
   q:"Aşağıdaki cümlelerin hangisinde adlaşmış sıfat-fiil kullanılmıştır?",
   o:["Gelen misafirleri kapıda güler yüzle karşıladı.","Sabahları erken kalkmak ona çok zor geliyor.","Koşarak eve doğru ilerlemeye başladı.","Anlatılanlar hepimizi derinden etkiledi."],
   a:3,
   e:"Adlaşmış sıfat-fiil: nitelediği isim düşmüş, sıfat-fiilin kendisi o ismin yerine geçmiştir. Türü değişmez, sıfat-fiil olarak kalır.\nD'de \"anlatılanlar\" = \"anlatılan sözler/şeyler\" — nitelenen isim düşmüş, sıfat-fiil adlaşmış. ✔\nA'da \"gelen\" de bir sıfat-fiil ama arkasında \"misafirleri\" ismi duruyor, yani adlaşmamış — normal sıfat-fiil.\nB'de \"kalkmak\" isim-fiil, C'de \"koşarak\" zarf-fiildir.\nGeçen denemede tam bu tuzağa düşmüştün: \"Anlatılanları dinledi\" cümlesindeki \"anlatılan\"a isim-fiil demiştin. Test şu: sözcüğün arkasına gizli bir isim koyabiliyor musun? \"anlatılan sözler\" → oluyor → sıfat-fiil. \"koşmayı\" → \"koşma şeyi\" → olmuyor → isim-fiil."},

  {s:"Türkçe",t:"Fiilimsiler · zarf-fiilin anlamı",d:2,
   q:"Aşağıdaki cümlelerin hangisinde zarf-fiil, cümleye <u>durum</u> anlamı katmıştır?",
   o:["Yağmur başlayınca hep birlikte içeri girdik.","Kapıyı çalmadan odaya girdi.","Havalar soğuduğu için kalorifer yakıldı.","Sınav bitince salondan çıkabilirsiniz."],
   a:1,
   e:"Zarf-fiilin kattığı anlamı bulmak için yükleme soru sorarız.\nB: \"Nasıl girdi?\" → çalmadan → <b>durum</b>. ✔ (-madan/-meden durum bildirir)\nA ve D: \"Ne zaman?\" → -ınca / -ince → zaman.\nC: \"Neden?\" → -dığı için → sebep.\nKüçük tablo aklında kalsın:\n• Zaman: -ınca/-ince, -ken, -dıkça, -r ...-maz, -alı\n• Durum: -arak/-erek, -madan/-meden, -ip\n• Sebep: -dığı için, -diğinden\nGeçen denemede bu konuyu \"görmedik\" diye işaretlemiştin; artık Dersler sekmesindeki L01'de anlatımı var, o yüzden bu kez soruldu."},

  {s:"Türkçe",t:"Fiilimsiler · parçada sayma",d:3,
   q:"[P]Sabah erken kalkıp pencereyi açtım. Yağmurdan ıslanmış sokaklar, güneşin vurmasıyla pırıl pırıl parlıyordu. Uzaktan gelen simitçinin sesi bütün mahalleyi dolaşıyordu.[/P]Bu parçada kaç tane fiilimsi vardır?",
   o:["2","3","4","5"],
   a:2,
   e:"Önce yüklemleri bul ve onları ele: <b>açtım, parlıyordu, dolaşıyordu</b> — üçü de kip ve kişi eki almış çekimli fiil, fiilimsi olamaz.\nKalan eylem kökenli sözcükler:\n• kalk<b>ıp</b> → zarf-fiil (1)\n• ıslan<b>mış</b> → sıfat-fiil, \"sokaklar\"ı nitelemiş (2)\n• vur<b>ma</b>sıyla → isim-fiil (3)\n• gel<b>en</b> → sıfat-fiil, \"ses\"i nitelemiş (4)\nToplam <b>4</b> fiilimsi. ✔\nDikkat: \"ıslanmış\" burada sıfat-fiildir çünkü arkasından gelen ismi nitelemiş. \"Sokaklar ıslanmış.\" deseydik yüklem olurdu ve fiilimsi sayılmazdı — aynı ek, farklı görev.\nPüf noktası: parçada fiilimsi sayarken önce bütün yüklemlerin üstünü çiz, sonra kalanları tek tek sorgula. Bu sıra şaşmaz."},

  {s:"Türkçe",t:"Parçada anlam · çıkarım",d:3,
   q:"[P]Bir usta, çırağına bir taş verip \"Bunu pazara götür ama sakın satma; sadece kaç para verdiklerini öğren, dön\" der. Çırak pazara gider, taşa üç kuruş teklif edilir. Usta bu kez onu kuyumcuya yollar; kuyumcu aynı taşa bin altın verir. Usta, dönen çırağa şunu söyler: \"Taşın değeri değişmedi; değişen, ona bakan gözün bilgisiydi.\"[/P]Bu parçadan aşağıdakilerden hangisi çıkarılamaz?",
   o:["Ustanın asıl amacı, çırağına taş satmayı öğretmektir.","Bir şeyin değeri, ona bakan kişinin bilgisine göre farklı görülebilir.","Aynı nesne farklı ortamlarda farklı karşılıklar bulabilir.","Değer biçmek, değer biçenin yeterliliğiyle ilgilidir."],
   a:0,
   e:"\"Çıkarılamaz\" soruları eleme yöntemiyle çözülür: parçada dayanağı olan seçenekleri tek tek eleyip geriye kalanı işaretlersin.\nB → \"değişen, ona bakan gözün bilgisiydi\" cümlesi doğrudan söylüyor. Elenir.\nC → aynı taş pazarda üç kuruş, kuyumcuda bin altın. Elenir.\nD → B ile aynı düşüncenin başka sözlerle ifadesi. Elenir.\nA → Usta zaten en başta \"<b>sakın satma</b>\" demiş. Amacı satış öğretmek değil, çırağına bir ders vermek. Parçayla açıkça çelişiyor → çıkarılamaz. ✔\nPüf noktası: bu tip sorularda parçayla <b>çelişen</b> seçenek genelde cevaptır. Metinde hiç geçmeyen bir ayrıntı da cevap olabilir; ama açık bir çelişki varsa hiç düşünme, o şıkkı işaretle."},

  {s:"Türkçe",t:"Sözcükte anlam · terim anlam",d:1,
   q:"Aşağıdaki cümlelerin hangisinde altı çizili sözcük terim anlamıyla kullanılmıştır?",
   o:["Bahçedeki çınarın <u>kökü</u> çok derine inmişti.","Bu sözcüğün <u>kökü</u> Arapçadan gelmektedir.","Sorunun <u>kökü</u>ne inmeden çözüm bulunmaz.","Çiçeği <u>kökü</u>yle birlikte saksıya aktardı."],
   a:1,
   e:"Terim anlam: bir sözcüğün belirli bir bilim, sanat ya da meslek dalına ait özel anlamıdır.\nB'de \"kök\" dil bilgisine ait bir terimdir (sözcüğün anlamlı en küçük parçası). ✔\nA ve D'de \"kök\" bitkinin toprak altındaki bölümü → gerçek anlam.\nC'de \"sorunun kökü\" = kaynağı, aslı → mecaz anlam.\nPüf noktası: sözcüğü bir ders kitabında, o dersin konusu olarak görebiliyorsan terimdir. \"Kök\" hem biyolojide hem dil bilgisinde terimdir; hangi bağlamda geçtiğine bak."},

  /* --- MATEMATİK (5) --- */
  {s:"Matematik",t:"Üslü ifadeler · çarpma",d:1,
   q:"2⁻³ · 4² işleminin sonucu kaçtır?",
   o:["1/2","1","2","8"],
   a:2,
   e:"Üslü ifadelerde işlem yaparken <b>önce tabanları eşitle</b>.\n4 = 2² olduğuna göre 4² = (2²)² = 2⁴ (üslü bir sayının üssü alınırken üsler çarpılır).\nŞimdi tabanlar aynı, çarpmada üsler toplanır:\n2⁻³ · 2⁴ = 2⁻³⁺⁴ = 2¹ = <b>2</b> ✔\nSık yapılan hatalar:\n• 2⁻³'ü −8 sanmak. Negatif üs sayıyı negatif yapmaz, ters çevirir: 2⁻³ = 1/2³ = 1/8.\n• (2²)² için üsleri toplayıp 2³ demek. Üssün üssünde üsler <b>çarpılır</b>: 2 · 2 = 4.\nKontrol: 1/8 · 16 = 2 ✔"},

  {s:"Matematik",t:"Üslü ifadeler · bilimsel gösterim",d:2,
   q:"Bir bakterinin uzunluğu 0,000045 metredir.\nBu sayının bilimsel gösterimi aşağıdakilerden hangisidir?",
   o:["45 · 10⁻⁶","4,5 · 10⁻⁴","0,45 · 10⁻⁴","4,5 · 10⁻⁵"],
   a:3,
   e:"Bilimsel gösterimde sayı <b>a · 10ⁿ</b> biçiminde yazılır ve a mutlaka <b>1 ile 10 arasında</b> olmalıdır (1 ≤ a < 10).\n0,000045 sayısında virgülü sağa kaydırarak 4,5'i elde ederiz. Kaç basamak kaydırdık?\n0,000045 → 4,5 için virgül <b>5 basamak</b> sağa gitti.\nVirgül sağa kaydığında üs negatif olur: <b>4,5 · 10⁻⁵</b> ✔\nDiğerleri neden yanlış:\n• A: 45 · 10⁻⁶ sayısal olarak eşit ama 45 > 10 olduğu için bilimsel gösterim değildir.\n• B: 4,5 · 10⁻⁴ = 0,00045 — bir sıfır eksik.\n• C: 0,45 < 1 olduğu için kural dışı.\nPüf noktası: \"değeri eşit mi?\" değil, \"<b>kurala uygun mu?</b>\" diye sor. Bilimsel gösterim sorularında çeldiriciler genelde değeri doğru ama biçimi yanlış olan şıklardır."},

  {s:"Matematik",t:"EBOB problemi",d:2,
   q:"Bir marangoz, 45 cm ve 60 cm uzunluğundaki iki tahtayı hiç artmayacak biçimde eşit uzunlukta parçalara ayıracaktır.\nParçalar mümkün olan en uzun boyda olduğuna göre marangoz toplam kaç parça elde eder?",
   o:["3","4","7","15"],
   a:2,
   e:"\"Hiç artmayacak biçimde\" + \"en uzun\" → EBOB.\n45 = 3² · 5\n60 = 2² · 3 · 5\nEBOB = 3 · 5 = 15 cm → bir parçanın uzunluğu.\nBirinci tahtadan: 45 ÷ 15 = 3 parça\nİkinci tahtadan: 60 ÷ 15 = 4 parça\nToplam: 3 + 4 = <b>7 parça</b> ✔\n<b>Dikkat!</b> D şıkkındaki 15, parçanın <b>uzunluğu</b> — soru parça <b>sayısını</b> istiyor. A ve B ise tek bir tahtadan çıkan parça sayısı; ikisini toplaman gerekiyordu.\nGeçen denemede karton sorusunda tam olarak bu hatayı yapmıştın: EBOB'u doğru buldun ve onu işaretledin.\nBugünden alışkanlık: işlemi bitirdiğinde şıklara bakmadan önce sorunun son cümlesini bir kez daha oku. \"Bulduğum şey, istenen şey mi?\" Üç saniye sürer, netini bir buçuk artırır."},

  {s:"Matematik",t:"EKOK problemi",d:2,
   q:"İki ışıklı tabeladan biri 15 saniyede bir, diğeri 25 saniyede bir yanıp sönmektedir. İkisi aynı anda yandıktan sonra 10 dakika boyunca izleniyor.\nBu süre içinde iki tabela kaç kez daha aynı anda yanar?",
   o:["7","8","9","12"],
   a:1,
   e:"\"Tekrar aynı anda\" → ortak kat → EKOK.\n15 = 3 · 5\n25 = 5²\nEKOK = 3 · 5² = 75 saniye. Yani her 75 saniyede bir birlikte yanarlar.\n10 dakika = 10 · 60 = <b>600 saniye</b>. (Birimleri eşitlemeyi unutma!)\n600 ÷ 75 = <b>8 kez</b> ✔\nİstersen tek tek de sayabilirsin: 75, 150, 225, 300, 375, 450, 525, 600 → 8 tane.\nSık yapılan hata: dakikayı saniyeye çevirmeden işleme başlamak. Problemde iki farklı birim geçiyorsa (dakika ve saniye), hesaba girmeden önce ikisini aynı birime çevir.\nHatırlatma: <b>bölüyorsan EBOB, bekliyorsan EKOK.</b>"},

  {s:"Matematik",t:"Bölme · kalanlı problem",d:3,
   q:"Bir doğal sayının 12 ile bölümünden kalan 5, 18 ile bölümünden de kalan 5'tir.\nBu koşulu sağlayan en küçük üç basamaklı doğal sayı kaçtır?",
   o:["105","113","118","149"],
   a:1,
   e:"Bir sayı hem 12'ye hem 18'e bölündüğünde <b>aynı kalanı</b> veriyorsa, o sayıdan kalanı çıkardığımızda kalan kısım ikisine de tam bölünür — yani EKOK'un katıdır.\nSayı = EKOK(12, 18) · k + 5\n12 = 2² · 3, 18 = 2 · 3² → EKOK = 2² · 3² = 36\nSayı = 36k + 5\nk = 1 → 41 (iki basamaklı)\nk = 2 → 77 (iki basamaklı)\nk = 3 → <b>113</b> ✔ ilk üç basamaklı sayı\nKontrol: 113 = 12 · 9 + 5 ✔ ve 113 = 18 · 6 + 5 ✔\nDiğer şıklar:\n• 105: 12'ye bölümünden kalan 9 → olmaz.\n• 118: 12'ye bölümünden kalan 10 → olmaz.\n• 149 = 36 · 4 + 5, koşulu <b>sağlıyor</b> ama 113'ten büyük — soru <b>en küçüğü</b> istiyor. Klasik tuzak.\nPüf noktası: \"aynı kalanı veren sayı\" gördüğünde formül hazır → <b>EKOK · k + kalan</b>."},

  /* --- FEN (4) --- */
  {s:"Fen Bilimleri",t:"DNA · nükleotid yapısı",d:1,
   q:"DNA'nın yapı birimi olan bir nükleotidin adı neye göre belirlenir?",
   o:["İçerdiği organik baza göre","İçerdiği fosfat grubunun sayısına göre","İçerdiği şekerin çeşidine göre","Bağlandığı nükleotid sayısına göre"],
   a:0,
   e:"Bir nükleotid üç parçadan oluşur: <b>fosfat + deoksiriboz şekeri + organik baz</b>.\nBunlardan fosfat ve şeker bütün nükleotidlerde <b>aynıdır</b> — o yüzden ayırt edici olamazlar. Değişen tek parça organik bazdır, bu yüzden nükleotide adını o verir. ✔\nDNA'da dört baz vardır: adenin, timin, guanin, sitozin. Bazın adı neyse nükleotidin adı da odur: adenin bazı taşıyan nükleotide \"adenin nükleotidi\" denir.\nB yanlış: her nükleotidde bir tane fosfat vardır, sayı değişmez.\nC yanlış: DNA'daki şeker her zaman deoksiribozdur (riboz RNA'da bulunur).\nD yanlış: nükleotidin adı komşularına göre değişmez.\nAklında kalsın: <b>fosfat ve şeker herkeste ortak, baz kimliktir.</b>"},

  {s:"Fen Bilimleri",t:"DNA · baz eşleşmesi hesabı",d:2,
   q:"Bir DNA molekülünde toplam 800 nükleotid bulunmaktadır ve bunların 240 tanesi adenin nükleotididir.\nBuna göre bu DNA molekülünde kaç tane sitozin nükleotidi vardır?",
   o:["80","120","160","320"],
   a:2,
   e:"Chargaff kuralı: DNA'da <b>adenin timinle</b>, <b>guanin sitozinle</b> eşleşir. Yani A = T ve G = C.\nAdım adım:\nA = 240 → T = 240\nA + T = 240 + 240 = 480\nGeriye kalan: 800 − 480 = 320 → bunlar guanin ve sitozin nükleotidleridir.\nG = C olduğuna göre: 320 ÷ 2 = <b>160</b> sitozin ✔\nDiğer şıklar nereden geliyor:\n• 320 → G + C toplamı; ikiye bölmeyi unutanlar için tuzak.\n• 120 → adenin sayısını gereksiz yere ikiye bölmek.\n• 80 → bir kez fazla bölmek.\nPüf noktası: bu tip sorularda sıra hep aynıdır → önce A = T yaz, toplamdan çıkar, kalanı ikiye böl."},

  {s:"Fen Bilimleri",t:"DNA · kendini eşleme",d:2,
   q:"DNA kendini eşlediğinde oluşan iki yeni DNA molekülüyle ilgili aşağıdakilerden hangisi doğrudur?",
   o:["Her ikisi de tamamen yeni sentezlenmiş zincirlerden oluşur.","Her birinde bir eski (kalıp), bir yeni zincir bulunur.","Biri tamamen eski, diğeri tamamen yeni zincirlerden oluşur.","Nükleotid dizilimleri birbirinden farklı olur."],
   a:1,
   e:"DNA'nın kendini eşlemesi (replikasyon) şöyle olur: iki zincir bir fermuar gibi ayrılır, her zincir bir <b>kalıp</b> görevi görür ve karşısına uygun bazlar getirilerek yeni bir zincir sentezlenir.\nSonuçta ortaya çıkan her DNA molekülünde <b>bir eski, bir yeni</b> zincir bulunur. ✔ Bu özelliğe <b>yarı korunumlu eşleme</b> denir — adı da buradan gelir, yarısı korunuyor.\nA yanlış: eski zincirler kaybolmaz, kalıp olarak kullanılıp yeni moleküllerin içinde kalır.\nC yanlış: eski iki zincir ayrılıp iki farklı moleküle dağılır, bir arada kalmaz.\nD yanlış: eşleme baz eşleşme kuralına (A-T, G-C) göre yapıldığı için iki yeni molekül birbirinin ve ana DNA'nın <b>aynısıdır</b>. Zaten eşlemenin amacı da bu: kalıtsal bilginin değişmeden aktarılması.\nGörsel hatırlatma: bir fermuarı açıp her iki yarısına yeni bir yarım diktiğini düşün — iki tam fermuar elde edersin ve her birinde eskiden bir parça vardır."},

  {s:"Fen Bilimleri",t:"Mevsimler · gölge boyu ve enlem",d:3,
   q:"Kuzey Yarım Küre'de bulunan dört şehirde, 21 Aralık günü öğle saatinde yere dik tutulan 1 metrelik çubukların gölge uzunlukları ölçülmüş ve aşağıya yazılmıştır.\n\nŞehir K → 0,9 m\nŞehir L → 1,4 m\nŞehir M → 2,1 m\nŞehir N → 1,7 m\n\nBu şehirlerden Ekvator'a en yakın olanı hangisidir?",
   o:["K","L","M","N"],
   a:0,
   e:"Gölge boyu, Güneş ışınlarının düşme açısına bağlıdır: ışınlar ne kadar <b>dik</b> düşerse gölge o kadar <b>kısa</b> olur.\nKuzey Yarım Küre'de Ekvator'a yaklaştıkça Güneş ışınları daha dik düşer → gölge kısalır. Kutuplara yaklaştıkça ışınlar eğik düşer → gölge uzar.\nEn kısa gölge <b>0,9 m ile K şehri</b> → ışınları en dik alan şehir → Ekvator'a en yakın olan. ✔\nSıralama: K (0,9) en yakın, sonra L (1,4), sonra N (1,7), en uzak M (2,1).\nSeni yanıltmasın: 21 Aralık'ta Kuzey Yarım Küre'de kış yaşanır ve gölgeler yılın en uzun hâlindedir. Ama bu <b>bütün şehirler için</b> geçerli — aralarındaki karşılaştırmayı değiştirmez. Aynı gün, aynı saatte ölçüm yapıldığı için tek fark enlemden gelir.\nPüf noktası: tek cümlede özetlenir → <b>gölge uzarsa enlem büyür, gölge kısalırsa Ekvator yakındır.</b>"},

  /* --- İNKILAP (2) --- */
  {s:"İnkılap Tarihi",t:"Bir Kahraman Doğuyor · fikir hayatı",d:1,
   q:"Mustafa Kemal, Manastır Askerî İdadisi'nde arkadaşı Ömer Naci'nin etkisiyle edebiyata ve güzel konuşmaya ilgi duymuş; tarih öğretmeni Kolağası Mehmet Tevfik Bey sayesinde de tarihe merak salmıştır.\nBu bilgiden Mustafa Kemal ile ilgili aşağıdakilerden hangisi çıkarılabilir?",
   o:["Askerî derslerde başarısız olduğu","Yalnızca sayısal derslere ilgi duyduğu","Manastır'da hiç arkadaş edinemediği","Çevresindeki kişilerden etkilenerek ilgi alanlarını genişlettiği"],
   a:3,
   e:"Metinde iki farklı kişi ve o kişilerin kazandırdığı iki farklı ilgi alanı anlatılıyor: arkadaşından edebiyat ve hitabet, öğretmeninden tarih.\nBu da Mustafa Kemal'in çevresindeki insanlarla kurduğu ilişkiler sayesinde ilgi alanlarının genişlediğini gösterir. ✔\nA ve B için metinde <b>hiçbir dayanak yok</b>; hatta B, anlatılanın tam tersi (edebiyat ve tarih sözel alanlardır).\nC ise metinle doğrudan çelişiyor — Ömer Naci onun Manastır'daki arkadaşı.\nPüf noktası: \"çıkarılabilir\" soruları yalnızca metinde <b>verilen</b> bilgiyle çözülür. Konu hakkında başka doğru bildiğin şeyler cevap olamaz; sadece paragrafın söylediğine bak."},

  {s:"İnkılap Tarihi",t:"Osmanlı'da fikir akımları",d:2,
   q:"XX. yüzyılın başında Osmanlı Devleti'ni dağılmaktan kurtarmak amacıyla ortaya atılan fikir akımlarından <u>Osmanlıcılık</u>, aşağıdakilerden hangisini savunmuştur?",
   o:["Din, dil ve ırk farkı gözetmeksizin bütün Osmanlı vatandaşlarının eşit haklara sahip olmasını","Dünyadaki bütün Müslümanların halife etrafında birleşmesini","Osmanlı sınırları içindeki ve dışındaki Türklerin tek çatı altında toplanmasını","Devletin her alanda Batı'yı örnek alarak yenileşmesini"],
   a:0,
   e:"Dört fikir akımının hedef kitlesi birbirinden farklıdır:\n• <b>Osmanlıcılık</b>: din, dil, ırk ayrımı yapmadan tüm Osmanlı vatandaşlarını \"Osmanlı\" kimliği altında eşit sayarak devleti bir arada tutmak. ✔\n• <b>İslamcılık (Ümmetçilik)</b>: bütün Müslümanları halifenin etrafında birleştirmek → B.\n• <b>Türkçülük</b>: Türkleri ortak dil ve kültür etrafında toplamak → C.\n• <b>Batıcılık</b>: bilim, teknoloji ve yönetimde Batı'yı örnek almak → D.\nOsmanlıcılık, Balkan Savaşları'nda Hristiyan azınlıkların ayaklanıp bağımsızlık ilan etmesiyle geçerliliğini yitirmiştir.\nPüf noktası: akımın adı ile hedef kitlesi eşleşir. Osmanlıcılık → bütün Osmanlı vatandaşları. İslamcılık → bütün Müslümanlar. Türkçülük → bütün Türkler. Adı sana kimden bahsettiğini zaten söylüyor."},

  /* --- DİN (2) --- */
  {s:"Din Kültürü",t:"Kader ve Kaza · örnek ayırt etme",d:2,
   q:"Aşağıdaki örneklerden hangisi <u>kaza</u>ya örnek olarak gösterilebilir?",
   o:["Bir insanın ne zaman doğacağının Allah tarafından ezelde bilinmesi","Her canlının ömrünün ezelde takdir edilmiş olması","Kiraz ağacının bu ilkbaharda çiçek açması","Evrendeki yasaların önceden belirlenmiş olması"],
   a:2,
   e:"<b>Kader</b>: Allah'ın olacak her şeyi ezelî ilmiyle bilip ölçmesi ve takdir etmesi → <b>plan aşaması</b>.\n<b>Kaza</b>: takdir edilen o şeyin zamanı gelince <b>gerçekleşmesi</b> → <b>uygulama aşaması</b>.\nC'de bir olay <b>fiilen gerçekleşmiş</b>: ağaç bu ilkbaharda çiçek açtı. Takdir edilen şey yaşandı → kaza. ✔\nA, B ve D'nin hepsinde \"ezelde bilinmesi / takdir edilmiş olması / önceden belirlenmiş olması\" ifadeleri var — üçü de plan aşamasını anlatıyor, yani kader.\nGeçen denemede tam bu ayrımda takılmıştın, o yüzden bu kez örnek üzerinden soruldu.\nAyırt etme yolu: seçenekte <b>gerçekleşmiş bir olay</b> mı var, yoksa <b>bilme / takdir etme</b> mi? Olay varsa kaza, bilgi varsa kader.\nTek cümlelik hatırlatma: <b>kader yazılır, kaza yaşanır.</b>"},

  {s:"Din Kültürü",t:"Cüz'î irade ve sorumluluk",d:1,
   q:"Bir öğrenci, sınava düzenli çalışmayı kendi isteğiyle seçmiş ve yüksek bir not almıştır.\nÖğrencinin çalışmayı seçebilmesi, İslam inancında hangi kavramla açıklanır?",
   o:["Küllî irade","Ecel","Rızık","Cüz'î irade"],
   a:3,
   e:"<b>Cüz'î irade</b>: Allah'ın insana verdiği <b>sınırlı seçme özgürlüğü</b>dür. İnsanın yaptıklarından sorumlu tutulmasının sebebi tam olarak budur — seçme gücü olmasaydı sorumluluk da olmazdı. ✔\n<b>Küllî irade</b>: Allah'ın sınırsız, mutlak iradesidir; insana ait değildir.\n<b>Ecel</b>: canlıların ömrünün sona erdiği belirlenmiş vakittir.\n<b>Rızık</b>: canlıların yararlandığı her türlü nimettir.\nBu konudaki mantık zinciri şöyle işler: Allah insana cüz'î irade verdi → insan seçim yapabiliyor → seçiminden sorumlu oluyor → bu yüzden çabanın da bir karşılığı var.\nSınavda \"kendi isteğiyle\", \"seçerek\", \"tercih ederek\" gibi ifadeler geçiyorsa akla ilk gelecek kavram cüz'î iradedir."},

  /* --- İNGİLİZCE (2) --- */
  {s:"İngilizce",t:"Friendship · personality adjectives",d:2,
   q:"Mert never accepts that he is wrong. Even when everybody disagrees with him, he doesn't change his mind. He is very ................ .",
   o:["generous","stubborn","helpful","cheerful"],
   a:1,
   e:"Önce cümlenin işaretini bul: hatasını hiç kabul etmiyor, herkes karşı çıksa da fikrini değiştirmiyor → <b>olumsuz</b> bir özellik.\nŞıkların anlamları:\n• generous = cömert (olumlu)\n• <b>stubborn = inatçı</b> (olumsuz) ✔\n• helpful = yardımsever (olumlu)\n• cheerful = neşeli (olumlu)\nOlumsuz olan tek şık \"stubborn\" — kelimeyi tam bilmesen bile diğer üçünü bilerek doğruyu bulabilirdin.\nGeçen denemedeki \"supportive\" sorusunda da aynı taktik işe yarardı. Boşluk doldurmada sıra hep şu: <b>1) cümle olumlu mu olumsuz mu? 2) bildiğin şıkları ele. 3) kalanı işaretle.</b>\nBu haftanın kelimeleri (Unit 1): stubborn (inatçı), bossy (buyurgan), jealous (kıskanç), reliable (sözünde duran), generous (cömert), patient (sabırlı)."},

  {s:"İngilizce",t:"Teen Life · frequency adverbs",d:2,
   q:"[P]Selin: Do you watch TV until midnight on school nights?\nDeniz: No, I ................ stay up late on school nights, because I have to get up at 6 a.m.[/P]Which one completes the dialogue?",
   o:["always","usually","never","often"],
   a:2,
   e:"Deniz'in cevabı \"<b>No</b>\" ile başlıyor ve bir gerekçe veriyor: sabah 6'da kalkmak zorunda. Öyleyse boşluğa <b>hiç yapmadığını</b> söyleyen bir sıklık zarfı gelmelidir → <b>never</b> ✔\nSıklık zarfları (adverbs of frequency), azdan çoğa:\nnever (hiç) → rarely / seldom (nadiren) → sometimes (bazen) → often (sık sık) → usually (genellikle) → always (her zaman)\nA, B ve D'nin hepsi \"yapıyorum\" anlamına gelir; hem \"No\" ile hem de verilen gerekçeyle çelişirler.\nKullanım kuralı: sıklık zarfları normal fiillerden <b>önce</b>, \"be\" fiilinden (am / is / are) <b>sonra</b> gelir.\n• I <b>never</b> stay up late. ✔\n• She is <b>always</b> late. ✔\nPüf noktası: diyalog sorularında cevabı hep <b>diğer cümlelerde</b> ara. Buradaki iki ipucu \"No\" ve \"because I have to get up at 6\" idi."}
  ]
},
{

  questions:[
  /* --- TÜRKÇE (5) --- */
  {s:"Türkçe",t:"Fiilimsiler · isim-fiil",d:1,
   q:"Aşağıdaki cümlelerin hangisinde isim-fiil (mastar) kullanılmıştır?",
   o:["Gülen yüzünü uzun zamandır özlemiştim.","Sabahları koşmayı alışkanlık hâline getirdi.","Eve gelince önce ödevlerini yaptı.","Anlatılanları büyük bir dikkatle dinledi."],
   a:1,
   e:"İsim-fiil ekleri: -ma/-me, -ış/-iş, -mak/-mek. Bu ekleri alan fiil, cümlede isim gibi görev yapar.\nB'de \"koş-ma-yı\" isim-fiildir (neyi getirdi? koşmayı → nesne olmuş).\nA'da \"gül-en\" ve D'de \"anlat-ıl-an\" sıfat-fiil, C'de \"gel-ince\" zarf-fiildir.\nİpucu: -ma/-me ekini olumsuzluk ekiyle karıştırma. \"Koşma!\" (emir, olumsuz fiil) ile \"koşma\" (isim-fiil) farklıdır; cümledeki göreve bak."},

  {s:"Türkçe",t:"Fiilimsiler · zarf-fiil",d:2,
   q:"\"Kapıyı açınca içeride kimsenin olmadığını gördü.\"\nBu cümledeki zarf-fiil, cümleye aşağıdaki anlamlardan hangisini katmıştır?",
   o:["Durum","Zaman","Sebep","Koşul"],
   a:1,
   e:"Zarf-fiilin kattığı anlamı bulmak için yükleme soru sorarız. \"Ne zaman gördü?\" → \"Kapıyı açınca\" → zaman anlamı.\n-ince/-ınca, -dıkça, -ken, -r ...-maz ekleri zaman;\n-arak/-erek, -madan, -ıp bileşenleri durum;\n-dığı için, -diğinden sebep anlamı katar."},

  {s:"Türkçe",t:"Fiilimsiler · tanıma",d:2,
   q:"Aşağıdaki cümlelerin hangisinde fiilimsi yoktur?",
   o:["Yürüyerek okula gitti.","Okunacak kitapları rafa dizdi.","Dün akşam bize misafir geldi.","Erken kalkmak ona çok zor geliyor."],
   a:2,
   e:"A'da \"yürü-yerek\" zarf-fiil, B'de \"okun-acak\" sıfat-fiil (kitapları nitelemiş), D'de \"kalk-mak\" isim-fiildir.\nC'de ise tek eylem \"geldi\" ve bu, çekimli bir fiildir — kip ve kişi eki almış, yüklem olmuş. Fiilimsiler kip ve kişi eki almaz; aldığı anda fiilimsi olmaktan çıkar. Fiilimsi arıyorken önce cümlenin yüklemini bulup onu ayır, kalan eylemlere bak."},

  {s:"Türkçe",t:"Parçada anlam · başlık",d:2,
   q:"[P]Bir dil, yalnızca sözcüklerden oluşmaz; konuşulduğu coğrafyanın izini de taşır. Denizle iç içe yaşayan toplumların dilinde balıkçılığa dair onlarca ayrı sözcük bulunur. Karlı bölgelerde yaşayanların dilinde ise karın türlerini birbirinden ayıran kelimeler vardır. İnsan, çevresinde neyi çok görüyorsa onu adlandırmakta o kadar zenginleşir.[/P]Bu parçaya en uygun başlık aşağıdakilerden hangisidir?",
   o:["Sözcüklerin Kökeni","Dil ve Coğrafya","Denizcilik Terimleri","Dünyanın Zengin Dilleri"],
   a:1,
   e:"Başlık, parçanın tamamını kapsamalı; ne çok dar ne çok geniş olmalı.\nParça baştan sona dilin, konuşulduğu yerin coğrafyasından etkilendiğini anlatıyor → \"Dil ve Coğrafya\".\nC yalnızca bir örneği kapsıyor (çok dar), A parçada hiç işlenmiyor, D ise hangi dillerin zengin olduğu tartışması — parçada böyle bir sıralama yok."},

  {s:"Türkçe",t:"Cümlede anlam · amaç-sonuç",d:2,
   q:"Aşağıdaki cümlelerin hangisinde amaç-sonuç ilişkisi vardır?",
   o:["Hava soğuduğu için kalın giyindi.","Sınavı kazanmak için gece gündüz çalıştı.","Yağmur yağınca sokaklar bir anda boşaldı.","Çok yorulduğundan akşam erken uyudu."],
   a:1,
   e:"Amaç-sonuç cümlesinde eylem, henüz gerçekleşmemiş bir hedefe ulaşmak için yapılır ve cümleye \"hangi amaçla?\" sorusu sorulur.\nB: Hangi amaçla çalıştı? Sınavı kazanmak için → amaç-sonuç.\nA ve D'de eylemin bir gerekçesi var, hedefi değil → neden-sonuç. C'de zaman/koşul ilişkisi var.\nAyırt etme yolu: \"için\" ifadesinin önündeki söz bir fiilimsiyse (kazanmak) genelde amaç, bir yargıysa (soğuduğu) genelde nedendir."},

  /* --- MATEMATİK (5) --- */
  {s:"Matematik",t:"Asal çarpanlara ayırma",d:1,
   q:"84 sayısının birbirinden farklı asal çarpanlarının toplamı kaçtır?",
   o:["10","12","14","16"],
   a:1,
   e:"84'ü asal çarpanlarına ayıralım:\n84 = 2 · 42 = 2 · 2 · 21 = 2² · 3 · 7\nFarklı asal çarpanlar: 2, 3 ve 7.\nToplamları: 2 + 3 + 7 = 12.\n(Dikkat: soru \"farklı\" dediği için 2'yi iki kez saymıyoruz.)"},

  {s:"Matematik",t:"EKOK problemi",d:2,
   q:"Bir otobüs durağından A hattı 12 dakikada bir, B hattı 18 dakikada bir kalkmaktadır. İki hat saat 08.00'de aynı anda kalktığına göre, tekrar aynı anda kalkacakları ilk saat kaçtır?",
   o:["08.30","08.36","08.48","09.00"],
   a:1,
   e:"\"Tekrar aynı anda\" ifadesi ortak kat, yani EKOK demektir.\n12 = 2² · 3, 18 = 2 · 3²\nEKOK = 2² · 3² = 36 dakika.\n08.00 + 36 dk = 08.36.\nİpucu: \"aynı anda tekrar / birlikte / en az kaç sonra\" → EKOK; \"eşit parçalara bölme / en fazla kaçar\" → EBOB."},

  {s:"Matematik",t:"Bölünebilme kuralları",d:2,
   q:"Rakamları birbirinden farklı olan 4A6 üç basamaklı doğal sayısı 3 ile tam bölünebilmektedir.\nBuna göre A'nın alabileceği en büyük değer kaçtır?",
   o:["2","5","8","9"],
   a:2,
   e:"3'e bölünebilme kuralı: rakamlar toplamı 3'ün katı olmalıdır.\n4 + A + 6 = 10 + A\n10 + A'nın 3'ün katı olması için A = 2 (12), A = 5 (15) veya A = 8 (18) olabilir.\nA = 9 olsaydı toplam 19 olurdu, 3'e bölünmez.\nEn büyük değer 8'dir. (Rakamların farklı olması şartı da sağlanıyor: 4, 8, 6.)"},

  {s:"Matematik",t:"EBOB problemi",d:2,
   q:"Boyutları 24 cm ve 36 cm olan dikdörtgen şeklindeki bir karton, hiç artmayacak biçimde eş karelere bölünecektir.\nKareler mümkün olan en büyük boyutta olduğuna göre kaç kare elde edilir?",
   o:["4","6","8","12"],
   a:1,
   e:"Karelerin en büyük olması için kenar uzunluğu EBOB(24, 36) olmalıdır.\n24 = 2³ · 3, 36 = 2² · 3² → EBOB = 2² · 3 = 12 cm.\nUzun kenarda 36 ÷ 12 = 3 kare, kısa kenarda 24 ÷ 12 = 2 kare.\nToplam 3 · 2 = 6 kare.\nSık yapılan hata: 12'yi cevap sanmak. 12, karenin kenar uzunluğu — soru kare sayısını istiyor."},

  {s:"Matematik",t:"Ortak katlar",d:2,
   q:"1'den 100'e kadar olan doğal sayılardan kaç tanesi hem 4'ün hem de 6'nın katıdır?",
   o:["6","7","8","9"],
   a:2,
   e:"Hem 4'ün hem 6'nın katı olan sayılar, EKOK(4, 6)'nın katlarıdır.\n4 = 2², 6 = 2 · 3 → EKOK = 12.\n12'nin 100'e kadar olan katları: 12, 24, 36, 48, 60, 72, 84, 96 → 8 tane.\nPratik yol: 100 ÷ 12 = 8 (kalanı at) → 8 tane."},

  /* --- FEN (4) --- */
  {s:"Fen Bilimleri",t:"Mevsimler · eksen eğikliği",d:1,
   q:"Dünya'nın eksen eğikliği ortadan kalksaydı, aşağıdakilerden hangisi gerçekleşirdi?",
   o:["Gece ve gündüz oluşmazdı.","Mevsimler oluşmazdı.","Dünya, Güneş'in etrafında dolanmayı bırakırdı.","Dünya'nın kendi ekseni etrafındaki dönüşü dururdu."],
   a:1,
   e:"Mevsimlerin oluşması için iki şart gerekir: Dünya'nın Güneş çevresinde dolanması VE eksenin 23°27' eğik olması. Eğiklik olmasaydı Güneş ışınları yıl boyunca her yere aynı açıyla düşer, sıcaklık farkı oluşmaz, mevsimler yaşanmazdı.\nA yanlış: gece-gündüz, eksen eğikliğinden değil, Dünya'nın kendi ekseni etrafındaki dönüşünden kaynaklanır — eğiklik olmasa da devam ederdi.\nC ve D, eksen eğikliğiyle ilgisi olmayan hareketlerdir."},

  {s:"Fen Bilimleri",t:"Mevsimler · ekinokslar",d:2,
   q:"21 Mart ve 23 Eylül tarihleriyle ilgili aşağıdakilerden hangisi doğrudur?",
   o:["Güneş ışınları Ekvator'a dik düşer, gece ve gündüz süreleri her yerde eşittir.","Güneş ışınları Yengeç Dönencesi'ne dik düşer.","Kuzey Yarım Küre'de gündüzler yılın en uzun değerine ulaşır.","Her iki yarım kürede de aynı mevsim yaşanmaya başlar."],
   a:0,
   e:"21 Mart ve 23 Eylül ekinoks (gün-tün eşitliği) tarihleridir: Güneş ışınları Ekvator'a dik düşer, tüm Dünya'da gece 12 saat, gündüz 12 saattir.\nB yanlış: Yengeç Dönencesi'ne dik düşme 21 Haziran'dadır.\nC yanlış: en uzun gündüz 21 Haziran'dadır.\nD yanlış: iki yarım kürede her zaman zıt mevsimler yaşanır — 21 Mart'ta Kuzey'de ilkbahar, Güney'de sonbahar başlar."},

  {s:"Fen Bilimleri",t:"İklim ve hava olayları",d:1,
   q:"İklim ile hava olayları arasındaki fark ile ilgili aşağıdakilerden hangisi doğrudur?",
   o:["Hava olayları uzun yıllara ait ortalamalarla belirlenir.","İklimi meteoroloji uzmanları, hava olaylarını klimatologlar inceler.","İklim geniş bir bölgede ve uzun sürede; hava olayları dar bir alanda ve kısa sürede etkilidir.","İklim, gün içinde bile değişebilen bir olaydır."],
   a:2,
   e:"Hava olayları: dar bir alanda, kısa sürede (saatler-günler) görülen atmosfer olaylarıdır; meteoroloji uzmanları inceler.\nİklim: geniş bir bölgede, uzun yıllar (en az 30-35 yıl) boyunca tekrarlanan ortalama hava durumudur; klimatologlar inceler.\nB seçeneği bu iki uzmanlığı yer değiştirmiş, A ve D ise iklimin özelliğini hava olaylarına yüklemiştir."},

  {s:"Fen Bilimleri",t:"Işınların düşme açısı",d:2,
   q:"Güneş ışınlarının yeryüzüne düşme açısı büyüdükçe aşağıdakilerden hangisi gerçekleşir?",
   o:["Birim yüzeye düşen enerji miktarı azalır.","Cisimlerin gölge boyu uzar.","Aynı miktardaki ışık daha dar bir alana düşer ve sıcaklık artar.","Yüzeyin sıcaklığı düşer."],
   a:2,
   e:"Düşme açısı büyüdükçe (ışınlar dikleştikçe) aynı miktardaki ışık enerjisi daha küçük bir alana yayılır. Birim yüzeye düşen enerji artar, sıcaklık yükselir, gölge boyu kısalır.\nElindeki el fenerini duvara önce dik, sonra eğik tuttuğunu düşün: dik tuttuğunda ışık lekesi küçük ve parlak, eğik tuttuğunda geniş ve soluk olur. Yaz ve kış farkı da tam olarak budur."},

  /* --- İNKILAP (2) --- */
  {s:"İnkılap Tarihi",t:"Bir Kahraman Doğuyor · eğitim",d:2,
   q:"Mustafa'nın eğitimi konusunda annesi Zübeyde Hanım geleneksel mahalle mektebini, babası Ali Rıza Efendi ise yeni yöntemlerle eğitim veren Şemsi Efendi Okulu'nu istemiştir. Sonuçta Mustafa önce dualarla mahalle mektebine başlamış, kısa bir süre sonra Şemsi Efendi Okulu'na geçmiştir.\nBu durum aşağıdakilerden hangisinin göstergesidir?",
   o:["Ailede hem geleneğin hem yeniliğin gözetildiğinin","Mustafa'nın okumaya isteksiz olduğunun","Selanik'te yeterli okul bulunmadığının","Ailenin maddi durumunun elverişsiz olduğunun"],
   a:0,
   e:"Metinde iki farklı tercih var: annenin geleneksel yaklaşımı ve babanın yeniliğe açık yaklaşımı. Uygulanan çözüm ise ikisini de dikkate almış — önce geleneğe uygun olarak dualarla mahalle mektebine başlanmış, sonra modern okula geçilmiştir.\nBu tip \"neyin göstergesidir\" sorularında metinde AÇIKÇA verilen bilgiden çıkarım yapılır; B, C ve D için metinde hiçbir dayanak yoktur."},

  {s:"İnkılap Tarihi",t:"Bir Kahraman Doğuyor · Kemal adı",d:1,
   q:"Mustafa'ya \"Kemal\" adının verilmesiyle ilgili aşağıdaki bilgilerden hangisi doğrudur?",
   o:["Manastır Askerî İdadisi'nde tarih öğretmeni tarafından verilmiştir.","Selanik Askerî Rüştiyesi'nde matematik öğretmeni tarafından verilmiştir.","Harp Okulu'nda sınıf arkadaşları tarafından verilmiştir.","Doğduğunda babası tarafından konulmuştur."],
   a:1,
   e:"Selanik Askerî Rüştiyesi'ndeki matematik öğretmeninin adı da Mustafa'ydı. \"İkimizin adı da Mustafa, aramızda bir fark olsun\" diyerek ona olgunluk, yetkinlik anlamına gelen \"Kemal\" adını vermiştir.\nManastır Askerî İdadisi'ndeki tarih öğretmeni Kolağası Mehmet Tevfik Bey'dir; onun katkısı Mustafa Kemal'in tarih sevgisini geliştirmesidir — adı veren o değildir. \"Atatürk\" soyadı ise 1934'te TBMM tarafından verilmiştir."},

  /* --- DİN (2) --- */
  {s:"Din Kültürü",t:"Kader ve Kaza",d:1,
   q:"Allah'ın ezelde takdir ettiği şeylerin, zamanı gelince gerçekleşmesine ne ad verilir?",
   o:["Kader","Kaza","Tevekkül","Rızık"],
   a:1,
   e:"Kader: Allah'ın olacak her şeyi ezelî ilmiyle bilip ölçüp planlamasıdır (plan aşaması).\nKaza: bu planın zamanı gelince gerçekleşmesidir (uygulama aşaması).\nKısa hatırlatma: kader yazılan, kaza yaşanandır.\nTevekkül, tedbir aldıktan sonra Allah'a güvenmek; rızık ise canlıların yararlandığı her türlü nimettir."},

  {s:"Din Kültürü",t:"Evrendeki ölçü ve düzen",d:2,
   q:"\"Güneş ve Ay bir hesaba göre hareket etmektedir.\" (Rahmân suresi, 5. ayet)\nBu ayet evrenle ilgili aşağıdakilerden hangisini vurgulamaktadır?",
   o:["Evrende belli bir ölçü ve düzenin bulunduğunu","İnsanın davranışlarından sorumlu olduğunu","Ahiret hayatının mutlaka geleceğini","İbadetlerin belirli vakitlerde yapılması gerektiğini"],
   a:0,
   e:"Ayette geçen \"bir hesaba göre\" ifadesi, gök cisimlerinin rastgele değil, belirlenmiş bir ölçü ve düzen içinde hareket ettiğini anlatır. Bu düzene İslam düşüncesinde \"sünnetullah\" (Allah'ın evrene koyduğu değişmez yasalar) denir.\nB, C ve D doğru bilgiler olabilir ama bu ayetin doğrudan vurguladığı konu değildir. Ayet sorularında, ayetin kendi sözcüklerine (\"hesap\", \"ölçü\", \"düzen\") tutunmak doğru şıkkı bulmayı kolaylaştırır."},

  /* --- İNGİLİZCE (2) --- */
  {s:"İngilizce",t:"Friendship · making invitations",d:1,
   q:"[P]Betül: I'm having a picnic with my friends on Sunday. ................ ?\nKaan: I'd love to! What time does it start?[/P]Which one completes the dialogue?",
   o:["Why don't you come with us","What do you think about picnics","How often do you go camping","Where do you live now"],
   a:0,
   e:"Kaan'ın cevabı \"I'd love to!\" (çok isterim) — bu, bir DAVETİ kabul etme kalıbıdır. Öyleyse boşluğa bir davet cümlesi gelmelidir.\nDavet kalıpları: Why don't you...? / Would you like to...? / How about ...ing? / Let's...\nB fikir sorar, C sıklık sorar, D yer sorar; hiçbirinin cevabı \"I'd love to\" olamaz."},

  {s:"İngilizce",t:"Friendship · vocabulary",d:2,
   q:"My friend Ayşe never gets angry with me and she always listens to my problems patiently. She is a very ................ friend.",
   o:["selfish","supportive","careless","noisy"],
   a:1,
   e:"Cümlede anlatılan davranışlar olumlu: hiç kızmıyor, sorunları sabırla dinliyor → destekleyici bir arkadaş = supportive.\nDiğer sözcükler: selfish = bencil, careless = dikkatsiz/umursamaz, noisy = gürültücü. Üçü de cümledeki olumlu tabloya uymaz.\nBoşluk doldurma sorularında önce cümlenin olumlu mu olumsuz mu olduğunu belirle; bu tek başına iki-üç şıkkı eler."}
  ]
},

  questions:[
  /* ---------------- TÜRKÇE (10) ---------------- */
  {s:"Türkçe",t:"Sözcükte anlam",d:1,
   q:"Aşağıdaki cümlelerin hangisinde altı çizili sözcük mecaz anlamda kullanılmıştır?",
   o:["Çocuk, elindeki <u>ağır</u> çantayı zorlukla taşıyordu.","Tartışmanın sonunda çok <u>ağır</u> sözler söyledi.","Kutunun içinde <u>ağır</u> bir alet duruyordu.","Sırtındaki yük ona iyice <u>ağır</u> gelmeye başladı."],
   a:1,
   e:"Mecaz anlam, sözcüğün gerçek anlamından tamamen uzaklaşarak kullanılmasıdır. A, C ve D'de \"ağır\" kütlesi fazla anlamındadır (gerçek anlam). B'de ise \"ağır sözler\" kırıcı, incitici sözler demektir — sözcük gerçek anlamından uzaklaşmıştır."},

  {s:"Türkçe",t:"Deyimler",d:2,
   q:"Aşağıdaki cümlelerin hangisinde deyim, anlamına uygun kullanılmamıştır?",
   o:["Sınavdan düşük not alınca eli ayağına dolaştı, ne söyleyeceğini şaşırdı.","Yeni öğretmenimiz kısa sürede gönüllere taht kurdu, herkes onu çok sevdi.","Arkadaşının başarısını duyunca burun kıvırdı, onu candan kutladı.","Yıllar sonra buluşan iki dost uzun uzun hasret giderdi."],
   a:2,
   e:"\"Burun kıvırmak\" beğenmemek, küçümsemek demektir. Cümlenin devamındaki \"onu candan kutladı\" ifadesi bu anlamla çelişiyor. Deyim, cümlenin anlamına ters düştüğü için yanlış kullanılmıştır."},

  {s:"Türkçe",t:"Parçada anlam · ana düşünce",d:2,
   q:"[P]Bir kitabı okumak, onunla tanışmaktır; ikinci kez okumak ise onunla arkadaş olmaktır. İlk okumada olayın peşinden koşarız, sonunu merak ettiğimiz için satırların üzerinden hızla geçeriz. İkinci okumada ise sonu bildiğimiz için acelemiz kalmaz; yazarın seçtiği sözcüklere, kurduğu cümlelere, satır aralarına bıraktığı ipuçlarına dikkat ederiz. Böylece kitap, bize ilk seferde göstermediği yüzünü açar.[/P]Bu parçanın ana düşüncesi aşağıdakilerden hangisidir?",
   o:["Kitapların sonu, okuma zevkini belirleyen en önemli unsurdur.","Bir kitabı yeniden okumak, ilk okumada fark edilmeyen derinlikleri görmeyi sağlar.","Hızlı okuma alışkanlığı kazanmak her okur için gereklidir.","Yazarlar, vermek istedikleri mesajı satır aralarına gizlemelidir."],
   a:1,
   e:"Ana düşünce, parçanın tamamının verdiği temel mesajdır. Parça baştan sona ikinci okumanın ilk okumadan farkını anlatıyor ve \"kitap, bize ilk seferde göstermediği yüzünü açar\" cümlesiyle bitiyor. Bu da B seçeneğidir. A ve C parçada geçen ayrıntılardan yanlış çıkarımlar, D ise yazara verilen bir öğüttür — parçada böyle bir öğüt yok."},

  {s:"Türkçe",t:"Parçada anlam · değinilmeyen",d:2,
   q:"[P]Uyku, beynin dinlenme zamanı değil, bakım zamanıdır. Gün boyunca öğrendiklerimiz uykunun derin evrelerinde kısa süreli bellekten uzun süreli belleğe taşınır. Aynı saatlerde beyin, gündüz biriken atık maddeleri temizler. Bu yüzden sınav öncesi sabahlayan bir öğrenci, aslında öğrendiklerini kalıcı hâle getirme fırsatını kendi elinden almış olur. Uykusuzluk yalnızca yorgunluk değil, unutkanlık da getirir.[/P]Bu parçada uykuyla ilgili aşağıdakilerden hangisine değinilmemiştir?",
   o:["Öğrenilen bilgilerin kalıcı hâle gelmesindeki rolüne","Beyinde biriken atık maddelerin temizlenmesine","Uyku süresinin kişinin yaşına göre değişmesine","Uykusuzluğun unutkanlığa yol açmasına"],
   a:2,
   e:"\"Değinilmemiştir\" soruları eleme yöntemiyle çözülür. A → \"uzun süreli belleğe taşınır\", B → \"atık maddeleri temizler\", D → \"unutkanlık da getirir\" cümlelerinde var. Uyku süresinin yaşa göre değişmesinden parçada hiç söz edilmiyor."},

  {s:"Türkçe",t:"Cümlede anlam · anlam ilişkileri",d:1,
   q:"Aşağıdaki cümlelerin hangisinde neden-sonuç ilişkisi vardır?",
   o:["Yağmur yağdığı için maç ertelendi.","Maçı izlemek için erkenden stada gitti.","Maç bitince hep birlikte eve döndük.","Maçı sonuna kadar izleyecek zamanı yoktu."],
   a:0,
   e:"Neden-sonuç ilişkisinde bir eylem, başka bir eylemin gerekçesidir. A'da \"yağmur yağması\" neden, \"maçın ertelenmesi\" sonuçtur. B'de \"için\" amaç bildirir (maçı izlemek amacıyla). C zaman, D ise koşul/olumsuzluk cümlesidir. İpucu: \"için\" bağlacı hem neden hem amaç bildirebilir — cümleye \"niçin?\" diye sorunca amaç, \"neden?\" diye sorunca sebep bulunur."},

  {s:"Türkçe",t:"Sözel mantık",d:3,
   q:"[P]Ali, Beren, Can ve Deniz yan yana dört koltuğa oturmuştur.\n• Ali, Beren'in hemen solundadır.\n• Can, en sağdaki koltukta oturmamaktadır.\n• Deniz, Ali'nin solundadır.[/P]Buna göre en sağdaki koltukta kim oturmaktadır?",
   o:["Ali","Beren","Can","Deniz"],
   a:1,
   e:"Koltukları soldan sağa 1-2-3-4 diye numaralayalım. \"Ali, Beren'in hemen solunda\" → Ali ve Beren yan yana ve sıra Ali-Beren. \"Deniz, Ali'nin solunda\" → Ali 1. koltukta olamaz. Denenecek durumlar: Ali=2,Beren=3 ise Deniz=1, Can=4 olur — ama Can en sağda olamaz, elendi. Ali=3,Beren=4 ise Deniz 1 veya 2, Can kalan yer — her iki durumda da geçerli. Sonuç: 4. koltukta (en sağda) her zaman Beren oturur."},

  {s:"Türkçe",t:"Fiilimsiler",d:2,
   q:"Aşağıdaki cümlelerin hangisinde sıfat-fiil (ortaç) kullanılmıştır?",
   o:["Koşarak merdivenleri çıktı.","Yazdığı mektubu kimseye göstermedi.","Sinemaya gitmek için sabırsızlanıyordu.","Yorulunca bir süre dinlenmek istedi."],
   a:1,
   e:"Sıfat-fiil ekleri: -an/-en, -ası/-esi, -mez, -ar/-er, -dik, -ecek, -miş. Bu ekleri alan fiil, isimden önce gelip onu niteler. B'de \"yaz-dığı\" fiilimsisi \"mektup\" ismini nitelemiş → sıfat-fiil. A'da \"koş-arak\" ve D'de \"yorul-unca\" zarf-fiildir (nasıl/ne zaman sorularına cevap verir). C'de \"git-mek\" isim-fiildir."},

  {s:"Türkçe",t:"Yazım kuralları",d:1,
   q:"Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?",
   o:["Bu yıl 19 Mayıs'ı okulumuzda coşkuyla kutladık.","Sınava hazırlanmak için her gün iki saat çalışıyor.","Herkesin fikrine saygı duymalı, hiçbirini küçümsememeliyiz.","Kitabı okuyupda arkadaşına geri verdi."],
   a:3,
   e:"\"da/de\" bağlaç olduğunda her zaman ayrı yazılır ve cümleden çıkarıldığında anlam bozulmaz: \"okuyup da\" doğru yazımdır. Bitişik yazılan \"-de\" ise bulunma hâl ekidir (evde, okulda). Diğer seçeneklerde yazım doğrudur; \"19 Mayıs'ı\" örneğinde tarihlerden sonra gelen ek kesme işaretiyle ayrılır."},

  {s:"Türkçe",t:"Noktalama işaretleri",d:2,
   q:"Aşağıdaki cümlelerin hangisinde virgül (,) yanlış kullanılmıştır?",
   o:["Genç, adama yolu tarif etti.","Çantasına defter, kalem ve silgi koydu.","Evet, yarın seninle geleceğim.","Bu soruyu, hiçbir şekilde çözemedim."],
   a:3,
   e:"Özne, nesne gibi ögelerle yüklem arasına virgül konmaz. D'de \"bu soruyu\" nesnesinden sonraki virgül gereksizdir. A'da virgül anlam karışıklığını önlemek için doğru kullanılmış (\"genç\" öznedir; virgül olmasa \"genç adam\" okunurdu). B'de eş görevli sözcükler, C'de cümle başındaki ünlem/onay sözü ayrılmıştır."},

  {s:"Türkçe",t:"Öznellik-nesnellik",d:1,
   q:"Aşağıdaki cümlelerin hangisi kanıtlanabilirlik açısından diğerlerinden farklıdır?",
   o:["Roman toplam 320 sayfadan oluşuyor.","Kitap bugüne kadar on iki dile çevrildi.","Yazarın bugüne kadarki en sürükleyici eseri budur.","Eser ilk kez 1998 yılında yayımlandı."],
   a:2,
   e:"A, B ve D ölçülebilir, belgelenebilir bilgiler içerir → nesnel. C'de geçen \"en sürükleyici\" ifadesi kişiden kişiye değişen bir yorumdur, kanıtlanamaz → öznel. Öznellik ipuçları: güzel, sıkıcı, en iyi, bence, sanırım gibi değer yargısı bildiren sözcükler."},

  /* ---------------- MATEMATİK (10) ---------------- */
  {s:"Matematik",t:"Çarpanlar ve katlar · EBOB",d:2,
   q:"Bir manav, 48 elma ile 60 armudu hiç artmayacak biçimde poşetlere paylaştıracaktır. Her poşette eşit sayıda meyve olacak ve bir poşette yalnızca bir çeşit meyve bulunacaktır.\nBuna göre manav en az kaç poşet kullanır?",
   o:["9","10","12","18"],
   a:0,
   e:"Poşet sayısının en az olması için her poşetteki meyve sayısı en çok olmalı. Hem 48'i hem 60'ı tam bölen en büyük sayı EBOB(48, 60)'tır.\n48 = 2⁴ · 3, 60 = 2² · 3 · 5 → EBOB = 2² · 3 = 12.\nElma için 48 ÷ 12 = 4 poşet, armut için 60 ÷ 12 = 5 poşet. Toplam 4 + 5 = 9 poşet."},

  {s:"Matematik",t:"Çarpanlar ve katlar · bölen sayısı",d:2,
   q:"360 sayısının pozitif tam bölenlerinin sayısı kaçtır?",
   o:["20","22","24","30"],
   a:2,
   e:"Önce asal çarpanlarına ayıralım: 360 = 2³ · 3² · 5¹.\nBölen sayısı, üslerin her birine 1 eklenip çarpılmasıyla bulunur:\n(3+1) · (2+1) · (1+1) = 4 · 3 · 2 = 24."},

  {s:"Matematik",t:"Üslü ifadeler",d:1,
   q:"(2⁵ · 2⁻³) ÷ 2⁴ işleminin sonucu kaçtır?",
   o:["1/4","1/2","2","4"],
   a:0,
   e:"Tabanlar aynı olduğu için çarpmada üsler toplanır, bölmede çıkarılır:\n2⁵ · 2⁻³ = 2⁵⁺⁽⁻³⁾ = 2².\n2² ÷ 2⁴ = 2²⁻⁴ = 2⁻².\n2⁻² = 1/2² = 1/4."},

  {s:"Matematik",t:"Kareköklü ifadeler",d:2,
   q:"√48 + √27 − √12 işleminin sonucu aşağıdakilerden hangisidir?",
   o:["3√3","5√3","7√3","9√3"],
   a:1,
   e:"Her kökü sadeleştirelim:\n√48 = √(16·3) = 4√3\n√27 = √(9·3) = 3√3\n√12 = √(4·3) = 2√3\nKök içleri aynı olduğu için katsayılar toplanıp çıkarılır: (4 + 3 − 2)√3 = 5√3."},

  {s:"Matematik",t:"Rasyonel sayılar (7. sınıf temeli)",d:2,
   q:"(3/4 − 1/6) : (5/12) işleminin sonucu kaçtır?",
   o:["5/7","7/12","7/5","12/5"],
   a:2,
   e:"Önce parantez içi: paydaları eşitleyelim (EKOK = 12).\n3/4 = 9/12, 1/6 = 2/12 → 9/12 − 2/12 = 7/12.\nBölme işleminde ikinci kesir ters çevrilip çarpılır:\n7/12 · 12/5 = 84/60 = 7/5."},

  {s:"Matematik",t:"Oran-orantı (7. sınıf temeli)",d:1,
   q:"Bir haritada 1 cm, gerçekte 25 km'yi göstermektedir. Bu haritada aralarındaki uzaklık 7,2 cm olan iki şehir arasındaki gerçek uzaklık kaç km'dir?",
   o:["150","172","180","200"],
   a:2,
   e:"Doğru orantı kurulur:\n1 cm → 25 km\n7,2 cm → x km\nx = 7,2 · 25 = 180 km."},

  {s:"Matematik",t:"Yüzde problemleri",d:3,
   q:"Bir ürünün fiyatı önce %20 artırılıyor, sonra yeni fiyat üzerinden %25 indirim yapılıyor.\nSon fiyat, ilk fiyatın yüzde kaçıdır?",
   o:["%85","%90","%95","%100"],
   a:1,
   e:"İlk fiyata 100 TL diyelim (yüzde problemlerinde en pratik yol).\n%20 artış: 100 · 1,20 = 120 TL.\n%25 indirim yeni fiyat üzerinden: 120 · 0,75 = 90 TL.\n90, ilk fiyatın %90'ıdır. Dikkat: artış ve indirim yüzdeleri doğrudan toplanıp çıkarılamaz (%20 − %25 = −%5 demek yanlış olur), çünkü ikisi farklı sayılar üzerinden hesaplanır."},

  {s:"Matematik",t:"Cebirsel ifadeler · özdeşlikler",d:2,
   q:"a + b = 7 ve a · b = 10 olduğuna göre a² + b² kaçtır?",
   o:["19","24","29","39"],
   a:2,
   e:"(a + b)² = a² + 2ab + b² özdeşliğini kullanırız.\n7² = a² + b² + 2·10\n49 = a² + b² + 20\na² + b² = 49 − 20 = 29."},

  {s:"Matematik",t:"Geometri · üçgende açılar",d:2,
   q:"Bir üçgenin iç açılarının ölçüleri 2x, 3x ve 5x ile orantılıdır.\nBuna göre bu üçgenin en büyük iç açısının ölçüsü kaç derecedir?",
   o:["72","80","90","108"],
   a:2,
   e:"Bir üçgenin iç açıları toplamı 180°'dir.\n2x + 3x + 5x = 180 → 10x = 180 → x = 18.\nEn büyük açı 5x = 5 · 18 = 90°. (Bu üçgen aynı zamanda bir dik üçgendir.)"},

  {s:"Matematik",t:"Olasılık (7. sınıf temeli)",d:1,
   q:"Bir torbada 4 kırmızı, 6 mavi ve 5 sarı bilye vardır. Torbadan rastgele çekilen bir bilyenin mavi olmama olasılığı kaçtır?",
   o:["2/5","3/5","1/3","3/4"],
   a:1,
   e:"Toplam bilye: 4 + 6 + 5 = 15.\nMavi olmayan bilyeler: 4 + 5 = 9.\nOlasılık = istenen durum / tüm durumlar = 9/15 = 3/5.\n(Kısayol: mavi olma olasılığı 6/15 = 2/5 olduğundan, olmama olasılığı 1 − 2/5 = 3/5'tir.)"},
