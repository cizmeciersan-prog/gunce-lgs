Üç ✓ bir ✗. Cevap D. Üç saniye.</div>

<h3>Bunu zaten yapabiliyorsun</h3>
<p>Bu denemede matematikte tam olarak bu disiplini uyguladın. EBOB sorusunda 18'i bulup durmadın, "buket sayısı" dendiğini fark edip 5'i işaretledin. EKOK sorusunda "kaç kez <b>daha</b>" ifadesini yakalayıp 4 yerine 3 dedin. İkisi de soru kökünü okuma sorusuydu ve ikisini de kazandın.</p>
<div class="warn"><b>Yapılacak tek şey</b>
Matematikte uyguladığın bu dikkati Türkçe, Din ve İnkılap sorularına da taşı. Sözel sorular kolay göründüğü için hızlı okunuyor; asıl tuzak orada.</div>

<h3>"Görmedik" düğmesi hakkında küçük bir not</h3>
<p>Dört soruyu işaretlemişsin. İkisi yerinde: <b>çaprazlama</b> (12) ve <b>Trablusgarp</b> (15) okulda muhtemelen henüz işlenmedi, doğru yapmışsın — bunlar konu işlenince tekrar karşına çıkacak.</p>
<p>Ama diğer ikisi için bir düşün:</p>
<ul>
<li><b>7. soru</b> — üslü ifadelerde çarpma ve bölme. Bunu "görmedik" demişsin ama hemen ardından gelen <b>8. soruyu</b>, üslü sayıları sıralama sorusunu, üstelik denemenin en zor sorularından birini <b>doğru</b> yaptın. Demek ki konu sende var; 7'de takılan başka bir şeydi.</li>
<li><b>20. soru</b> — İngilizce haftalık çizelge okuma. Bu bir konu değil, bir okuma sorusu; "işlenmiş" ya da "işlenmemiş" olmaz.</li>
</ul>
<div class="tip"><b>Ayrım</b>
"Görmedik" = okulda bu konuyu hiç anlatmadılar.<br>
"Zor geldi" = konu tanıdık ama soru karışık → bunu boş bırak ya da eleyerek tahmin et, "görmedik" deme.<br>
Bu ayrım bizim için önemli: hangi konuyu gerçekten bilmediğini ancak böyle görebiliyoruz.</div>

<h3>Kendini dene</h3>
<p>Beşinin de kökü ters. Cevaplar altta.</p>
<div class="drill">
<div class="q"><i>1</i>Aşağıdakilerden hangisi fiilimsi <b>değildir</b>? (A) koşarak (B) okumak (C) geldi (D) yazılan</div>
<div class="q"><i>2</i>Aşağıdakilerden hangisi <b>yanlıştır</b>? (A) Kader plandır. (B) Kaza gerçekleşmedir. (C) Cüz'î irade insana aittir. (D) Küllî irade insana verilen sınırlı iradedir.</div>
<div class="q"><i>3</i>21 Haziran'da Kuzey Yarım Küre için hangisi <b>söylenemez</b>? (A) Gündüz en uzundur. (B) Yaz başlar. (C) Gölge boyu en uzundur. (D) Işınlar Yengeç Dönencesi'ne dik düşer.</div>
<div class="q"><i>4</i>Aşağıdakilerden hangisi 36'nın asal çarpanı <b>değildir</b>? (A) 2 (B) 3 (C) 6 (D) hepsi asal çarpanıdır</div>
<div class="q"><i>5</i>Which one is <b>NOT</b> a positive personality adjective? (A) generous (B) reliable (C) stubborn (D) cheerful</div>
</div>
<div class="tip"><b>Cevaplar</b>
1 — <b>C</b> (geldi, çekimli fiil; diğer üçü fiilimsi)<br>
2 — <b>D</b> (küllî irade Allah'a aittir; sınırlı irade cüz'îdir)<br>
3 — <b>C</b> (21 Haziran'da gölge en kısadır, en uzun değil)<br>
4 — <b>C</b> (6 asal değildir; 36 = 2² · 3²)<br>
5 — <b>C</b> (stubborn = inatçı, olumsuz)</div>

<p>Beşini de doğru yaptıysan yarınki tam denemede en az iki net fazladan kazanacaksın. 90 soruluk bir sınavda bu köklerden onlarca çıkıyor.</p>`
},

  id:"L07", date:"2026-09-11", subject:"İnkılap Tarihi", icon:"İT",
  title:"Dört fikir akımı ve her birinin bittiği gün",
  subtitle:"16. soruda Batıcılık dedin, cevap Osmanlıcılıktı",
  body:`
<p>Soru şuydu: Balkan uluslarının ayaklanıp bağımsızlıklarını ilan etmesi hangi fikir akımının geçerliliğini yitirdiğini gösterir? Sen <b>Batıcılık</b> dedin, cevap <b>Osmanlıcılık</b>tı. Bu, bir önceki denemede de sorulmuş bir konu; o yüzden bir kez düzgünce oturtalım. İyi haber: bu ünitenin en çok soru gelen yeri burası ve ezberlenecek şey aslında çok az.</p>

<h3>Mantık: her akımın bir "hedef kitlesi" var</h3>
<p>XX. yüzyılın başında Osmanlı dağılıyordu ve aydınlar "devleti ne kurtarır?" sorusuna dört farklı cevap verdi. Her cevap, devleti <b>kimin etrafında</b> toplayacağını söylüyor:</p>
<table>
<tr><th>Akım</th><th>Kimi birleştirmek istiyor</th></tr>
<tr><td><b>Osmanlıcılık</b></td><td><b>Bütün Osmanlı vatandaşları</b> — din, dil, ırk ayrımı yapmadan. Rum da Bulgar da Türk de eşit "Osmanlı" olsun.</td></tr>
<tr><td><b>İslamcılık</b><br>(Ümmetçilik)</td><td><b>Bütün Müslümanlar</b> — halifenin etrafında. Araplar, Türkler, Kürtler, Arnavutlar.</td></tr>
<tr><td><b>Türkçülük</b></td><td><b>Bütün Türkler</b> — Osmanlı sınırları içindekiler ve dışındakiler, ortak dil ve kültürle.</td></tr>
<tr><td><b>Batıcılık</b></td><td>Kimseyi birleştirmez. Bu bir <b>kimlik politikası değil</b>, bir yenileşme önerisidir: bilim, teknoloji ve yönetimde Avrupa örnek alınsın.</td></tr>
</table>
<div class="tip"><b>Adı sana cevabı zaten söylüyor</b>
Osmanlıcılık → Osmanlılar. İslamcılık → Müslümanlar. Türkçülük → Türkler. Üçü de kendi adındaki topluluğu birleştirir. Dördüncüsü, Batıcılık, bir topluluk adı taşımaz — çünkü topluluk birleştirmez.</div>

<h3>Asıl sorulan kısım: hangisi ne zaman çöktü</h3>
<p>Sınavda "hangi akım geçerliliğini yitirdi" diye soruluyorsa, sana bir <b>olay</b> verilir ve o olayda hangi topluluğun ayrıldığına bakman istenir.</p>
<table>
<tr><th>Olay</th><th>Kim ayrıldı</th><th>Çöken akım</th></tr>
<tr><td><b>Balkan Savaşları</b><br>(1912-1913)</td><td>Sırplar, Bulgarlar, Yunanlar, Karadağlılar — yani <b>Müslüman olmayan Osmanlı vatandaşları</b></td><td><b>Osmanlıcılık</b></td></tr>
<tr><td><b>Arap İsyanı</b><br>(I. Dünya Savaşı, 1916)</td><td>Araplar — yani <b>Müslüman ama Türk olmayanlar</b></td><td><b>İslamcılık</b></td></tr>
</table>
<div class="ex"><b>16. soruyu böyle çözerdin</b>
Soruda "Balkan uluslarının ayaklanması" var → ayrılanlar Osmanlı vatandaşıydı ama Türk ya da Müslüman değildi → onları bir arada tutmayı vaat eden tek akım <b>Osmanlıcılık</b>tı → çöken o.</div>
<div class="warn"><b>Batıcılık neden olamazdı</b>
Batıcılık "şu halk bizimle kalsın" demiyor ki bir halk ayrılınca çürüsün. Bir savaşla ya da isyanla çürütülebilecek bir iddiası yok. Bu yüzden "hangi akım geçerliliğini yitirdi" sorularının cevabı <b>hiçbir zaman Batıcılık olmaz</b>. Bu tek bilgi bile bir şıkkı doğrudan eler.</div>

<h3>Sonrasında ne oldu</h3>
<p>Osmanlıcılık ve İslamcılık sırayla çökünce geriye <b>Türkçülük</b> kaldı ve I. Dünya Savaşı'ndan sonra güçlendi. Millî Mücadele'nin ve Cumhuriyet'in dayandığı fikrî zemin de budur — bir sonraki ünitede, "Millî Uyanış"ta bunun devamını göreceksin. Batıcılık ise bir kimlik akımı olarak değil, <b>inkılapların yöntemi</b> olarak yaşamaya devam etti.</p>

<h3>Kendini dene</h3>
<div class="drill">
<div class="q"><i>1</i>"Dünyadaki bütün Müslümanlar halife etrafında birleşmelidir." Bu görüş hangi akıma aittir?</div>
<div class="q"><i>2</i>I. Dünya Savaşı'nda Arapların İngilizlerle iş birliği yapıp Osmanlı'ya karşı ayaklanması hangi akımı çürütmüştür?</div>
<div class="q"><i>3</i>Hangi akım, bir topluluğu birleştirmeyi değil, devletin yönetim ve bilim alanında yenilenmesini savunur?</div>
<div class="q"><i>4</i>Balkan Savaşları'ndan sonra güçlenen akım hangisidir?</div>
</div>
<div class="tip"><b>Cevaplar</b>
1 — <b>İslamcılık</b> (Ümmetçilik)<br>
2 — <b>İslamcılık</b>. Müslüman bir halk ayrıldı; "din bizi bir arada tutar" iddiası çöktü.<br>
3 — <b>Batıcılık</b><br>
4 — <b>Türkçülük</b>. Diğer iki kimlik akımı çökünce geriye o kaldı.</div>`
},
{
  id:"L01", date:"2026-09-08", subject:"Türkçe", icon:"TR",
  title:"Fiilimsiler: üçünü bir daha ayıralım",
  subtitle:"1. Mini Deneme'de 1 yanlış + 2 soru henüz işlenmemiş",
  body:`
<p>1. Mini Deneme'de Türkçe'nin beş sorusundan üçü fiilimsiydi. Birini yanlış yaptın, ikisini "henüz görmedik" diye işaretledin — doğru yapmışsın, tahmin etmekten iyidir. Ama bu konu bu ayın konusu ve okulda yakında bitecek. O yüzden şimdiden kuralım: fiilimsiler tek bir mantığa oturur, o mantığı kurduğun gün üç soru birden kapanır. Üstelik ilerideki <em>cümlenin ögeleri</em> ve <em>fiilimsi-cümle türleri</em> konuları da bunun üstüne kuruluyor.</p>

<h3>Fiilimsi nedir, tek cümleyle</h3>
<p>Fiilden türeyen ama cümlede <b>fiil gibi değil</b>; isim, sıfat ya da zarf gibi görev yapan sözcüktür. En güvenilir işareti şudur: <b>fiilimsi kip ve kişi eki almaz, yani yüklem olamaz.</b></p>
<div class="ex"><b>Karşılaştır</b>
"Kitap <b>okudu</b>." → okudu: görülen geçmiş zaman + 3. tekil kişi → çekimli fiil, yüklem.<br>
"Kitap <b>okumak</b> güzeldir." → okumak: kip yok, kişi yok → fiilimsi.</div>

<h3>Üç tür, üç görev</h3>
<table>
<tr><th>Tür</th><th>Ekler</th><th>Görevi / kontrolü</th></tr>
<tr><td><b>İsim-fiil</b></td><td>-ma / -me<br>-ış / -iş<br>-mak / -mek</td><td>Eylemin adıdır. Cümlede özne, nesne, tümleç olur. "Ne? Neyi?" sorularına cevap verir.</td></tr>
<tr><td><b>Sıfat-fiil</b><br>(ortaç)</td><td>-an / -en, -ası / -esi,<br>-mez, -ar / -er,<br>-dik, -ecek, -miş</td><td>Bir <b>ismi niteler</b>. Hemen arkasından bir isim gelir: "koş<b>an</b> çocuk", "oku<b>duğum</b> kitap".</td></tr>
<tr><td><b>Zarf-fiil</b><br>(ulaç)</td><td>-ip, -arak / -erek,<br>-madan, -ince, -ken,<br>-alı, -dıkça, -casına,<br>-diği için, -r ...-maz</td><td>Yüklemin <b>nasıl / ne zaman / neden</b> yapıldığını söyler. Yükleme bu soruları sorunca cevap verir.</td></tr>
</table>

<h3>Üç adımda bulma yöntemi</h3>
<ul>
<li><b>1.</b> Cümlenin yüklemini bul ve üstünü çiz. Yüklem asla fiilimsi değildir.</li>
<li><b>2.</b> Geriye kalan eylem kökenli sözcüklere bak.</li>
<li><b>3.</b> Her birine sor: bu sözcük bir <b>ismin yerini mi tutuyor</b> (isim-fiil), bir <b>ismi mi niteliyor</b> (sıfat-fiil), yoksa <b>yüklemi mi anlatıyor</b> (zarf-fiil)?</li>
</ul>
<div class="ex"><b>Uygulayalım</b>
"Sabahları <b>koşmayı</b> alışkanlık hâline getirdi."<br>
1. Yüklem: getirdi. 2. Kalan eylem: koşmayı. 3. "Neyi getirdi?" → koşmayı. Nesne olmuş, yani isim gibi davranıyor → <b>isim-fiil</b>.</div>

<h3>Seni düşüren tuzak: adlaşmış sıfat-fiil</h3>
<p>1. soruda "Anlatılanları büyük bir dikkatle dinledi." seçeneğini isim-fiil sandın. Buradaki "anlatılan" bir sıfat-fiildir; nitelediği isim (şeyler, sözler) düşmüş, sıfat-fiil onun yerine geçmiştir. Buna <b>adlaşmış sıfat-fiil</b> denir. Adlaşsa bile türü değişmez, sıfat-fiil olarak kalır.</p>
<div class="warn"><b>Ayırt etme testi</b>
Sözcüğün arkasına gizli bir isim koyabiliyor musun?<br>
"anlatılan<b>lar</b>" → "anlatılan <b>sözler</b>" — konabiliyor → sıfat-fiil.<br>
"koşmayı" → "koşma <b>şeyi</b>" — olmuyor → isim-fiil.</div>

<h3>İkinci tuzak: -ma / -me eki iki farklı şey olabilir</h3>
<p>Aynı ek hem isim-fiil eki hem de <b>olumsuzluk eki</b> olabilir. Karıştırmamak için sözcüğün cümledeki görevine bak:</p>
<ul>
<li>"Kitap <b>okuma</b> alışkanlığı kazandı." → "okuma" burada bir ismi nitelemek üzere isimleşmiş → <b>isim-fiil</b>.</li>
<li>"Sen bu kitabı <b>okuma</b>!" → burada "-ma" olumsuz emir eki, sözcük yüklem → <b>fiilimsi değil</b>.</li>
</ul>

<h3>Üçüncü tuzak: fiilimsi olmayan ekler</h3>
<p>-ki / -deki (masadaki), -lı / -sız (yağmurlu), -cı / -lık (kitapçı, gözlük) fiilimsi eki değildir. Bunlar isimden türetme ekleridir. Fiilimsi arıyorsan önce sözcüğün kökünün bir <b>eylem</b> olduğundan emin ol.</p>

<h3>Kendini dene</h3>
<p>Aşağıdaki cümlelerde fiilimsileri bul ve türünü söyle. Cevaplar en altta.</p>
<div class="drill">
<div class="q"><i>1</i>Yağmur yağınca yolda kalan yolcular otobüs beklemeye başladı.</div>
<div class="q"><i>2</i>Erken kalkmak, gün boyu daha dinç olmanı sağlar.</div>
<div class="q"><i>3</i>Söylediklerini duymazlıktan gelerek odadan çıktı.</div>
<div class="q"><i>4</i>Dün akşam kardeşim bize uğradı.</div>
<div class="q"><i>5</i>Okunacak kitapları rafa dizerken tozlarını da aldı.</div>
</div>
<div class="tip"><b>Cevaplar</b>
1 — yağ<b>ınca</b> (zarf-fiil), kal<b>an</b> (sıfat-fiil), bekle<b>me</b>ye (isim-fiil) → 3 fiilimsi<br>
2 — kalk<b>mak</b> (isim-fiil), ol<b>ma</b>nı (isim-fiil) → 2 fiilimsi<br>
3 — söyle<b>dik</b>lerini (adlaşmış sıfat-fiil), gel<b>erek</b> (zarf-fiil) → 2 fiilimsi<br>
4 — <b>yok</b>. Tek eylem "uğradı" ve o da yüklem.<br>
5 — okun<b>acak</b> (sıfat-fiil), diz<b>erken</b> (zarf-fiil) → 2 fiilimsi</div>

<p>Bu beşini doğru yaptığında konu kapanmış demektir. Önümüzdeki denemelerde fiilimsi soruları tekrar gelecek — bilerek.</p>`
},
{
  id:"L02", date:"2026-09-08", subject:"Matematik", icon:"MT",
  title:"Sorunun son cümlesi: kaybettiğin iki net",
  subtitle:"İki yanlışın da bilgi eksiği değil, okuma hatası",
  body:`
<p>Matematikte iki soru gitti ve ikisinde de <b>işlemi doğru yaptın</b>. Bu önemli bir ayrım: bilmediğin için değil, sorunun ne istediğini kaçırdığın için kaybettin. LGS'de en çok net yakan hata tipi tam olarak budur, o yüzden bunu bugün kapatalım.</p>

<h3>Birinci: karton sorusu</h3>
<p>24 cm ve 36 cm'lik kartonu eş karelere bölme sorusunda EBOB'u <b>doğru</b> buldun: 12. Ama cevaba 12'yi işaretledin. Oysa 12, karenin kenar uzunluğuydu; soru <b>kaç kare elde edildiğini</b> istiyordu:</p>
<div class="ex"><b>Doğru bitiriş</b>
EBOB(24, 36) = 12 cm → karenin kenarı<br>
Uzun kenarda 36 ÷ 12 = 3 kare<br>
Kısa kenarda 24 ÷ 12 = 2 kare<br>
Toplam 3 · 2 = <b>6 kare</b></div>

<h3>İkinci: 4A6 sorusu</h3>
<p>3'e bölünebilme kuralını doğru uyguladın, A için 2, 5 ve 8'i buldun. Sen 5'i işaretledin ama soru "<b>en büyük</b> değer" diyordu → 8.</p>
<div class="warn"><b>İki hata da aynı hata</b>
Matematiği doğru yaptın, soruyu yanlış bitirdin. Bulduğun sayı, sorunun istediği sayı değildi.</div>
<div class="tip"><b>Bugünden itibaren alışkanlık</b>
İşlemi bitirdiğinde şıklara bakmadan önce sorunun <b>son cümlesini</b> bir kez daha oku ve kendine sor: "Benden ne istedi? Bulduğum şey o mu?"<br>
Sorudaki "en büyük", "en az", "kaç tane", "toplamı", "farkı" gibi kelimelerin altını çiz. Üç saniye sürer, netini bir buçuk artırır.</div>

<h3>Bir de EKOK'u görmedik demişsin — hazırlık olsun</h3>
<p>Otobüs sorusunu işaretlemişsin, doğru yapmışsın. Ama konu yakında gelecek; şimdiden karar tablosunu kur:</p>
<table>
<tr><th>EBOB (en büyük ortak bölen)</th><th>EKOK (en küçük ortak kat)</th></tr>
<tr><td>Bir şey <b>parçalara ayrılıyor</b>, bölüşülüyor</td><td>Bir şey <b>tekrar tekrar</b> oluyor, dönüyor</td></tr>
<tr><td>"hiç artmayacak biçimde", "eşit paylaştırma"</td><td>"en az kaç dakika sonra", "yeniden aynı anda"</td></tr>
<tr><td>"en fazla kaçar", "en büyük kare / en büyük parça"</td><td>"birlikte", "aynı hizaya gelme"</td></tr>
<tr><td>Sonuç, verilen sayılardan <b>küçük</b> çıkar</td><td>Sonuç, verilen sayılardan <b>büyük</b> çıkar</td></tr>
</table>
<div class="tip"><b>Tek cümlelik hatırlatma</b>
Bölüyorsan EBOB, bekliyorsan EKOK.</div>
<p>Hesabı da şöyle: iki sayıyı asal çarpanlarına ayır. <b>EBOB</b> = yalnızca ortak asalları al, üsleri <b>küçük</b> olanı seç. <b>EKOK</b> = bütün asalları al, üsleri <b>büyük</b> olanı seç.</p>
<div class="ex"><b>24 ve 36 üzerinde</b>
24 = 2³ · 3<br>
36 = 2² · 3²<br>
EBOB: ortak asallar 2 ve 3, küçük üsler → 2² · 3 = <b>12</b><br>
EKOK: tüm asallar, büyük üsler → 2³ · 3² = <b>72</b></div>

<h3>Kendini dene</h3>
<div class="drill">
<div class="q"><i>1</i>Boyutları 30 cm ve 42 cm olan bir kumaş, hiç artmayacak biçimde eş karelere bölünecektir. Kareler en büyük boyutta olduğunda kaç kare elde edilir?</div>
<div class="q"><i>2</i>Rakamları farklı olan 5B2 sayısı 3 ile tam bölünebiliyor. B'nin alabileceği en küçük değer kaçtır?</div>
<div class="q"><i>3</i>36 kalem ve 48 defter, hiç artmayacak biçimde en fazla kaç öğrenciye eşit dağıtılabilir? Bu durumda bir öğrenci kaç kalem alır?</div>
</div>
<div class="tip"><b>Cevaplar</b>
1 — EBOB(30, 42) = 6 → (30÷6)·(42÷6) = 5 · 7 = <b>35 kare</b> (kenar 6, ama soru kare sayısını istedi)<br>
2 — 5 + B + 2 = 7 + B, 3'ün katı olmalı → B = 2, 5 veya 8. Rakamlar farklı olacağı için B = 2 olamaz (2 zaten var) → en küçük <b>5</b>. Bu soruda hem "en küçük"e hem "rakamları farklı" şartına dikkat.<br>
3 — EBOB(36, 48) = 12 → <b>12 öğrenci</b>, her biri 36÷12 = <b>3 kalem</b>. Soru iki şey birden istedi, ikisini de yaz.</div>`
},

  id:"L03", date:"2026-09-08", subject:"Din Kültürü", icon:"DK",

  body:`
<p>Denemede "supportive" yerine "careless" işaretledin. Bu bir dil bilgisi hatası değil, kelime hatası — ve LGS İngilizce'sinde 10 sorunun en az 6'sı kelime bilgisiyle çözülür. İyi haber: 8. sınıf İngilizce'sinde sorulan kelime havuzu dar ve tahmin edilebilir.</p>

<h3>Önce taktik: boşluğu doldurmadan önce işaretini bul</h3>
<p>Cümleyi oku ve tek bir karar ver: burada anlatılan şey <b>olumlu mu, olumsuz mu?</b> Bu tek karar genelde iki ya da üç şıkkı eler.</p>
<div class="ex"><b>Senin sorunda</b>
"She never gets angry and she always listens to my problems patiently." → hiç kızmıyor, sabırla dinliyor → belli ki <b>olumlu</b>.<br>
Şıklar: selfish (bencil, olumsuz), supportive (destekleyici, olumlu), careless (umursamaz, olumsuz), noisy (gürültücü, olumsuz).<br>
Olumlu olan tek şık: <b>supportive</b>. Kelimeyi bilmesen bile, diğer üçünü bilerek doğruyu bulabilirdin.</div>

<h3>Unit 1 — Friendship: bilmen gereken kelimeler</h3>
<table>
<tr><th>Olumlu</th><th>Olumsuz</th></tr>

</table>

<h3>Davet etme, kabul etme, reddetme kalıpları</h3>
<table>
<tr><th>Davet</th><th>Kabul</th><th>Ret</th></tr>
<tr><td>Would you like to...?<br>Why don't you...?<br>How about ...ing?<br>Let's...<br>Do you want to...?</td><td>I'd love to.<br>That sounds great!<br>Sure, why not?<br>Of course.<br>With pleasure.</td><td>I'm afraid I can't.<br>Sorry, I'm busy.<br>I'd love to, but...<br>Unfortunately, I can't.<br>Maybe next time.</td></tr>
</table>
<div class="tip"><b>Diyalog sorularında altın kural</b>
Boşluk nerede olursa olsun, cevabı <b>diğer konuşmacının sözünde</b> ara. Karşı taraf "I'd love to!" diyorsa boşlukta bir davet vardır; boşluktan sonra bir mazeret geliyorsa boşlukta bir ret vardır.</div>

<h3>Fikir sorma ve verme</h3>
<ul>
<li>Sorma: What do you think about...? / How do you feel about...? / What's your opinion on...?</li>
<li>Verme: I think... / In my opinion... / I believe... / To me...</li>
<li>Katılma: I agree. / You're right. / So do I. / Me too.</li>
<li>Katılmama: I don't agree. / I'm afraid I disagree. / I don't think so.</li>
</ul>

<h3>Kendini dene</h3>
<div class="drill">
<div class="q"><i>1</i>Ali always shares his lunch with his friends. He is very ................ . (selfish / generous / jealous)</div>
<div class="q"><i>2</i>— Would you like to join us at the cinema? — ................ I have a lot of homework tonight. (I'd love to. / I'm afraid I can't. / That sounds great!)</div>
<div class="q"><i>3</i>My friend Deniz always keeps her promises. She is a very ................ friend. (reliable / bossy / rude)</div>
</div>
<div class="tip"><b>Cevaplar</b>
1 — <b>generous</b> (paylaşmak olumlu bir davranış)<br>
2 — <b>I'm afraid I can't.</b> (devamında mazeret var → ret)<br>
3 — <b>reliable</b> (sözünde durmak = güvenilir olmak)</div>

<p>Bu tabloları bir kez okuyup geçme; bir hafta boyunca her denemeden önce yarım dakika göz gezdir. Kelime ancak tekrarla kalıyor.</p>`

<p>1. Mini Deneme'yi <b>8 dakika 35 saniyede</b> bitirdin. Puanlanan 17 soru için soru başına yaklaşık 30 saniye demek bu. Gerçek LGS'de soru başına ortalama <b>1 dakika 43 saniye</b> var. Yani şu an gerçek sınavın izin verdiği sürenin üçte birini kullanıyorsun.</p>
<p>Bunu bir eleştiri olarak değil, bir ölçüm olarak yaz bir kenara. Çünkü kaybettiğin dört sorunun ikisi doğrudan bununla ilgili: karton sorusunda EBOB'u bulup durdun, 4A6 sorusunda "en büyük" kelimesini görmedin. İkisi de hızın kurbanı.</p>

<h3>Zaman gerçekte nasıl dağılıyor?</h3>

<p>Yani matematikte bir soruya iki dakika ayırma hakkın var. Otuz saniyede çıkardığın bir sonucu kontrol etmek için hâlâ bir buçuk dakikan kalıyor.</p>

<h3>Üç adımlık okuma disiplini</h3>
<ul>

const SUBJECT_ORDER = ["Türkçe","Matematik","Fen Bilimleri","İnkılap Tarihi","Din Kültürü","İngilizce"];
const LETTERS = ["A","B","C","D"];
const EXAM_DATE = new Date(2027,5,15); /* tahmini LGS tarihi: Haziran 2027 */

/* ============================ DURUM ============================ */
const store = {
  get(k,f){ try{ const v = localStorage.getItem("gunce-lgs:"+k); return v?JSON.parse(v):f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem("gunce-lgs:"+k, JSON.stringify(v)); }catch(e){} }
};
let view = "sinavlar";
let run = null;      /* {exam, idx, answers[], endsAt, tick} */
let result = null;   /* {exam, answers, secs} */
const app = document.getElementById("app");
const navbar = document.getElementById("navbar");
const navIn = document.getElementById("navbar-in");
const topbar = document.getElementById("topbar");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* soru metinlerinde <u> ve [P]...[/P] serbest; kendi verimiz olduğu için doğrudan basıyoruz */
function stemHtml(q){
  let t = q.replace(/\[P\]([\s\S]*?)\[\/P\]/g, function(_,inner){ return '<span class="passage">'+inner+'</span>'; });
  return t;
}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800);
}
function pad(n){ return String(n).padStart(2,"0"); }
function fmtTime(s){ s=Math.max(0,Math.round(s)); return pad(Math.floor(s/60))+":"+pad(s%60); }
function trDate(iso){
  const d=new Date(iso+"T00:00:00");
  const aylar=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const gunler=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  return d.getDate()+" "+aylar[d.getMonth()]+" "+gunler[d.getDay()];
}
function saved(examId){ return store.get("res:"+examId,null); }
function netOf(exam,answers,skips){
  skips = skips || [];
  let c=0,w=0,b=0,s=0;
  exam.questions.forEach((q,i)=>{
    if(skips[i]){ s++; return; }              /* görmedik → puanlamaya girmez */
    const a=answers[i];
    if(a==null) b++; else if(a===q.a) c++; else w++;
  });
  return {c:c,w:w,b:b,s:s,n:exam.questions.length-s,net:Math.round((c-w/3)*100)/100};
}
/* sonuç kodu: cevap harfi, boş için "-", görmedik için "X" */
function makeCode(examId,answers,skips,secs){
  skips = skips || [];
  const letters = answers.map((a,i)=> skips[i] ? "X" : (a===null||a===undefined ? "-" : LETTERS[a])).join("");
  return "GLGS1|"+examId+"|"+letters+"|"+secs;
}

/* ============================ RENDER ============================ */
function render(){
  navbar.hidden = true; navIn.innerHTML=""; topbar.hidden=false;
  if(view==="sinavlar") renderList();
  else if(view==="dersler") renderLessons();
  else if(view==="ders") renderLesson();
  else if(view==="sonuclar") renderResults();
  else if(view==="plan") renderPlan();
  else if(view==="run") renderRun();
  else if(view==="result") renderResult();
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- sonuç arşivi: çözülmüş her sınavın kodu burada kalıcı durur ---------- */
function archiveRows(){
  const rows=[];
  EXAMS.forEach(ex=>{
    const r=saved(ex.id);
    if(!r) return;
    rows.push({ex:ex, r:r, code:makeCode(ex.id,r.answers,r.skips,r.secs)});
  });
  return rows;
}
function allCodesText(){
  return archiveRows().map(x=>x.ex.title+" — "+x.r.net.toFixed(2)+" net\n"+x.code).join("\n\n");
}
function archiveHtml(){
  const rows=archiveRows();
  if(!rows.length) return "";
  let h='<div class="sec-head"><h2>Sonuç arşivi</h2><span>'+rows.length+' sonuç</span></div><div class="card">';
  rows.forEach((x,i)=>{
    h+='<div class="arch-row">'
      +'<div class="arch-head"><b>'+x.ex.title+'</b><span>'+trDate(x.ex.date)+'</span>'
        +'<span class="net">'+x.r.net.toFixed(2)+' net</span></div>'
      +'<div class="code-box">'+x.code+'</div>'
      +'<div class="row-btn"><button data-ac="'+i+'">Kodu kopyala</button>'
        +'<button class="go" data-aw="'+i+'">WhatsApp\'tan gönder</button></div>'
    +'</div>';
  });
  h+='</div>';
  if(rows.length>1) h+='<div class="row-btn"><button class="go" id="allcodes">Tüm kodları tek mesajda gönder</button></div>';
  h+='<p class="hint">Bu kodlar bu cihazda saklanır; sınavı hangi cihazda çözdüysen orada durur.</p>';
  return h;
}
function bindArchive(){
  const rows=archiveRows();
  app.querySelectorAll("[data-ac]").forEach(b=>b.addEventListener("click",async()=>{
    const c=rows[+b.dataset.ac].code;
    try{ await navigator.clipboard.writeText(c); toast("Kod kopyalandı"); }catch(e){ toast("Kodu elle kopyala"); }
  }));
  app.querySelectorAll("[data-aw]").forEach(b=>b.addEventListener("click",()=>{
    const x=rows[+b.dataset.aw];
    const msg=x.ex.title+" — "+x.r.net.toFixed(2)+" net\n"+x.code;
    window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
  }));
  const ac=document.getElementById("allcodes");
  if(ac) ac.onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(allCodesText()),"_blank");
}

/* ---------- Sonuçlar sekmesi: kodun her zaman bulunabileceği yer ---------- */
function renderResults(){
  setTab("sonuclar");
  const rows=archiveRows();
  app.innerHTML =
   '<div class="hero"><div class="eyebrow">Çözdüğün sınavlar</div><h1 style="font-size:28px">Sonuçlar</h1>'
   +'<p>Bitirdiğin her sınavın kodu burada durur. Kodu göndermeyi unuttuysan ya da mesaj kaybolduysa buradan tekrar alabilirsin.</p></div>'
   +(rows.length
      ? archiveHtml()
      : '<div class="note" style="margin-top:8px">Bu cihazda henüz kayıtlı sonuç yok. Bir sınavı bitirdiğin anda kodu buraya düşer.</div>')
   +'<div class="sec-head"><h2>Sonucun tamamını görmek istersen</h2></div>'
   +'<div class="card"><p style="font-size:15.5px"><b>Sınavlar</b> sekmesinde çözdüğün bir sınavın üstüne dokun: sonuç ekranı yeniden açılır. Netin, ders dağılımın, her sorunun çözümü ve kodun orada.</p>'
   +'<p class="hint">Sonuçlar, sınavı çözdüğün cihazın tarayıcısında saklanır. Telefonda çözdüysen kodlar telefonda, tablette çözdüysen tablette durur. Sayfayı her zaman <b>aynı tarayıcıdan</b> (Safari) aç — WhatsApp ya da Instagram içinden açılan küçük pencereler sonucu saklamayabilir.</p></div>';
  bindArchive();
}

function renderList(){
  setTab("sinavlar");
  const now=new Date();
  const days=Math.max(0,Math.ceil((EXAM_DATE-now)/86400000));
  const doneCount=EXAMS.filter(e=>saved(e.id)).length;
  const allRes=EXAMS.map(e=>saved(e.id)).filter(Boolean);
  const avg=allRes.length?(allRes.reduce((s,r)=>s+r.net,0)/allRes.length).toFixed(1):"—";

  let cards="";
  EXAMS.forEach(ex=>{
    const r=saved(ex.id);
    const d=new Date(ex.date+"T00:00:00");
    const isToday = ex.date === new Date().toISOString().slice(0,10);
    cards+='<button class="exam'+(isToday&&!r?" today":"")+'" data-open="'+ex.id+'">'
      +'<span class="exam-day"><b>'+d.getDate()+'</b><i>'+["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"][d.getMonth()]+'</i></span>'
      +'<span class="exam-body"><h3>'+ex.title+'</h3><p>'+ex.questions.length+' soru · '+ex.minutes+' dakika · '+ex.subtitle+'</p></span>'
      +(r?'<span class="pill done">'+r.net.toFixed(2)+' net</span>':'<span class="pill go">Başla</span>')
      +'</button>';
  });

  app.innerHTML =
   '<div class="hero">'
   +'<div class="eyebrow">2027 · Liseye Geçiş Sınavı</div>'
   +'<h1>Günce, kampa hoş geldin.</h1>'
   +'<p>Her gün bir sınav, her sınavdan sonra eksiklerin için bir ders. Hedef 450–460 puan — oraya tek tek sorularla gideceğiz.</p>'
   +'<div class="countdown">'
     +'<div class="cd-cell"><b class="cd-num">'+days+'</b><span class="cd-lab">gün kaldı</span></div>'
     +'<div class="cd-cell"><b class="cd-num">'+doneCount+'</b><span class="cd-lab">sınav bitti</span></div>'
     +'<div class="cd-cell"><b class="cd-num">'+avg+'</b><span class="cd-lab">ortalama net</span></div>'
   +'</div>'
   +'</div>'
   +'<div class="sec-head"><h2>Sınavların</h2><span>'+EXAMS.length+' sınav</span></div>'
   +'<div class="exam-list">'+cards+'</div>'
   +'<div class="note" style="margin-top:18px">Sınavı bitirince ekranda çıkan <b>sonuç kodunu</b> babana gönder. Kodu kaybetmekten korkma — hepsi üst çubuktaki <b>Sonuçlar</b> sekmesinde duruyor.</div>'
   +archiveHtml();

  app.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openExam(b.dataset.open)));
  bindArchive();
}

function openExam(id){
  const ex=EXAMS.find(e=>e.id===id);
  const prev=saved(id);
  if(prev){
    result={exam:ex,answers:prev.answers,skips:prev.skips||new Array(ex.questions.length).fill(false),secs:prev.secs};
    view="result"; render(); return;
  }
  const draft=store.get("draft:"+id,null);
  const answers = draft&&draft.answers ? draft.answers : new Array(ex.questions.length).fill(null);
  const skips = draft&&draft.skips ? draft.skips : new Array(ex.questions.length).fill(false);
  const left = draft&&draft.left!=null ? draft.left : ex.minutes*60;
  run={exam:ex, idx:0, answers:answers, skips:skips, left:left, started:Date.now(), total:ex.minutes*60};
  view="run"; render(); startTick();
}

function startTick(){
  if(run&&run.tick) clearInterval(run.tick);
  run.tick=setInterval(()=>{
    if(!run) return;
    run.left--;
    const t=document.getElementById("timer");
    if(t){ t.textContent=fmtTime(run.left); t.classList.toggle("low",run.left<300); }
    if(run.left%10===0) saveDraft();
    if(run.left<=0){ clearInterval(run.tick); finish(true); }
  },1000);
}
function saveDraft(){ if(run) store.set("draft:"+run.exam.id,{answers:run.answers,skips:run.skips,left:run.left}); }

function renderRun(){
  topbar.hidden=true;
  const ex=run.exam, q=ex.questions[run.idx];
  const isSkip=!!run.skips[run.idx];
  const answered=run.answers.filter((a,i)=>a!==null||run.skips[i]).length;
  let opts="";
  q.o.forEach((o,i)=>{
    opts+='<button class="opt" data-o="'+i+'" aria-pressed="'+(run.answers[run.idx]===i)+'"><span class="k">'+LETTERS[i]+'</span><span>'+o+'</span></button>';
  });
  app.innerHTML =
   '<div class="runbar"><div class="runbar-in">'
     +'<span class="timer'+(run.left<300?" low":"")+'" id="timer">'+fmtTime(run.left)+'</span>'
     +'<span class="qcount">Soru '+(run.idx+1)+' / '+ex.questions.length+'</span>'
     +'<button class="btn-quit" id="quit">Çık</button>'
   +'</div><div class="progress"><i style="width:'+(answered/ex.questions.length*100)+'%"></i></div></div>'
   +(run.idx===0&&ex.intro?'<div class="note" style="margin-top:16px">'+ex.intro+'</div>':'')
   +'<div class="qhead"><span class="chip">'+ex.questions[run.idx].s+'</span><span class="chip muted">'+q.t+'</span></div>'
   +'<div class="stem">'+stemHtml(q.q)+'</div>'
   +'<div class="opts'+(isSkip?" dim":"")+'">'+opts+'</div>'
   +'<button class="skipbtn'+(isSkip?" on":"")+'" id="skip">'
     +(isSkip?"✓ Bu konuyu henüz görmedik — geri al":"Bu konuyu okulda henüz görmedik")+'</button>'
   +'<div class="sec-head"><h2 style="font-size:15px">Soru haritası</h2></div>'
   +'<div class="grid-q" id="gridq"></div>';

  drawGrid();
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.o;
    run.skips[run.idx]=false;                 /* cevap verdiyse "görmedik" kalkar */
    run.answers[run.idx] = (run.answers[run.idx]===i) ? null : i;
    saveDraft();
    if(run.answers[run.idx]!==null && run.idx<ex.questions.length-1){ setTimeout(()=>{run.idx++;render();},140); }
    else render();
  }));
  document.getElementById("skip").addEventListener("click",()=>{
    const on=!run.skips[run.idx];
    run.skips[run.idx]=on;
    if(on) run.answers[run.idx]=null;         /* görmedik işaretlenince cevap silinir */
    saveDraft();
    if(on && run.idx<ex.questions.length-1){ setTimeout(()=>{run.idx++;render();},140); }
    else render();
  });
  document.getElementById("quit").addEventListener("click",()=>{
    if(confirm("Sınavdan çıkılsın mı? Cevapların kaydedilir, sonra kaldığın yerden devam edebilirsin.")){
      saveDraft(); clearInterval(run.tick); run=null; view="sinavlar"; render();
    }
  });

  navbar.hidden=false;
  navIn.innerHTML =
    '<button class="nb" id="prev"'+(run.idx===0?" disabled":"")+'>‹</button>'
   +(run.idx===ex.questions.length-1
      ? '<button class="nb primary finish" id="finish">Sınavı bitir</button>'
      : '<button class="nb primary" id="next">Sonraki soru</button>')
   +'<button class="nb" id="next2"'+(run.idx===ex.questions.length-1?" disabled":"")+'>›</button>';
  const p=document.getElementById("prev"); if(p) p.onclick=()=>{ if(run.idx>0){run.idx--;render();} };
  const n=document.getElementById("next"); if(n) n.onclick=()=>{ if(run.idx<ex.questions.length-1){run.idx++;render();} };
  const n2=document.getElementById("next2"); if(n2) n2.onclick=()=>{ if(run.idx<ex.questions.length-1){run.idx++;render();} };
  const f=document.getElementById("finish"); if(f) f.onclick=()=>finish(false);
}

function drawGrid(){
  const g=document.getElementById("gridq"); if(!g) return;
  let h="";
  run.exam.questions.forEach((q,i)=>{
    h+='<button class="gq'+(run.skips[i]?" skip":(run.answers[i]!==null?" filled":""))+(i===run.idx?" cur":"")+'" data-g="'+i+'">'+(i+1)+'</button>';
  });
  g.innerHTML=h;
  g.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{ run.idx=+b.dataset.g; render(); }));
}

function finish(auto){
  const blanks=run.answers.filter((a,i)=>a===null && !run.skips[i]).length;
  if(!auto && blanks>0 && !confirm(blanks+" soru boş kaldı. Yine de bitirmek istiyor musun?")) return;
  clearInterval(run.tick);
  const secs=run.total-run.left;
  const sc=netOf(run.exam,run.answers,run.skips);
  store.set("res:"+run.exam.id,{answers:run.answers,skips:run.skips,secs:secs,net:sc.net,at:new Date().toISOString()});
  try{ localStorage.removeItem("gunce-lgs:draft:"+run.exam.id); }catch(e){}
  result={exam:run.exam,answers:run.answers.slice(),skips:run.skips.slice(),secs:secs};
  run=null; view="result"; render();
}

function buildCode(){ return makeCode(result.exam.id,result.answers,result.skips,result.secs); }

function renderResult(){
  const ex=result.exam, ans=result.answers;
  const sk=result.skips||new Array(ex.questions.length).fill(false);
  const sc=netOf(ex,ans,sk);
  const total=sc.n||ex.questions.length;      /* puanlanan soru sayısı */
  const pct=Math.max(0,sc.net)/total;
  const R=50,C=2*Math.PI*R;

  /* ders bazlı */
  const bySubj={};
  ex.questions.forEach((q,i)=>{
    if(!bySubj[q.s]) bySubj[q.s]={c:0,w:0,b:0,s:0,n:0};
    const o=bySubj[q.s]; o.n++;
    if(sk[i]) o.s++;
    else if(ans[i]==null) o.b++; else if(ans[i]===q.a) o.c++; else o.w++;
  });
  let subjHtml="";
  SUBJECT_ORDER.filter(s=>bySubj[s]).forEach(s=>{
    const o=bySubj[s];
    subjHtml+='<div class="subj-row"><span class="n">'+s+'</span><span class="v">'+o.c+'D · '+o.w+'Y · '+o.b+'B'+(o.s?' · '+o.s+' görmedik':'')+'</span>'
      +'<span class="bar"><i class="b-ok" style="width:'+(o.c/o.n*100)+'%"></i><i class="b-no" style="width:'+(o.w/o.n*100)+'%"></i></span></div>';
  });

  /* zayıf konular */
  const weak=[], notseen=[];
  ex.questions.forEach((q,i)=>{
    if(sk[i]) notseen.push(q.t);
    else if(ans[i]!==q.a) weak.push(q.t);
  });
  let weakHtml = weak.length
    ? '<div class="note" style="margin-top:14px">Üzerinde durulacak konular: <b>'+[...new Set(weak)].join(" · ")+'</b><br>Bu konuların anlatımı için yukarıdaki <b>Dersler</b> sekmesine bak.</div>'
    : '<div class="note" style="margin-top:14px"><b>Tam isabet.</b> Puanlanan sorularda hiç hata yok — bir üst zorluğa geçiyoruz.</div>';
  if(notseen.length){
    weakHtml += '<div class="note" style="margin-top:10px">Henüz görmediğin konular (<b>'+notseen.length+' soru</b>, nete katılmadı): '
      +'<b>'+[...new Set(notseen)].join(" · ")+'</b><br><span style="font-size:13.5px">Bunlar okulda işlendikten sonra tekrar sorulacak.</span></div>';
  }

  /* soru soru inceleme */
  let rev="";
  ex.questions.forEach((q,i)=>{
    const a=ans[i];
    const st = sk[i]?"blank":(a==null?"blank":(a===q.a?"ok":"bad"));
    const stTxt = sk[i]?"Görmedik · nete katılmadı":(a==null?"Boş":(a===q.a?"Doğru":"Yanlış · senin cevabın "+LETTERS[a]));
    let opts="";
    q.o.forEach((o,j)=>{
      let cls="opt";
      if(j===q.a) cls+=" correct";
      else if(j===a) cls+=" chosen-wrong";
      opts+='<div class="'+cls+'"><span class="k">'+LETTERS[j]+'</span><span>'+o+'</span></div>';
    });
    rev+='<div class="rev-item">'
      +'<button class="rev-top" data-rev="'+i+'"><span class="rev-no '+st+'">'+(i+1)+'</span>'
        +'<span class="rev-t"><b>'+q.t+'</b><span>'+q.s+' · '+stTxt+'</span></span>'
        +'<span class="rev-open">+</span></button>'
      +'<div class="rev-body" hidden>'
        +'<div class="stem">'+stemHtml(q.q)+'</div>'
        +'<div class="opts">'+opts+'</div>'
        +'<div class="expl"><b>Çözüm</b>'+q.e.replace(/\n/g,"<br>")+'</div>'
      +'</div></div>';
  });

  const code=buildCode();
  app.innerHTML =
   '<div class="hero" style="padding-bottom:0"><div class="eyebrow">'+trDate(ex.date)+' · Sonuç</div><h1 style="font-size:26px">'+ex.title+'</h1></div>'
   +'<div class="score-head">'
     +'<div class="ring"><svg width="112" height="112" viewBox="0 0 112 112">'
       +'<circle cx="56" cy="56" r="'+R+'" fill="none" stroke="var(--line-soft)" stroke-width="10"></circle>'
       +'<circle cx="56" cy="56" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"></circle>'
     +'</svg><div class="ring-c"><b>'+sc.net.toFixed(2)+'</b><span>net / '+total+'</span></div></div>'
     +'<div class="score-side">'
       +'<div class="kv"><i class="dot" style="background:var(--ok)"></i><b>'+sc.c+'</b><span>doğru</span></div>'
       +'<div class="kv"><i class="dot" style="background:var(--no)"></i><b>'+sc.w+'</b><span>yanlış</span></div>'
       +'<div class="kv"><i class="dot" style="background:var(--ink-faint)"></i><b>'+sc.b+'</b><span>boş</span></div>'
       +(sc.s?'<div class="kv"><i class="dot" style="background:var(--gold)"></i><b>'+sc.s+'</b><span>görmedik</span></div>':'')
       +'<div class="kv"><i class="dot" style="background:var(--accent)"></i><b>'+fmtTime(result.secs)+'</b><span>süre</span></div>'
     +'</div>'
   +'</div>'
   +weakHtml
   +'<div class="sec-head"><h2>Ders ders</h2></div><div class="card"><div class="subj">'+subjHtml+'</div></div>'
   +'<div class="sec-head"><h2>Sonucu babana gönder</h2></div>'
   +'<div class="card"><p style="font-size:14.5px;color:var(--ink-soft)">Aşağıdaki kodu kopyalayıp gönder. Kod, hangi soruya ne cevap verdiğini içerir.<br>Şimdi gönderemezsen sorun değil: bu kod üst çubuktaki <b>Sonuçlar</b> sekmesinde duruyor.</p>'
     +'<div class="code-box" id="code">'+code+'</div>'
     +'<div class="row-btn"><button class="go" id="copy">Kodu kopyala</button><button id="wa">WhatsApp\'tan gönder</button></div></div>'
   +'<div class="sec-head"><h2>Soru soru inceleme</h2><span>çözümler açılır</span></div>'
   +'<div class="rev">'+rev+'</div>'
   +'<div class="row-btn" style="margin-top:20px"><button id="back">← Sınav listesine dön</button><button id="again">Bu sınavı sıfırla</button></div>';

  app.querySelectorAll("[data-rev]").forEach(b=>b.addEventListener("click",()=>{
    const body=b.parentElement.querySelector(".rev-body");
    body.hidden=!body.hidden;
    b.querySelector(".rev-open").textContent = body.hidden?"+":"−";
  }));
  document.getElementById("copy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(code); toast("Kod kopyalandı"); }
    catch(e){ const r=document.createRange(); r.selectNode(document.getElementById("code")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Kodu elle kopyala"); }
  };
  document.getElementById("wa").onclick=()=>{
    const msg=ex.title+" — "+sc.net.toFixed(2)+" net ("+sc.c+"D "+sc.w+"Y "+sc.b+"B), süre "+fmtTime(result.secs)+"\n"+code;
    window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
  };
  document.getElementById("back").onclick=()=>{ view="sinavlar"; render(); };
  document.getElementById("again").onclick=()=>{
    if(confirm("Bu sınavın sonucu silinip baştan çözülecek. Emin misin?")){
      try{ localStorage.removeItem("gunce-lgs:res:"+ex.id); }catch(e){}
      view="sinavlar"; render();
    }
  };
}

let lessonId=null;
function setTab(name){
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", x.dataset.tab===name?"true":"false"));
}

function renderLessons(){
  setTab("dersler");
  let items="";
  LESSONS.forEach(l=>{
    items+='<button class="lesson" data-l="'+l.id+'">'
      +'<span class="ic">'+l.icon+'</span>'
      +'<span class="tx"><b>'+l.title+'</b><span>'+l.subject+' \u00b7 '+l.subtitle+'</span></span>'
      +'</button>';
  });
  app.innerHTML =
   '<div class="hero"><div class="eyebrow">Hata defteri</div><h1 style="font-size:28px">Dersler</h1>'
   +'<p>Her ders, bir denemede yaptığın belirli bir hatadan çıktı. Konuyu anlatır, seni düşüren tuzağı gösterir, sonunda küçük bir alıştırma verir.</p></div>'
   +'<div class="sec-head"><h2>Şu an açık olanlar</h2><span>'+LESSONS.length+' ders</span></div>'
   +(LESSONS.length?'<div class="lesson-list">'+items+'</div>'
     :'<div class="note">Henüz ders yok. İlk denemeyi çözünce burası dolmaya başlar.</div>');
  app.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>{ lessonId=b.dataset.l; view="ders"; render(); }));
}

function renderLesson(){
  setTab("dersler");
  const l=LESSONS.find(x=>x.id===lessonId);
  if(!l){ view="dersler"; render(); return; }
  app.innerHTML =
   '<div class="hero" style="padding-bottom:4px"><div class="eyebrow">'+l.subject+' \u00b7 '+trDate(l.date)+'</div>'
   +'<h1 style="font-size:26px">'+l.title+'</h1></div>'
   +'<div class="card" style="margin-top:14px"><div class="prose">'+l.body+'</div></div>'
   +'<div class="row-btn" style="margin-top:18px"><button id="lback">← Derslere dön</button><button class="go" id="lexam">Sınavlara git</button></div>';
  document.getElementById("lback").onclick=()=>{ view="dersler"; render(); };
  document.getElementById("lexam").onclick=()=>{ view="sinavlar"; render(); setTab("sinavlar"); };
}

  app.innerHTML =
   '<div class="hero"><div class="eyebrow">Yol haritası</div><h1 style="font-size:28px">Eylül 2026 → Haziran 2027</h1>'
   +'<p>Sınav sadece 8. sınıf müfredatından. Bu yüzden okulda işlenen konuyla aynı hafta soru çözüyoruz; alt sınıf bilgisi gereken yerlerde (kesirler, oran, açılar, sözcük türleri) araya kısa tekrar soruları giriyor.</p></div>'

   +'<div class="sec-head"><h2>Haftalık düzen</h2></div>'
   +'<div class="card"><div class="plan-list">'
     +'<div class="plan-day"><span class="d">Pzt–Cum</span><span class="t"><b>Günlük mini deneme · 20 soru</b><p>Yaklaşık 30 dakika. O hafta okulda işlenen konular ağırlıklı, araya geçmiş konulardan tekrar soruları serpiştirilir.</p></span></div>'
     +'<div class="plan-day"><span class="d">Cmt</span><span class="t"><b>Tam LGS provası · 90 soru</b><p>Gerçek sınav düzeni: önce 50 soruluk sözel bölüm (75 dk), 15 dk ara, sonra 40 soruluk sayısal bölüm (80 dk).</p></span></div>'
     +'<div class="plan-day"><span class="d">Paz</span><span class="t"><b>Hata defteri günü</b><p>Sınav yok. Hafta boyunca yanlış yapılan konuların anlatımı ve o konudan 10-15 soruluk kısa telafi seti.</p></span></div>'
   +'</div></div>'

   +'<div class="sec-head"><h2>LGS 2027 nasıl bir sınav?</h2></div>'
   +'<div class="card"><div class="tblwrap"><table class="dist">'
     +'<tr><th>Ders</th><th>Oturum</th><th class="n">Soru</th><th class="n">Katsayı</th></tr>'
     +'<tr><td>Türkçe</td><td>Sözel</td><td class="n">20</td><td class="n">4</td></tr>'
     +'<tr><td>T.C. İnkılap Tarihi</td><td>Sözel</td><td class="n">10</td><td class="n">1</td></tr>'
     +'<tr><td>Din Kültürü</td><td>Sözel</td><td class="n">10</td><td class="n">1</td></tr>'
     +'<tr><td>Yabancı Dil</td><td>Sözel</td><td class="n">10</td><td class="n">1</td></tr>'
     +'<tr><td>Matematik</td><td>Sayısal</td><td class="n">20</td><td class="n">4</td></tr>'
     +'<tr><td>Fen Bilimleri</td><td>Sayısal</td><td class="n">20</td><td class="n">4</td></tr>'
   +'</table></div>'
   +'<p class="hint">Sözel bölüm 50 soru / 75 dakika, sayısal bölüm 40 soru / 80 dakika — toplam 90 soru, 155 dakika. 3 yanlış 1 doğruyu götürür. Türkçe, Matematik ve Fen\'in katsayısı 4 olduğu için puanın büyük kısmı bu üç dersten gelir.</p></div>'

   +'<div class="sec-head"><h2>Hedef: 450–460 puan</h2></div>'
   +'<div class="card"><p style="font-size:15.5px">Bu band, son yılların ortalamasında kabaca <b>82–86 net</b> demek: 90 sorunun en fazla 4–6\'sında hata payı. Yani hedef "çok soru çözmek" değil, <b>aynı hatayı ikinci kez yapmamak</b>.</p>'
   +'<p class="hint">Katsayılar yüzünden Türkçe-Matematik-Fen\'de kaybedilen 1 net, İngilizce\'de kaybedilen 1 netten yaklaşık dört kat pahalı. Denge bozulursa önce bu üç derse dönüyoruz.</p></div>'

   +'<div class="sec-head"><h2>Bu sayfa nasıl çalışıyor?</h2></div>'
   +'<div class="card"><div class="plan-list">'
     +'<div class="plan-day"><span class="d">1</span><span class="t"><b>Sınavı çöz</b><p>Süre otomatik işler. Yarıda bırakırsan cevapların bu cihazda saklanır, kaldığın yerden devam edersin.</p></span></div>'
     +'<div class="plan-day"><span class="d">2</span><span class="t"><b>Sonucu gör</b><p>Bitirince net, ders dağılımı ve her sorunun çözümü açılır. Yanlışları hemen oku — asıl öğrenme orada.</p></span></div>'
     +'<div class="plan-day"><span class="d">3</span><span class="t"><b>Kodu gönder</b><p>Sonuç ekranındaki kodu babana ilet. Unutursan sorun değil: sınav listesinin altındaki <b>Sonuç arşivi</b>nde bütün kodlar duruyor.</p></span></div>'
   +'</div></div>'
   +'<div class="sec-head"><h2>Görmediğin konu çıkarsa</h2></div>'
   +'<div class="card"><p style="font-size:15.5px">Sorularda okulda henüz işlemediğiniz bir konu çıkabilir. O soruyu tahmin etmeye çalışma: seçeneklerin altındaki <b>"Bu konuyu okulda henüz görmedik"</b> düğmesine bas.</p>'
   +'<p class="hint">İşaretlediğin soru netine katılmaz, yanlış sayılmaz. Sonuç ekranında ayrı bir liste hâlinde görünür ve o konu okulda işlendikten sonra tekrar karşına çıkar. Bilmediğin için değil, daha sırası gelmediği için boş bıraktığını bilelim yeter.</p></div>';
}

/* ============================ OLAYLAR ============================ */
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", x===b?"true":"false"));
  view=b.dataset.tab; render();
}));
render();
