<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Günce — LGS Sınav & Çalışma Takibi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card-border: #30363d;
      --text: #c9d1d9;
      --text-heading: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-bg: rgba(56, 139, 253, 0.15);
      --success: #3fb950;
      --success-bg: rgba(46, 160, 67, 0.15);
      --danger: #f85149;
      --danger-bg: rgba(248, 81, 73, 0.15);
      --warning: #d29922;
      --warning-bg: rgba(187, 128, 9, 0.15);
      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); font-family: var(--font-main); line-height: 1.5; padding-bottom: 40px; }
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px; }
    header { padding: 20px 0 16px; border-bottom: 1px solid var(--card-border); margin-bottom: 16px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .logo { font-weight: 800; font-size: 1.25rem; color: var(--text-heading); letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .target-badge { background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(88,166,255,0.3); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    nav { display: flex; gap: 8px; background: var(--card); padding: 4px; border-radius: 12px; border: 1px solid var(--card-border); }
    nav button { flex: 1; background: none; border: none; color: var(--text-muted); padding: 8px 12px; border-radius: 8px; font-family: var(--font-main); font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    nav button.active { background: var(--accent); color: #fff; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--text-heading); }
    .tag { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; }
    .tag-mini { background: var(--accent-bg); color: var(--accent); }
    .tag-tam { background: var(--warning-bg); color: var(--warning); }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; margin-bottom: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; gap: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Quiz Screen */
    .quiz-header { position: sticky; top: 0; background: var(--bg); padding: 12px 0; z-index: 10; border-bottom: 1px solid var(--card-border); margin-bottom: 16px; }
    .quiz-progress { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .progress-bar { height: 6px; background: var(--card-border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
    .q-text { font-size: 0.95rem; font-weight: 600; color: var(--text-heading); margin-bottom: 16px; white-space: pre-line; }
    .q-text p-box { background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent); padding: 10px; border-radius: 4px; margin: 8px 0; display: block; }
    .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .opt-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 12px 14px; border-radius: 10px; text-align: left; font-size: 0.9rem; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
    .opt-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--text-heading); font-weight: 600; }
    .opt-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
    .opt-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
    .opt-letter { font-weight: 700; color: var(--accent); font-family: var(--font-mono); }
    .solution-box { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 0.85rem; line-height: 1.6; }
    .quiz-nav { display: flex; gap: 8px; }
    .quiz-nav button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); font-weight: 600; cursor: pointer; }
    .btn-not-seen { background: rgba(210, 153, 34, 0.1) !important; color: var(--warning) !important; border-color: rgba(210, 153, 34, 0.3) !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="topbar">
        <div class="logo">Günce <span>LGS</span></div>
        <div class="target-badge">Hedef: 450-460 Puan</div>
      </div>
      <nav>
        <button class="nav-btn active" onclick="switchTab('exams')">Sınavlar</button>
        <button class="nav-btn" onclick="switchTab('lessons')">Dersler</button>
        <button class="nav-btn" onclick="switchTab('results')">Sonuçlar</button>
      </nav>
    </header>

    <main>
      <!-- EXAMS SECTION -->
      <section id="sec-exams" class="section active">
        <div id="exam-list"></div>
      </section>

      <!-- QUIZ SECTION -->
      <section id="sec-quiz" class="section">
        <div class="quiz-header">
          <div class="quiz-progress">
            <span id="q-counter">Soru 1/20</span>
            <span id="q-timer" style="font-family: var(--font-mono);">00:00</span>
          </div>
          <div class="progress-bar"><div id="q-progress-fill" class="progress-fill"></div></div>
        </div>
        <div id="quiz-body">
          <div id="q-subject" style="font-size: 0.75rem; font-weight: 700; color: var(--accent); margin-bottom: 4px;">TÜRKÇE</div>
          <div id="q-topic" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Fiilimsiler</div>
          <div id="q-text" class="q-text">Soru metni yükleniyor...</div>
          <div id="q-options" class="options"></div>
          <div id="q-solution" class="solution-box" style="display: none;"></div>
          <div class="quiz-nav">
            <button id="btn-prev" onclick="prevQuestion()">Önceki</button>
            <button class="btn-not-seen" onclick="markNotSeen()">Görmedik</button>
            <button id="btn-next" onclick="nextQuestion()">Sonraki</button>
          </div>
        </div>
      </section>

      <!-- LESSONS SECTION -->
      <section id="sec-lessons" class="section">
        <div id="lesson-list"></div>
      </section>

      <!-- RESULTS SECTION -->
      <section id="sec-results" class="section">
        <div class="card">
          <div class="card-title" style="margin-bottom: 8px;">Sonuç Arşivi & Kod Gönderimi</div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Çözdüğün tüm sınavların kodları aşağıdadır. "Hepsini Gönder" butonuna basarak babana aktarabilirsin.</p>
          <button class="btn" onclick="sendAllResults()">Hepsini Gönder (WhatsApp)</button>
        </div>
        <div id="result-history"></div>
      </section>
    </main>
  </div>

    ];

    const LESSONS = [
      { id: "L07", date: "2026-09-11", subject: "İnkılap Tarihi", icon: "İNK", title: "Dört Fikir Akımı", subtitle: "Osmanlıyı kurtarma çabaları", body: "<h3>Fikir Akımları</h3><p><b>Osmanlıcılık:</b> Tüm tebaayı eşit sayma.<br><b>Batıcılık:</b> Batıyı örnek alma.<br><b>Türkçülük:</b> Türk birliği.<br><b>İslamcılık:</b> Ümmet birliği.</p>" },
      { id: "L06", date: "2026-09-11", subject: "Genel", icon: "GEN", title: "Ters Soru Kökleri", subtitle: "Hangisi değildir / söylenemez?", body: "<h3>Taktik</h3><p>Soru kökünde <b>değildir/çıkarılamaz</b> görüyorsan seçeneğe değil, olumsuz ifadeye odaklan!</p>" }
    ];

    // STATE
    let activeExam = null;
    let currentQ = 0;
    let userAnswers = [];
    let timerInterval = null;
    let secondsElapsed = 0;

    // RENDER FUNCTIONS
    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('sec-' + tab).classList.add('active');
      if(tab === 'results') renderResults();
    }

    function renderExams() {
      const container = document.getElementById('exam-list');
      container.innerHTML = EXAMS.map(e => `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${e.title}</div>
            <span class="tag ${e.tag === 'MİNİ' ? 'tag-mini' : 'tag-tam'}">${e.tag}</span>
          </div>
          <div class="card-meta">
            <span>📅 ${e.date}</span>
            <span>⏱️ ${e.duration} Dakika</span>
            <span>❓ ${e.questions.length} Soru</span>
          </div>
          <button class="btn" onclick="startQuiz('${e.id}')">Sınava Başla</button>
        </div>
      `).join('');
    }

    function renderLessons() {
      const container = document.getElementById('lesson-list');
      container.innerHTML = LESSONS.map(l => `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${l.title}</div>
            <span class="tag tag-mini">${l.icon}</span>
          </div>
          <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:8px;">${l.subtitle}</div>
          <div style="font-size:0.85rem;">${l.body}</div>
        </div>
      `).join('');
    }

    function startQuiz(examId) {
      activeExam = EXAMS.find(e => e.id === examId);
      currentQ = 0;
      userAnswers = new Array(activeExam.questions.length).fill('-');
      secondsElapsed = 0;
      
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('sec-quiz').classList.add('active');
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        let s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('q-timer').innerText = `${m}:${s}`;
      }, 1000);

      loadQuestion();
    }

    function loadQuestion() {
      const q = activeExam.questions[currentQ];
      document.getElementById('q-counter').innerText = `Soru ${currentQ + 1}/${activeExam.questions.length}`;
      document.getElementById('q-progress-fill').style.width = `${((currentQ + 1) / activeExam.questions.length) * 100}%`;
      
      document.getElementById('q-subject').innerText = q.s.toUpperCase();
      document.getElementById('q-topic').innerText = q.t;
      
      // Formatting text
      let fmtText = q.q.replace(/\[P\]/g, '<div class="q-text" style="background:rgba(255,255,255,0.03); border-left:3px solid var(--accent); padding:10px; margin:8px 0;">')
                         .replace(/\[\/P\]/g, '</div>');
      document.getElementById('q-text').innerHTML = fmtText;

      const optsContainer = document.getElementById('q-options');
      const letters = ['A', 'B', 'C', 'D'];
      optsContainer.innerHTML = q.o.map((opt, idx) => `
        <button class="opt-btn ${userAnswers[currentQ] === letters[idx] ? 'selected' : ''}" onclick="selectOption('${letters[idx]}')">
          <span class="opt-letter">${letters[idx]})</span>
          <span>${opt}</span>
        </button>
      `).join('');

      document.getElementById('q-solution').style.display = 'none';
      document.getElementById('btn-prev').disabled = currentQ === 0;
      document.getElementById('btn-next').innerText = currentQ === activeExam.questions.length - 1 ? 'Sınavı Bitir' : 'Sonraki';
    }

    function selectOption(letter) {
      userAnswers[currentQ] = letter;
      loadQuestion();
    }

    function markNotSeen() {
      userAnswers[currentQ] = 'X';
      nextQuestion();
    }

    function prevQuestion() {
      if(currentQ > 0) { currentQ--; loadQuestion(); }
    }

    function nextQuestion() {
      if(currentQ < activeExam.questions.length - 1) {
        currentQ++;
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      const code = `GLGS1|${activeExam.id}|${userAnswers.join('')}|${secondsElapsed}`;
      
      // Save local
      let history = JSON.parse(localStorage.getItem('glgs_history') || '[]');
      history.unshift({ code, date: new Date().toLocaleString() });
      localStorage.setItem('glgs_history', JSON.stringify(history));

      alert(`Sınav Bitti!\nSonuç Kodun: ${code}\n\nBu kod otomatik kaydedildi. "Sonuçlar" sekmesinden babana gönderebilirsin.`);
      switchTab('results');
    }

    function renderResults() {
      let history = JSON.parse(localStorage.getItem('glgs_history') || '[]');
      const container = document.getElementById('result-history');
      if(history.length === 0) {
        container.innerHTML = '<div class="card" style="font-size:0.85rem; color:var(--text-muted);">Henüz çözülmüş bir sınav yok.</div>';
        return;
      }
      container.innerHTML = history.map(h => `
        <div class="card">
          <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">${h.date}</div>
          <div style="font-family:var(--font-mono); font-size:0.8rem; word-break:break-all; color:var(--accent);">${h.code}</div>
        </div>
      `).join('');
    }

    function sendAllResults() {
      let history = JSON.parse(localStorage.getItem('glgs_history') || '[]');
      if(history.length === 0) { alert('Gönderilecek kayıtlı sonuç bulunamadı.'); return; }
      let msg = history.map(h => h.code).join('\n');
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }

    // INIT
    renderExams();
    renderLessons();
  </script>
</body>
</html>
