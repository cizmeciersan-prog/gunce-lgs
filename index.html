<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<title>Günce'nin LGS Kampı</title>
<style>
  :root{
    --bg:#EEF1F5;
    --grid:rgba(29,78,137,.09);
    --surface:#FFFFFF;
    --surface-2:#F6F8FB;
    --line:#D6DEE8;
    --line-soft:#E6ECF3;
    --ink:#14263A;
    --ink-soft:#5E7089;
    --ink-faint:#8B9AAD;
    --accent:#1D4E89;
    --accent-soft:#E3ECF7;
    --ok:#12795C;
    --ok-soft:#DDF0E9;
    --no:#BE3F36;
    --no-soft:#FBE4E1;
    --gold:#B57A14;
    --gold-soft:#FBEFD8;
    --shadow:0 1px 2px rgba(20,38,58,.06), 0 8px 24px -12px rgba(20,38,58,.18);
    --r:14px;
    --font-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --font-b:"Source Sans 3","Segoe UI",system-ui,sans-serif;
    --font-m:"JetBrains Mono",ui-monospace,"Courier New",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E141C;
      --grid:rgba(140,180,230,.07);
      --surface:#17202C;
      --surface-2:#1D2836;
      --line:#2C3A4B;
      --line-soft:#243040;
      --ink:#E6EDF5;
      --ink-soft:#9AACC0;
      --ink-faint:#71839A;
      --accent:#78B0EC;
      --accent-soft:#1B2C42;
      --ok:#4CC79A;
      --ok-soft:#14322A;
      --no:#F0796F;
      --no-soft:#39201E;
      --gold:#EDBE6A;
      --gold-soft:#332918;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E141C;
    --grid:rgba(140,180,230,.07);
    --surface:#17202C;
    --surface-2:#1D2836;
    --line:#2C3A4B;
    --line-soft:#243040;
    --ink:#E6EDF5;
    --ink-soft:#9AACC0;
    --ink-faint:#71839A;
    --accent:#78B0EC;
    --accent-soft:#1B2C42;
    --ok:#4CC79A;
    --ok-soft:#14322A;
    --no:#F0796F;
    --no-soft:#39201E;
    --gold:#EDBE6A;
    --gold-soft:#332918;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--ink);
    font-family:var(--font-b);
    font-size:16.5px;
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:660px;margin:0 auto;padding:0 14px 120px}
  h1,h2,h3{font-family:var(--font-d);font-weight:800;text-wrap:balance;margin:0;line-height:1.15}
  p{margin:0}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
    margin:0;padding:10px 14px;
  }
  .topbar-in{max-width:632px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
  .brand b{font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:-.2px;white-space:nowrap}
  .brand span{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:460px){ .brand span{display:none} }
  .tabs{margin-left:auto;display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:999px;padding:3px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0;flex-shrink:1}
  .topbar-in>.brand{flex-shrink:2}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:5px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;flex:0 0 auto}
  @media (max-width:520px){ .tabs button{padding:5px 9px;font-size:12.5px} }
  .tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,38,58,.12)}

  /* ---------- hero ---------- */
  .hero{padding:22px 0 6px}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .hero h1{font-size:clamp(28px,7.5vw,38px);letter-spacing:-.8px;margin:8px 0 8px}
  .hero p{color:var(--ink-soft);font-size:15.5px;max-width:52ch}

  .countdown{
    display:flex;gap:0;margin:18px 0 4px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--surface);overflow:hidden;box-shadow:var(--shadow);
  }
  .cd-cell{flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--line-soft)}
  .cd-cell:last-child{border-right:0}
  .cd-num{font-family:var(--font-m);font-weight:700;font-size:21px;letter-spacing:-.5px;font-variant-numeric:tabular-nums;display:block}
  .cd-lab{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em}

  .sec-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
  .sec-head h2{font-size:19px;letter-spacing:-.3px}
  .sec-head span{font-size:13px;color:var(--ink-faint);margin-left:auto;font-family:var(--font-m)}

  /* ---------- exam cards ---------- */
  .exam-list{display:flex;flex-direction:column;gap:10px}
  .exam{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px;box-shadow:var(--shadow);transition:transform .12s ease, border-color .12s ease;
  }
  .exam:hover{transform:translateY(-1px);border-color:var(--accent)}
  .exam.today{border-color:var(--accent);border-width:1.5px}
  .exam-day{
    flex:0 0 auto;width:46px;height:46px;border-radius:11px;background:var(--accent-soft);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  }
  .exam-day b{font-family:var(--font-m);font-size:17px;font-weight:700;color:var(--accent)}
  .exam-day i{font-style:normal;font-size:10px;text-transform:uppercase;color:var(--accent);opacity:.8;letter-spacing:.04em}
  .exam-body{min-width:0;flex:1}
  .exam-body h3{font-size:16.5px;letter-spacing:-.2px}
  .exam-body p{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .pill{
    flex:0 0 auto;font-family:var(--font-m);font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;
    background:var(--surface-2);color:var(--ink-faint);white-space:nowrap;
  }
  .pill.done{background:var(--ok-soft);color:var(--ok)}
  .pill.go{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .pill.go,
  :root:not([data-theme="light"]) .pill.go{color:#0E141C}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .pill.go{color:#fff}}

  /* ---------- generic card ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .note{background:var(--gold-soft);border:1px solid color-mix(in srgb, var(--gold) 35%, transparent);border-radius:12px;padding:13px 15px;font-size:14.5px}
  .note b{color:var(--gold)}

  /* ---------- runner ---------- */
  .runbar{
    position:sticky;top:0;z-index:20;margin:0 -14px;padding:9px 14px;
    background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .runbar-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .timer{font-family:var(--font-m);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .timer.low{color:var(--no)}
  .qcount{font-family:var(--font-m);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .btn-quit{margin-left:auto;font-size:13px;color:var(--ink-faint);font-weight:600;padding:4px 8px}
  .progress{height:4px;background:var(--line-soft);border-radius:99px;margin-top:8px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s ease}

  .qhead{display:flex;align-items:center;gap:8px;margin:20px 0 10px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}
  .chip.muted{background:var(--surface-2);color:var(--ink-faint)}
  .stem{font-size:17px;line-height:1.62;white-space:pre-wrap}
  .stem .passage{display:block;background:var(--surface-2);border-left:3px solid var(--line);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:14px;font-size:16px;line-height:1.65}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .opt{
    display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
    background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:16px;line-height:1.5;transition:border-color .12s, background .12s;
  }
  .opt:hover{border-color:var(--ink-faint)}
  .opt .k{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
    display:grid;place-items:center;font-family:var(--font-m);font-size:12.5px;font-weight:700;color:var(--ink-soft);
  }
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  :root[data-theme="dark"] .opt[aria-pressed="true"] .k,
  :root:not([data-theme="light"]) .opt[aria-pressed="true"] .k{color:#0E141C}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.chosen-wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.chosen-wrong .k{background:var(--no);border-color:var(--no);color:#fff}

  .navbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  }
  .navbar-in{max-width:660px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .nb{
    flex:0 0 auto;padding:11px 15px;border-radius:11px;border:1.5px solid var(--line);
    background:var(--surface);font-weight:700;font-size:15px;
  }
  .nb[disabled]{opacity:.4;cursor:default}
  .nb.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--surface);text-align:center}
  :root[data-theme="dark"] .nb.primary,
  :root:not([data-theme="light"]) .nb.primary{color:#0E141C}
  .nb.finish{background:var(--ok);border-color:var(--ok);color:#fff}

  .grid-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px;margin-top:14px}
  .gq{
    aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);
    font-family:var(--font-m);font-size:13px;font-weight:700;color:var(--ink-soft);display:grid;place-items:center;
  }
  .gq.filled{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .gq.cur{outline:2.5px solid var(--ink);outline-offset:1px}
  .gq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .gq.bad{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .gq.skip{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}

  /* ---------- görmedik butonu ---------- */
  .skipbtn{
    display:block;width:100%;margin-top:14px;padding:12px;border-radius:12px;
    border:1.5px dashed var(--line);background:var(--surface);
    font-size:14.5px;font-weight:600;color:var(--ink-soft);text-align:center;
  }
  .skipbtn.on{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
  .opts.dim{opacity:.42}

  /* ---------- arşiv ---------- */
  .arch-row{border-top:1px solid var(--line-soft);padding-top:13px;margin-top:13px}
  .arch-row:first-child{border-top:0;padding-top:0;margin-top:0}
  .arch-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .arch-head b{font-size:15px}
  .arch-head span{font-size:12.5px;color:var(--ink-faint);font-family:var(--font-m)}
  .arch-head .net{margin-left:auto;font-family:var(--font-m);font-size:13px;font-weight:700;color:var(--ok)}

  /* ---------- results ---------- */
  .score-head{display:flex;gap:16px;align-items:center;margin-top:20px}
  .ring{flex:0 0 auto;width:112px;height:112px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
  .ring-c b{font-family:var(--font-m);font-size:28px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .ring-c span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em}
  .score-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .kv{display:flex;align-items:baseline;gap:8px;font-size:14.5px}
  .kv b{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-size:16px}
  .kv span{color:var(--ink-soft)}
  .kv .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

  .subj{display:flex;flex-direction:column;gap:11px;margin-top:6px}
  .subj-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
  .subj-row .n{font-weight:600;font-size:14.5px}
  .subj-row .v{font-family:var(--font-m);font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .b-ok{background:var(--ok)}
  .bar .b-no{background:var(--no)}

  .rev{display:flex;flex-direction:column;gap:10px}
  .rev-item{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .rev-top{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}
  .rev-no{font-family:var(--font-m);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
  .rev-no.ok{background:var(--ok-soft);color:var(--ok)}
  .rev-no.bad{background:var(--no-soft);color:var(--no)}
  .rev-no.blank{background:var(--surface-2);color:var(--ink-faint)}
  .rev-t{flex:1;min-width:0}
  .rev-t b{display:block;font-size:14.5px;font-weight:600}
  .rev-t span{font-size:12.5px;color:var(--ink-faint)}
  .rev-open{font-family:var(--font-m);font-size:12px;color:var(--ink-faint)}
  .rev-body{padding:0 14px 14px;border-top:1px solid var(--line-soft);padding-top:13px}
  .expl{margin-top:13px;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6}
  .expl b{color:var(--accent);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-family:var(--font-m)}

  .code-box{
    font-family:var(--font-m);font-size:12.5px;word-break:break-all;background:var(--surface-2);
    border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin-top:10px;line-height:1.5;
    -webkit-user-select:all;user-select:all;
  }
  .row-btn{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .row-btn button{flex:1;min-width:140px;padding:12px;border-radius:11px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surface);text-align:center}
  .row-btn button.go{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  :root[data-theme="dark"] .row-btn button.go,
  :root:not([data-theme="light"]) .row-btn button.go{color:#0E141C}

  /* ---------- plan ---------- */
  .plan-list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .plan-day{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
  .plan-day:last-child{border-bottom:0;padding-bottom:0}
  .plan-day .d{font-family:var(--font-m);font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
  .plan-day .t b{display:block;font-size:15px;font-weight:700}
  .plan-day .t p{font-size:14px;color:var(--ink-soft);margin-top:1px}
  table.dist{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
  table.dist th,table.dist td{padding:8px 6px;border-bottom:1px solid var(--line-soft);text-align:left}
  table.dist th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700}
  table.dist td.n{font-family:var(--font-m);text-align:right;font-variant-numeric:tabular-nums}
  .tblwrap{overflow-x:auto}
  .hint{font-size:13.5px;color:var(--ink-faint);margin-top:10px}
  /* ---------- dersler ---------- */
  .lesson-list{display:flex;flex-direction:column;gap:10px}
  .lesson{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;
  }
  .lesson:hover{transform:translateY(-1px);border-color:var(--accent)}
  .lesson .ic{
    flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--gold-soft);
    display:grid;place-items:center;font-family:var(--font-m);font-weight:700;font-size:14px;color:var(--gold);
  }
  .lesson .tx{flex:1;min-width:0}
  .lesson .tx b{display:block;font-family:var(--font-d);font-weight:800;font-size:16px;letter-spacing:-.2px}
  .lesson .tx span{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}

  .prose{font-size:16.5px;line-height:1.65}
  .prose h3{font-size:17.5px;margin:26px 0 0;letter-spacing:-.2px}
  .prose h3:first-child{margin-top:0}
  .prose p{margin-top:11px}
  .prose ul{margin:11px 0 0;padding-left:20px}
  .prose li{margin-top:7px}
  .prose b{font-weight:700}
  .prose em{font-style:normal;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:5px;font-weight:600}
  .prose .ex{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:13px;font-size:15.5px;line-height:1.6}
  .prose .warn{background:var(--no-soft);border-left:3px solid var(--no);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:13px;font-size:15.5px;line-height:1.6}
  .prose .tip{background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:13px;font-size:15.5px;line-height:1.6}
  .prose .ex b,.prose .warn b,.prose .tip b{display:block;font-family:var(--font-m);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
  .prose .ex b{color:var(--accent)} .prose .warn b{color:var(--no)} .prose .tip b{color:var(--ok)}
  .prose table{width:100%;border-collapse:collapse;font-size:15px;margin-top:13px;display:block;overflow-x:auto}
  .prose th,.prose td{padding:8px 8px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}

<script>
/* ============================ VERİ ============================ */
const EXAMS = [
{"id": "D04", "date": "2026-09-15", "title": "4. Mini Deneme", "subtitle": "TD01'in yanlışları üzerine kurulu · 20 soru", "minutes": 30, "tag": "MİNİ", "intro": "Günce, tam provanı gördüm: Türkçe'de 20 soruda 16 net çıkardın, bu harika. Bugünkü 20 soru tam provada takıldığın yerlerden seçildi: adlaşmış sıfat-fiil, deyim, soru eki \"mi\", EBOB'ta \"kaç parça\", DNA eşlenmesi, kader-kaza. Ters soru kökü (\"değildir\", \"söylenemez\", \"çıkarılamaz\") olan 4 soru var — onları görünce dur, kökü yuvarla, şıkların yanına ✓/✗ koy. Acele etme; 20 soru için 30 dakikan var, en az 18 dakika kullan.", "questions": [{"s": "Türkçe", "t": "Fiilimsiler · adlaşmış sıfat-fiil", "d": 2, "q": "Aşağıdaki cümlelerin hangisinde adlaşmış sıfat-fiil kullanılmıştır?", "o": ["Sınıfa geç gelen öğrenciler kapıda bekledi.", "Bu soruyu bilenler parmak kaldırsın.", "Yarın okunacak metni fotokopiyle çoğalttık.", "Camı kıran çocuk hemen özür diledi."], "a": 1, "e": "Sıfat-fiil normalde bir ismi niteler: “<u>gelen</u> <b>öğrenciler</b>” gibi. Nitelenen isim cümleden <b>düşer</b> ve sıfat-fiil onun yerine geçip çokluk, iyelik ya da hâl eki alırsa buna <b>adlaşmış sıfat-fiil</b> denir.\nB'de “bilenler” aslında “bilen <b>kişiler</b>” demek. “Kişiler” düşmüş, sıfat-fiil <b>-ler</b> çokluk ekini alıp isim gibi davranmış ve cümlenin öznesi olmuş. Doğru cevap <b>B</b> ✔\nA neden yanlış: “gelen” hemen sağındaki “öğrenciler” ismini niteliyor; isim ortada duruyor, adlaşma yok.\nC neden yanlış: “okunacak”, “metni” ismini niteliyor. Buradaki -i eki <b>metin</b>e ait, sıfat-fiile değil.\nD neden yanlış: “kıran”, “çocuk” ismini niteliyor; yine yalnızca sıfat-fiil.\nPüf noktası: Tek bir test yeter → <b>sıfat-fiilin hemen sağına bak</b>. Sağında nitelediği bir isim varsa sıfat-fiil; sağında isim yoksa ve ek doğrudan sıfat-fiile yapışmışsa <b>adlaşmıştır</b>. Bu soru sana dördüncü kez soruluyor Günce — “sağına bak” kuralını bu kez şıkların yanına yazarak uygula."}, {"s": "Türkçe", "t": "Söz öbeğinde anlam · deyim (ters kök)", "d": 2, "q": "Aşağıdaki cümlelerin hangisinde deyim <b>kullanılmamıştır</b>?", "o": ["Sabah kahvaltısında iki dilim ekmek yedi.", "Parayı görünce gözü döndü.", "Bütün gece ders çalıştı, gözüne uyku girmedi.", "Öğretmenin söyledikleri aklına yattı."], "a": 0, "e": "<b>Ters kök uyarısı!</b> Soru “kullanılmamıştır” diyor; yani deyim <b>olmayan</b> cümleyi arıyorsun. Üç adımlık yöntemi uygula: 1) Olumsuz kökü yuvarlak içine al. 2) Her şıkkın yanına deyim varsa ✓, yoksa ✗ koy. 3) Tek ✗ kalanı işaretle.\nB ✓ “gözü dönmek” = hırstan kendini kaybetmek.\nC ✓ “gözüne uyku girmemek” = hiç uyuyamamak.\nD ✓ “aklına yatmak” = uygun, doğru bulmak.\nA ✗ Cümlede kalıplaşmış, mecazlı hiçbir söz yok; her kelime gerçek anlamında. Doğru cevap <b>A</b> ✔\nPüf noktası: Deyimin iki şartı vardır — <b>kalıplaşmıştır</b> (kelimeleri değiştirilemez) ve genellikle <b>mecaz anlamlıdır</b>. Bir sözü gözünde olduğu gibi canlandırabiliyorsan (iki dilim ekmek yemek gibi) o deyim değildir."}, {"s": "Türkçe", "t": "Yazım kuralları · de/da, ki, mi", "d": 1, "q": "Aşağıdaki cümlelerin hangisinde bir yazım yanlışı vardır?", "o": ["Bu kitabı ben de okudum.", "Oda o kadar dağınıktı ki içeri giremedik.", "Annemin dediği de doğruymuş.", "Sen bizimle gelirmisin diye sordular."], "a": 3, "e": "Soru eki <b>mi / mı / mu / mü</b> kendinden önceki kelimeden <b>her zaman ayrı</b> yazılır. D'deki “gelirmisin” bu yüzden yanlış; doğrusu “gelir misin” olmalıydı. Doğru cevap <b>D</b> ✔\nA neden doğru yazılmış: “ben <b>de</b>” buradaki de bağlaçtır, zaten ayrı yazılmış.\nB neden doğru yazılmış: Bağlaç olan <b>ki</b> ayrı yazılır; “dağınıktı ki” doğrudur.\nC neden doğru yazılmış: “dediği <b>de</b>” yine bağlaç; cümleden çıkarılabiliyor, demek ki ayrı yazılır.\nPüf noktası: Üç ayrı kural, üç ayrı test → <b>de/da</b>: cümleden atıldığında anlam ayakta kalıyorsa bağlaç, ayrı yazılır. <b>ki</b>: “dedi ki, o kadar ki” gibi bağlaçsa ayrı. <b>mi</b>: soru ekiyse <b>istisnasız</b> ayrı. TD01'de bu soruyu de/da ile karıştırmıştın; şıkları okurken önce soru eki var mı diye bak."}, {"s": "Türkçe", "t": "Fiilimsiler · parçada sayma", "d": 3, "q": "[P]Akşam serinliğinde balkona çıkan dedem, gazetesini okumaya başladı. Sokaktan gelen çocuk sesleri duyulunca gülümsedi. Uzun yıllar önce yaşadığı o mahalleyi anımsamak, ona hep iyi gelirdi.[/P]\nBu parçada kaç tane fiilimsi vardır?", "o": ["4", "5", "6", "7"], "a": 2, "e": "Fiilimsileri tek tek işaretleyelim:\n1. <b>çıkan</b> → -an, sıfat-fiil (dedemi niteliyor)\n2. <b>okumaya</b> → -ma, isim-fiil\n3. <b>gelen</b> → -en, sıfat-fiil (sesleri niteliyor)\n4. <b>duyulunca</b> → -ince, zarf-fiil\n5. <b>yaşadığı</b> → -dık, sıfat-fiil (mahalleyi niteliyor)\n6. <b>anımsamak</b> → -mak, isim-fiil\nToplam <b>6</b> fiilimsi. Doğru cevap <b>C</b> ✔\nA ve B neden yanlış: 4 ya da 5 diyenler genellikle ya “duyulunca” gibi zarf-fiilleri ya da “okumaya” gibi çekim eki almış isim-fiilleri atlıyor.\nD neden yanlış: 7 diyenler “başladı, gülümsedi, gelirdi” gibi çekimli fiilleri de sayıyor. Bunlar cümlenin yüklemidir, fiilimsi değildir.\n<b>Tuzak:</b> “serinliğinde” ve “mahalleyi” gibi kelimelerdeki ekler isme gelen eklerdir, fiilimsi değil.\nPüf noktası: Parçayı <b>iki turda</b> tara. Birinci turda yalnızca -an/-en/-dık/-ecek/-mez (sıfat-fiil), ikinci turda -ince/-erek/-ip/-meden/-ken (zarf-fiil) ve -mak/-ma/-ış (isim-fiil) ara. Tek turda saymak en sık yapılan hatadır."}, {"s": "Türkçe", "t": "Parça · çıkarılamaz (ters kök)", "d": 2, "q": "[P]Bir kitabın kapağı, aslında o kitabın ilk cümlesidir. Yayıncılar kapak tasarımına aylarını ayırır; çünkü okur raftaki yüzlerce kitaptan birini çoğu zaman birkaç saniyede seçer. Kapaktaki renk, yazı tipi ve görsel, kitabın türünü daha açılmadan okura fısıldar. Aynı kitabın farklı ülkelerdeki kapaklarının birbirine hiç benzememesi de bundandır: her ülkenin okuru farklı işaretlerle konuşur.[/P]\nBu parçadan aşağıdakilerin hangisi <b>çıkarılamaz</b>?", "o": ["Kapak tasarımı, okurun seçimini etkileyen bir unsurdur.", "Bir kitabın kapağı, türüyle ilgili ipucu verir.", "Kapak tasarımları ülkeden ülkeye değişebilir.", "Kapağı sade olan kitaplar daha çok satmaktadır."], "a": 3, "e": "<b>Ters kök uyarısı!</b> Soru “çıkarılamaz” diyor; parçada <b>olmayanı</b> arıyorsun. Üç adım: 1) Olumsuz kökü yuvarla. 2) Şıkların yanına ✓ / ✗ koy. 3) Tek ✗'i işaretle.\nA ✓ “okur yüzlerce kitaptan birini birkaç saniyede seçer” ve “yayıncılar aylarını ayırır” cümleleri bunu destekliyor.\nB ✓ “kitabın türünü daha açılmadan okura fısıldar” deniyor.\nC ✓ “farklı ülkelerdeki kapakların birbirine hiç benzememesi” deniyor.\nD ✗ Parçada sade kapaklardan, satış rakamlarından ya da hangi tasarımın daha çok sattığından <b>tek kelime</b> yok. Doğru cevap <b>D</b> ✔\nPüf noktası: Ters köklü sorularda üç şık doğru görünür, işte seni yanıltan da budur. “Daha çok”, “en”, “her zaman” gibi <b>karşılaştırma</b> bildiren şıklar çoğu zaman parçada olmayanlardır — önce onlardan şüphelen."}, {"s": "Matematik", "t": "Çarpanlar ve katlar · EBOB problemi", "d": 2, "q": "Bir marangoz, 120 cm ve 180 cm uzunluğundaki iki tahtayı hiç artmayacak biçimde eşit uzunlukta parçalara ayırmak istiyor. Parçalar olabilecek en uzun boyda olacağına göre, marangoz <b>toplam kaç parça</b> elde eder?", "o": ["5", "6", "8", "60"], "a": 0, "e": "Önce en uzun parça boyunu bulalım. “Hiç artmayacak” + “en uzun” = <b>EBOB</b>.\n120 = 2³ · 3 · 5\n180 = 2² · 3² · 5\nOrtak asal çarpanların <b>küçük</b> üslüleri: 2² · 3 · 5 = <b>60 cm</b>.\nŞimdi soru “kaç parça” diyor:\n120 ÷ 60 = 2 parça\n180 ÷ 60 = 3 parça\nToplam 2 + 3 = <b>5</b> parça. Doğru cevap <b>A</b> ✔\nB neden yanlış: 6 diyenler 2 × 3 çarpımını yapıyor; oysa parçalar toplanır, çarpılmaz.\nC neden yanlış: 8, EBOB'u yanlış (45 gibi) bulunca çıkan bir sonuç.\nD neden yanlış: <b>60, parça sayısı değil parça uzunluğudur.</b> İşte senin en çok düştüğün tuzak bu.\nPüf noktası: EBOB sorularında işlemi bitirdikten sonra <b>sorunun son cümlesine geri dön</b> ve kendine sor: “Benden uzunluk mu istendi, adet mi?” D03'te bunu başarmıştın, TD01'de yine kaydın. İşlemi bitirince iki saniye durup soruyu bir daha oku."}, {"s": "Matematik", "t": "Üslü ifadeler · üssün üssü", "d": 2, "q": "(2³)⁴ : 2⁸ işleminin sonucu kaçtır?", "o": ["8", "16", "32", "64"], "a": 1, "e": "Üslü ifadelerde iki kuralı sırayla uygulayacağız.\n1) <b>Üssün üssü</b>: (a^m)^n = a^(m·n). Yani (2³)⁴ = 2^(3·4) = 2¹².\n2) <b>Aynı tabanda bölme</b>: a^m : a^n = a^(m−n). Yani 2¹² : 2⁸ = 2^(12−8) = 2⁴.\n2⁴ = 2·2·2·2 = <b>16</b>. Doğru cevap <b>B</b> ✔\nA neden yanlış: 8 = 2³; üsleri 12−9 gibi yanlış çıkarınca bulunur.\nC neden yanlış: 32 = 2⁵; üssün üssünde 3+4=7 diye <b>toplama</b> yapıp 2⁷:2² gibi karıştırınca çıkar.\nD neden yanlış: 64 = 2⁶; çarpma ile bölmeyi karıştırınca (12−6 gibi) çıkar.\nPüf noktası: Üssün üssünde üsler <b>çarpılır</b>, aynı tabanlı çarpmada <b>toplanır</b>, bölmede <b>çıkarılır</b>. Karıştırdığında küçük bir örnekle kontrol et: (2²)³ = 4³ = 64 = 2⁶ → demek ki çarpılıyor."}, {"s": "Matematik", "t": "Üslü ifadeler · bilimsel gösterim", "d": 1, "q": "Bir bakterinin uzunluğu 0,0000025 metredir. Bu uzunluğun bilimsel gösterimi aşağıdakilerden hangisidir?", "o": ["2,5 × 10⁻⁵", "25 × 10⁻⁵", "2,5 × 10⁻⁶", "2,5 × 10⁶"], "a": 2, "e": "Bilimsel gösterimde sayı <b>a × 10ⁿ</b> biçiminde yazılır ve <b>1 ≤ a < 10</b> olmak zorundadır.\n0,0000025 sayısında virgülü 2 ile 5 arasına getirmek için <b>sağa doğru 6 basamak</b> kaydırmamız gerekir: 0,0000025 → 2,5\nVirgül sağa kaydıysa üs <b>negatif</b> olur: 2,5 × 10⁻⁶. Doğru cevap <b>C</b> ✔\nKontrol: 2,5 × 10⁻⁶ = 2,5 ÷ 1 000 000 = 0,0000025 ✔\nA neden yanlış: 2,5 × 10⁻⁵ = 0,000025 — bizim sayımızın on katı. Basamak sayarken bir eksik saymış oluyorsun.\nB neden yanlış: İki kat hatalı. Önce değeri tutmuyor: 25 × 10⁻⁵ = 0,00025, bizim sayımızın yüz katı. Üstelik biçimi de kurala aykırı: baştaki sayı 1 ile 10 arasında olmalıydı, 25 olamaz.\nD neden yanlış: 2,5 × 10⁶ = 2 500 000. Pozitif üs sayıyı büyüttü; oysa bizimki 1'den küçük.\nPüf noktası: Sayı <b>1'den küçükse üs her zaman negatiftir</b>; 1'den büyükse pozitiftir. Basamakları saymak için virgülün kaç adım yürüdüğünü parmakla say: 0,0000025 → 0,000025 → ... → 2,5 (6 adım)."}, {"s": "Matematik", "t": "Veri analizi · tablo yorumlama (ters kök)", "d": 3, "q": "[P]Bir okulda 8. sınıf öğrencilerine \"Hangi kulübe katılmak istersin?\" diye sorulmuş ve sonuçlar tabloya işlenmiştir.\n\nKulüp — Kız — Erkek\nSatranç — 12 — 18\nMüzik — 20 — 10\nResim — 8 — 6\nSpor — 10 — 26[/P]\nBu tabloya göre aşağıdakilerden hangisi <b>söylenemez</b>?", "o": ["En çok tercih edilen kulüp spordur.", "Satrancı ve müziği seçenlerin toplam sayıları birbirine eşittir.", "Ankete katılan öğrenci sayısı 110'dur.", "Her kulüpte erkek öğrenci sayısı kız öğrenci sayısından fazladır."], "a": 3, "e": "<b>Ters kök uyarısı!</b> “söylenemez” diyor; tabloya <b>uymayan</b> cümleyi arıyorsun. Önce toplamları çıkaralım:\nSatranç 12+18 = <b>30</b> · Müzik 20+10 = <b>30</b> · Resim 8+6 = <b>14</b> · Spor 10+26 = <b>36</b>\nKızlar toplam: 12+20+8+10 = 50 · Erkekler toplam: 18+10+6+26 = 60 · Genel toplam: <b>110</b>\nŞimdi şıkları işaretleyelim:\nA ✓ En büyük toplam 36 ile spor.\nB ✓ 30 = 30, eşit.\nC ✓ 50 + 60 = 110.\nD ✗ Müzikte kızlar 20, erkekler 10; resimde kızlar 8, erkekler 6. İki kulüpte kızlar daha fazla. Doğru cevap <b>D</b> ✔\nPüf noktası: Tablo sorusuna başlar başlamaz <b>satır ve sütun toplamlarını kenara yaz</b>. Şıkları okurken hesap yapmak zorunda kalmazsın, hem hız hem doğruluk kazanırsın. Ayrıca “hepsinde / her” diyen bir şık gördüğünde tek bir ters örnek aramak yeter."}, {"s": "Matematik", "t": "Çarpanlar ve katlar · EKOK problemi", "d": 2, "q": "Bir otogarda A hattının otobüsleri her 12 dakikada bir, B hattının otobüsleri her 18 dakikada bir kalkmaktadır. İki hattın otobüsleri saat 09.00'da birlikte kalktığına göre, bundan sonra ilk kez aynı anda saat kaçta kalkarlar?", "o": ["09.30", "09.36", "10.00", "09.24"], "a": 1, "e": "“Aynı anda tekrar” diyen sorular <b>EKOK</b> sorularıdır.\n12 = 2² · 3\n18 = 2 · 3²\nEKOK'ta tüm asal çarpanların <b>büyük</b> üslüleri alınır: 2² · 3² = 4 · 9 = <b>36</b> dakika.\n09.00 + 36 dakika = <b>09.36</b>. Doğru cevap <b>B</b> ✔\nKontrol: A hattı 09.12, 09.24, <b>09.36</b> · B hattı 09.18, <b>09.36</b> — ilk buluşma gerçekten 09.36 ✔\nA neden yanlış: 30 dakika, 12'nin katı değil (12, 24, 36...). A hattı 09.30'da kalkmaz.\nC neden yanlış: 60 dakika ikisinin de ortak katıdır ama <b>en küçüğü</b> değildir; soru “ilk kez” diyor.\nD neden yanlış: 24 dakika, 18'in katı değil. B hattı 09.24'te kalkmaz.\nPüf noktası: EBOB ile EKOK'u ayırmanın en kolay yolu: <b>parçalara ayırma, paylaştırma, artmadan bölme</b> → EBOB. <b>Tekrar buluşma, aynı anda, en az kaç tane</b> → EKOK. Soruda “aynı anda” görür görmez kenara EKOK yaz."}, {"s": "Fen Bilimleri", "t": "DNA ve Genetik Kod · DNA'nın kendini eşlemesi", "d": 3, "q": "Bir hücredeki tek bir DNA molekülü kendini <b>art arda iki kez</b> eşlerse, oluşan DNA'larla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["4 DNA oluşur; bunların 2'sinde ilk DNA'dan gelen birer zincir bulunur.", "4 DNA oluşur; bunların 4'ünde de ilk DNA'dan gelen birer zincir bulunur.", "2 DNA oluşur; bunların 2'sinde de ilk DNA'dan gelen birer zincir bulunur.", "4 DNA oluşur; bunların yalnızca 1'inde ilk DNA'dan gelen bir zincir bulunur."], "a": 0, "e": "Adım adım gidelim. DNA <b>yarı korunumlu</b> eşlenir: iki zincir birbirinden ayrılır, her biri karşısına yeni bir zincir yaptırır. Yani her yeni DNA'nın bir zinciri eski, bir zinciri yenidir.\n<b>1. eşleme:</b> 1 DNA → 2 DNA. Başlangıçtaki 2 eski zincir, bu 2 DNA'ya birer birer dağıldı. İkisinde de eski zincir var.\n<b>2. eşleme:</b> 2 DNA → 4 DNA. Bu sefer her DNA ikiye ayrılıyor; eski zincirler yine yalnızca <b>2 tane</b> olduğu için 4 DNA'nın ancak <b>2'sine</b> düşer. Kalan 2 DNA tamamen yeni zincirlerden oluşur.\nDoğru cevap <b>A</b> ✔\nB neden yanlış: Eski zincir sayısı hiç artmaz, hep 2'dir; 4 DNA'nın hepsine yetmez.\nC neden yanlış: İki kez eşleme 2² = 4 DNA verir, 2 değil. “Art arda iki kez” ifadesini atlama.\nD neden yanlış: Eski zincirler 2 tane olduğu için 2 farklı DNA'ya dağılır, tek bir DNA'da toplanmaz.\nPüf noktası: Ezberlenecek iki sayı var → <b>DNA sayısı = 2ⁿ</b> (n = eşleme sayısı), <b>eski zincir taşıyan DNA sayısı = her zaman 2</b>. Kaç kez eşlerse eşlesin bu ikinci sayı değişmez."}, {"s": "Fen Bilimleri", "t": "Mevsimler ve İklim · 21 Haziran (ters kök)", "d": 3, "q": "21 Haziran tarihiyle ilgili olarak aşağıdakilerden hangisi <b>yanlıştır</b>?", "o": ["Güneş ışınları Yengeç Dönencesi'ne dik açıyla düşer.", "Kuzey Yarım Küre'de yaz mevsimi başlar.", "Güney Yarım Küre'de yılın en uzun gecesi yaşanır.", "Ekvator'da gündüz süresi gece süresinden uzundur."], "a": 3, "e": "<b>Ters kök uyarısı!</b> “yanlıştır” diyor; doğru olanları değil, <b>yanlış olanı</b> arıyorsun. Şıkların yanına ✓/✗ koyarak ilerle.\nA ✓ 21 Haziran'da Güneş ışınları 23°27' kuzey enlemine, yani <b>Yengeç Dönencesi</b>'ne dik düşer.\nB ✓ Kuzey Yarım Küre'de yaz mevsimi bu tarihte başlar (yaz gündönümü).\nC ✓ Güney Yarım Küre'de ise kış başlar; o yarım kürede yılın <b>en uzun gecesi</b> yaşanır.\nD ✗ <b>Ekvator'da gece ve gündüz süresi yıl boyunca her zaman 12'şerdir.</b> Eksen eğikliği Ekvator'da gündüz-gece farkı oluşturmaz. Doğru cevap <b>D</b> ✔\nPüf noktası: Üç tarihi bir arada ezberle → <b>21 Haziran</b>: Yengeç, KYK yaz. <b>21 Aralık</b>: Oğlak, GYK yaz. <b>21 Mart ve 23 Eylül</b>: Ekvator, her yerde 12-12. Ve her zaman hatırla: <b>Ekvator'da gündüz hep 12 saattir</b> — bu, sınavların favori tuzağıdır."}, {"s": "Fen Bilimleri", "t": "DNA ve Genetik Kod · DNA-gen-kromozom ilişkisi", "d": 1, "q": "Aşağıdakilerden hangisi kalıtsal yapıların <b>büyükten küçüğe</b> doğru sıralanışıdır?", "o": ["Kromozom > DNA > Gen > Nükleotid", "DNA > Kromozom > Gen > Nükleotid", "Gen > DNA > Kromozom > Nükleotid", "Nükleotid > Gen > DNA > Kromozom"], "a": 0, "e": "İç içe geçmiş kutular gibi düşün:\n• <b>Kromozom</b> en büyük yapıdır; DNA'nın protein etrafına sarılıp paketlenmiş hâlidir.\n• <b>DNA</b> kromozomun içindeki uzun moleküldür.\n• <b>Gen</b> DNA üzerinde belirli bir özelliği taşıyan küçük bir bölümdür.\n• <b>Nükleotid</b> ise DNA'nın en küçük yapı birimidir (fosfat + şeker + organik baz).\nSıralama: Kromozom > DNA > Gen > Nükleotid. Doğru cevap <b>A</b> ✔\nB neden yanlış: DNA kromozomun içindedir; kromozomdan büyük olamaz.\nC neden yanlış: Gen, DNA'nın bir parçasıdır; DNA'dan da kromozomdan da büyük olamaz.\nD neden yanlış: Sıralama tamamen ters çevrilmiş; nükleotid en küçük birimdir.\nPüf noktası: Şu cümleyi aklında tut → <b>“Kromozomun içinde DNA, DNA'nın üzerinde gen, genin içinde nükleotidler vardır.”</b> Sıralama sorularında bu cümleyi baştan sona okuman yeter."}, {"s": "Fen Bilimleri", "t": "DNA ve Genetik Kod · baz eşleşmesi hesabı", "d": 2, "q": "Bir DNA molekülünün zincirlerinden birinde 120 adenin ve 180 timin nükleotidi bulunmaktadır. Buna göre bu DNA molekülünün <b>çift zincirinde toplam</b> kaç timin nükleotidi vardır?", "o": ["120", "180", "300", "360"], "a": 2, "e": "Baz eşleşme kuralı: <b>A daima T ile</b>, <b>G daima S (sitozin) ile</b> eşleşir.\nAdım adım:\n<b>1. zincir:</b> A = 120, T = 180 (soruda verildi).\n<b>2. zincir:</b> 1. zincirdeki her A'nın karşısında T, her T'nin karşısında A bulunur. Yani 2. zincirde T = 120, A = 180.\n<b>Toplam timin</b> = 1. zincirin timini + 2. zincirin timini = 180 + 120 = <b>300</b>. Doğru cevap <b>C</b> ✔\nKontrol: Toplam adenin de 120 + 180 = 300. Çift zincirde A = T kuralı tutuyor ✔\nA neden yanlış: 120 yalnızca 2. zincirin timini; tek zincirin sonucunu vermiş oluyorsun.\nB neden yanlış: 180 yalnızca 1. zincirin timini. Soru “çift zincirde toplam” diyor — ikisini toplamalısın.\nD neden yanlış: 360, 180'in iki katı. İki zincirde de timinin 180 olduğunu sanarsan bu çıkar; ama 2. zincirin timini 1. zincirin <b>adeninine</b> eşittir.\nPüf noktası: Çift zincirli bir DNA'da her zaman <b>toplam A = toplam T</b> ve <b>toplam G = toplam S</b>'dir. İşlemi bitirince bu eşitliği kontrol olarak kullan — tutmuyorsa bir yerde hata var."}, {"s": "İnkılap Tarihi", "t": "Bir Kahraman Doğuyor · Selanik ve Manastır", "d": 1, "q": "Mustafa Kemal'in çocukluğunun ve öğrencilik yıllarının geçtiği Selanik ile Manastır'ın, onun fikir dünyasının gelişmesindeki etkisiyle ilgili aşağıdakilerden hangisi söylenebilir?", "o": ["Tarım ekonomisine dayalı küçük kasabalar olmaları, onu çiftçilikle ilgilenmeye yöneltmiştir.", "Yalnızca Türklerin yaşadığı şehirler olmaları, onun başka kültürleri tanımasını engellemiştir.", "Farklı milletlerin bir arada yaşadığı, milliyetçilik akımının güçlü hissedildiği şehirler olmaları, onun toplumsal olayları yakından gözlemlemesini sağlamıştır.", "Osmanlı Devleti'nin dış dünyaya en kapalı şehirleri olmaları, onun yeni fikirlerden uzak kalmasına yol açmıştır."], "a": 2, "e": "Selanik ve Manastır, Osmanlı'nın <b>Rumeli</b> topraklarındaydı. Bu şehirlerde Türkler, Rumlar, Bulgarlar, Sırplar, Yahudiler ve Arnavutlar bir arada yaşıyordu; Fransız İhtilali'yle yayılan <b>milliyetçilik</b> akımı en önce burada isyanlara dönüşmüştü. Ayrıca bu şehirler Avrupa'ya en yakın, gazete ve kitapların en çabuk ulaştığı yerlerdi. Mustafa Kemal böyle bir ortamda büyüdüğü için devletin sorunlarını kitaptan değil, <b>gözleyerek</b> öğrendi. Doğru cevap <b>C</b> ✔\nA neden yanlış: Selanik, Osmanlı'nın en işlek <b>liman ve ticaret</b> şehirlerinden biriydi; küçük bir tarım kasabası değil.\nB neden yanlış: Tam tersi — bu şehirlerin en belirgin özelliği <b>çok uluslu</b> olmalarıydı.\nD neden yanlış: Yine tersi — Avrupa'ya yakınlıkları sayesinde yeni fikirlerin Osmanlı'ya ilk girdiği şehirlerdendi.\nPüf noktası: Bu ünitede şu zinciri kur → <b>Rumeli = çok uluslu = milliyetçilik = isyan = Mustafa Kemal'in ilk gözlemleri.</b> Şıklarda “yalnızca Türkler”, “kapalı”, “küçük kasaba” gibi ifadeler görürsen doğrudan ele."}, {"s": "İnkılap Tarihi", "t": "Fikir akımları · Osmanlıcılık", "d": 2, "q": "[P]Osmanlı Devleti'nin dağılmasını önlemek için ortaya atılan fikir akımlarından biri, devlet sınırları içinde yaşayan herkesin din ve milliyet farkı gözetilmeksizin eşit haklara sahip birer \"Osmanlı vatandaşı\" sayılmasını savunuyordu.[/P]\nSözü edilen fikir akımı ile bu akımın geçerliliğini yitirmesine yol açan gelişme aşağıdakilerin hangisinde birlikte verilmiştir?", "o": ["Osmanlıcılık — Balkan Savaşları", "İslamcılık — Trablusgarp Savaşı", "Türkçülük — Balkan Savaşları", "Batıcılık — I. Dünya Savaşı"], "a": 0, "e": "Parçadaki anahtar ifade şu: “din ve milliyet farkı gözetilmeksizin herkes eşit Osmanlı vatandaşı”. Bu, <b>Osmanlıcılık</b>'ın tanımıdır.\nPeki ne zaman bitti? <b>Balkan Savaşları</b>'nda (1912-1913) Osmanlı'nın yüzyıllardır yönettiği Balkan uluslarının devlete karşı savaşması, “herkes Osmanlı vatandaşıdır” fikrinin artık yaşamadığını gösterdi. Doğru cevap <b>A</b> ✔\nB neden yanlış: İslamcılık, tüm Müslümanları halife etrafında birleştirmeyi savunur; parça “din farkı gözetilmeksizin” diyor, yani tam tersi. İslamcılık <b>I. Dünya Savaşı</b>'nda Arapların isyanıyla bitti.\nC neden yanlış: Türkçülük yalnızca Türkleri birleştirmeyi hedefler; “herkes” demez. Ayrıca Türkçülük Balkan Savaşları'yla bitmedi, <b>güçlendi</b>.\nD neden yanlış: Batıcılık bir birleştirme fikri değil, bir <b>çağdaşlaşma</b> önerisidir ve Cumhuriyet'le birlikte devam etmiştir; hiçbir savaşla “bitmemiştir”.\nPüf noktası: Dört akımı bittiği olayla birlikte ezberle → <b>Osmanlıcılık → Balkan Savaşları</b>, <b>İslamcılık → Arap İsyanı (I. Dünya Savaşı)</b>, <b>Türkçülük → devam etti</b>, <b>Batıcılık → hiç bitmedi</b>. Son iki akım bitmediği için “hangi akım son buldu” sorularında cevap asla Türkçülük ya da Batıcılık olmaz."}, {"s": "Din Kültürü", "t": "Kader ve Kaza · kavram ayrımı", "d": 2, "q": "Aşağıdaki durumlardan hangisi <b>kaza</b> kavramına örnektir?", "o": ["Bir insanın ne zaman doğacağının Allah tarafından ezelde bilinmesi", "Bahçeye ekilen tohumun ilkbaharda filizlenmesi", "Suyun 100 °C'de kaynayacağının belirlenmiş olması", "Her canlı için bir ömür süresinin takdir edilmiş olması"], "a": 1, "e": "İki kavramı bir kez daha net ayıralım:\n• <b>Kader</b> = Allah'ın olacak her şeyi ezelde <b>bilmesi, ölçü koyması, takdir etmesi</b>. Henüz gerçekleşmemiş olan <b>plan</b>dır.\n• <b>Kaza</b> = Takdir edilen o şeyin zamanı gelince <b>gerçekleşmesi</b>. Yani planın <b>hayata geçmesi</b>.\nB'de tohum gerçekten filizlenmiş, olay <b>olmuş</b>. Bu yüzden kazadır. Doğru cevap <b>B</b> ✔\nA neden yanlış: “ezelde bilinmesi” diyor — henüz olmamış, bilgi aşamasında. Bu <b>kader</b>dir.\nC neden yanlış: “belirlenmiş olması” bir ölçü koyma, yani <b>kader</b>dir. Suyun gerçekten kaynaması kaza olurdu.\nD neden yanlış: “takdir edilmiş olması” kelimesi zaten kaderin tanımında geçer.\nPüf noktası: Şu tek soruyu sor → <b>“Bu olay olmuş mu, yoksa henüz plan aşamasında mı?”</b> Olmuşsa kaza, planlanmışsa kader. Şıklarda “bilinmesi, belirlenmesi, takdir edilmesi, yazılmış olması” geçiyorsa <b>kader</b>; “-di, -mış” ile biten, gerçekleşmiş bir olay anlatılıyorsa <b>kaza</b>. Bu soru sana dördüncü kez soruluyor — bu kez bu cümleyi defterine yaz."}, {"s": "Din Kültürü", "t": "Evrendeki yasalar · toplumsal yasalar", "d": 2, "q": "Aşağıdaki örneklerden hangisi <b>toplumsal (sosyal) yasalara</b> örnektir?", "o": ["Isıtılan metal bir çubuğun boyunun uzaması", "Ayçiçeğinin gün boyunca Güneş'e doğru yönelmesi", "Üretime ve çalışmaya önem veren toplumların zamanla kalkınması", "Suyun içine bırakılan cismin kaldırma kuvvetiyle yukarı itilmesi"], "a": 2, "e": "Allah'ın evrene koyduğu yasalar üç başlıkta toplanır:\n• <b>Fiziksel yasalar</b> → cansız varlıklar, madde ve enerji (genleşme, yer çekimi, kaldırma kuvveti).\n• <b>Biyolojik yasalar</b> → canlıların yaşamı (büyüme, beslenme, ışığa yönelme).\n• <b>Toplumsal yasalar</b> → insan topluluklarının yaşamı (kalkınma, çöküş, adalet, yardımlaşma).\nC şıkkındaki “üretime önem veren toplumların kalkınması” bir <b>toplum</b> davranışıyla ilgili olduğu için toplumsal yasadır. Doğru cevap <b>C</b> ✔\nA neden yanlış: Metalin genleşmesi bir madde özelliğidir → <b>fiziksel</b> yasa.\nB neden yanlış: Ayçiçeğinin ışığa yönelmesi bir canlı davranışıdır → <b>biyolojik</b> yasa.\nD neden yanlış: Kaldırma kuvveti sıvıların bir özelliğidir → <b>fiziksel</b> yasa.\nPüf noktası: Şıkta geçen özneye bak → <b>cansız madde</b> ise fiziksel, <b>bitki/hayvan/insan bedeni</b> ise biyolojik, <b>toplum/millet/insanlar</b> ise toplumsal. Özneyi bulmak üç şıkkı bir anda eler."}, {"s": "İngilizce", "t": "Unit 2 Teen Life · frequency adverbs", "d": 1, "q": "[P]Zeynep: How often do you go to the cinema?\nAyşe: I go to the cinema twice a month.[/P]\nWhich adverb best describes Ayşe's cinema habit?", "o": ["always", "sometimes", "never", "hardly ever"], "a": 1, "e": "Önce sıklık zarflarını bir çizgi üzerine diz:\n<b>always</b> (%100) → usually (%80) → often (%60) → <b>sometimes</b> (%40-50) → <b>hardly ever</b> (%10) → <b>never</b> (%0)\nAyşe “twice a month” diyor, yani <b>ayda iki kez</b> — ne her zaman, ne de hiç. Bu, çizginin tam ortasına, <b>sometimes</b>'a düşer. Doğru cevap <b>B</b> ✔\nA neden yanlış: “always” her seferinde, istisnasız demek; ayda iki kez bunu karşılamaz.\nC neden yanlış: “never” hiç demek; oysa Ayşe gidiyor.\nD neden yanlış: “hardly ever” = neredeyse hiç, yılda bir iki kez gibi çok seyrek. Ayda iki kez bundan belirgin biçimde daha sık.\nPüf noktası: Bu soru tipinde sana verilen <b>sayıyı</b> yakala (twice a month, every day, once a year) ve zihnindeki çizgiye yerleştir. TD01'de bu soruyu kaçırmıştın — çizgiyi defterinin kenarına bir kez çiz, bir daha unutmazsın."}, {"s": "İngilizce", "t": "Unit 1 Friendship · personality adjectives", "d": 1, "q": "[P]Deniz never tells other people's secrets. When I tell her something private, I know it stays between us.[/P]\nWhich adjective best describes Deniz?", "o": ["selfish", "jealous", "aggressive", "trustworthy"], "a": 3, "e": "Metinde anahtar cümle şu: “never tells other people's secrets” (başkalarının sırlarını asla söylemez) ve “it stays between us” (aramızda kalır). Yani Deniz'e <b>güvenilebilir</b>. İngilizcesi <b>trustworthy</b>. Doğru cevap <b>D</b> ✔\nA neden yanlış: “selfish” = bencil, sadece kendini düşünen. Metinde böyle bir davranış yok.\nB neden yanlış: “jealous” = kıskanç. Metinde kıskançlıkla ilgili tek kelime geçmiyor.\nC neden yanlış: “aggressive” = saldırgan, kavgacı. Anlatılan davranışın tam tersi.\nPüf noktası: Kelime sorularında önce metindeki <b>davranışı Türkçe tek kelimeyle</b> özetle (“sır tutuyor → güvenilir”), sonra şıklara bak. Böylece bilmediğin bir kelime görsen bile doğru şıkkı tanırsın. Arkadaşlık ünitesinin en sık sorulan sıfatları: trustworthy, supportive, honest, reliable, generous, selfish."}]},
{"id":"TD01","date":"2026-09-12","title":"1. Tam LGS Provası","subtitle":"Gerçek sınav düzeni · sözel 50 + sayısal 40","minutes":155,"tag":"TAM DENEME","questions":[{"s":"Türkçe","t":"Parça · ana düşünce","d":2,"q":"[P]Bir ormana baktığında gördüğün ağaçlar aslında birbirinden kopuk bireyler değildir. Toprağın altında, kökleri saran ince mantar iplikleri ağaçtan ağaca uzanan bir ağ kurar. Güneşi bol alan yaşlı bir kayın, gölgede kalmış genç bir fidana bu ağ üzerinden şeker gönderebilir; hasta bir ağaç komşularına kimyasal bir uyarı sinyali yollayabilir. Yani orman, tek tek ağaçların toplamı değil, birbirine bağlı bir ortaklıktır.[/P]\nBu parçanın ana düşüncesi aşağıdakilerden hangisidir?","o":["Mantarlar ağaçların köklerinde yaşayarak onlardan besin alır.","Yaşlı ağaçlar, genç fidanlara göre güneşten daha çok yararlanır.","Orman, ağaçların yer altında kurduğu bağlarla işleyen bir bütündür.","Ağaçlar hastalandıklarında çevrelerine kimyasal madde salgılar."],"a":2,"e":"Ana düşünce, parçanın <b>tamamını</b> kucaklayan cümledir. Parça baştan sona şunu anlatıyor: ağaçlar yer altındaki mantar ağıyla birbirine bağlı, besin ve sinyal paylaşıyorlar. Son cümle de bunu \"orman tek tek ağaçların toplamı değildir\" diyerek özetliyor. Doğru cevap <b>C</b> ✔\nA neden yanlış: Parçada mantarların ağaçtan besin aldığı hiç söylenmiyor; mantar ağı burada bir taşıyıcı, bir köprü olarak anlatılıyor.\nB neden yanlış: Yaşlı kayının güneşi bol alması sadece örneği kurmak için verilmiş küçük bir ayrıntı.\nD neden yanlış: Kimyasal sinyal tek bir örnek; parçanın anlattığı şey bundan çok daha geniş.\nPüf noktası: Bir şık parçada geçiyor olabilir ama yalnızca <b>bir cümleyi</b> karşılıyorsa o ana düşünce değil, yardımcı düşüncedir. Ana düşünceyi bulmak için kendine \"Yazar bu parçayı neden yazmış?\" diye sor."},{"s":"Türkçe","t":"Parça · başlık","d":1,"q":"[P]Göçmen kuşların birçoğu yolunu bulmak için yıldızlara bakar. Ancak son elli yılda şehirlerin gökyüzüne saçtığı ışık, bu haritayı silik hâle getirdi. Parlak bir kulenin çevresinde saatlerce dönüp duran sürüler, enerjilerini tüketip yolculuğu yarıda bırakabiliyor. Kimi şehirler göç mevsiminde ışıklarını kısarak bu sorunu azaltmayı deniyor; ilk sonuçlar umut verici.[/P]\nBu parçaya en uygun başlık aşağıdakilerden hangisidir?","o":["Sönen Yıldızlar, Şaşıran Kanatlar","Kuşların Göç Yolları Nasıl Belirlenir?","Şehirlerde Enerji Tasarrufunun Yolları","Gece Gökyüzünü Gözlemlemenin Keyfi"],"a":0,"e":"Başlık, parçanın konusunu kısa ve çarpıcı biçimde vermelidir. Parçanın konusu: şehir ışıkları yıldızları görünmez kılıyor, bu yüzden göçmen kuşlar yollarını şaşırıyor. \"Sönen Yıldızlar, Şaşıran Kanatlar\" tam olarak bu iki parçayı birleştiriyor. Doğru cevap <b>A</b> ✔\nB neden yanlış: Parça, göç yollarının nasıl belirlendiğini genel olarak anlatmıyor; sadece yıldızlara bakma yönteminin bozulmasından söz ediyor.\nC neden yanlış: Işıkların kısılması bir <b>çözüm</b> olarak geçiyor, amaç enerji tasarrufu değil kuşları korumak.\nD neden yanlış: Parçada gökyüzü gözlemciliğinin keyfinden hiç söz edilmiyor.\nPüf noktası: Başlık sorularında bir şık parçadan daha <b>geniş</b> ya da daha <b>dar</b> olmamalı. C çok geniş, D konu dışı; doğru başlık parçanın tam ölçüsünde olandır."},{"s":"Türkçe","t":"Parça · çıkarılamaz (ters kök)","d":2,"q":"[P]Grönland'ın buzullarından çıkarılan uzun buz silindirleri, bilim insanları için birer takvim gibidir. Her yıl yağan kar üst üste binerek katman oluşturur; bu katmanların içinde o yılın havasından küçücük kabarcıklar hapsolur. Araştırmacılar kabarcıktaki gazları ölçerek yüzlerce yıl önceki havanın bileşimini öğrenir. Katmanlardaki ince kül izleri ise o dönemde patlayan yanardağların tarihini verir.[/P]\nBu parçadan aşağıdakilerin hangisi <b>çıkarılamaz</b>?","o":["Buz katmanları geçmişteki havayla ilgili bilgi taşır.","Buzullardaki kül izleri volkanik patlamalarla ilişkilendirilebilir.","Buz katmanları yıllara göre birbirinden ayırt edilebilir.","Buz çekirdeği alınan bölgelerde kar yağışı giderek azalmaktadır."],"a":3,"e":"<b>Ters kök uyarısı!</b> Soru \"çıkarılamaz\" diyor; yani sen parçada <b>olmayanı</b> arıyorsun. Üç adımlı yöntem: 1) Soru kökündeki olumsuz kelimeyi yuvarlak içine al. 2) Her şıkkın yanına, parçada karşılığı varsa ✓, yoksa ✗ koy. 3) Tek başına ✗ kalanı işaretle.\nA ✓ \"kabarcıktaki gazları ölçerek geçmiş havanın bileşimini öğrenir\" diyor.\nB ✓ \"kül izleri yanardağların tarihini verir\" diyor.\nC ✓ \"her yıl yağan kar üst üste binerek katman oluşturur\" diyor; demek ki katmanlar yıllara ayrılıyor.\nD ✗ Kar yağışının <b>azaldığına</b> dair parçada tek kelime yok. Doğru cevap <b>D</b> ✔\nPüf noktası: Ters köklü sorularda üç şık doğru görünür, bu seni yanıltır. Sen \"doğru olanı\" değil, \"parçada bulunmayanı\" arıyorsun. Şıkların yanına ✓/✗ koymak bu tuzağı bozar."},{"s":"Türkçe","t":"Parça · akışı bozan cümle","d":1,"q":"[P](1) Arılar çiçekleri yalnızca rengiyle değil, kokusunun bıraktığı izle de tanır. (2) Bir arı bir çiçeğe konduğunda ayaklarındaki bezlerden çok hafif bir koku bırakır. (3) Bal, insan beslenmesinde uzun yıllardır kullanılan doğal bir tatlandırıcıdır. (4) O çiçeğe yaklaşan diğer arılar bu kokuyu algılayınca nektarın az önce alındığını anlar. (5) Böylece boşuna zaman harcamadan başka çiçeklere yönelirler.[/P]\nBu parçada düşüncenin akışını bozan cümle aşağıdakilerden hangisidir?","o":["2. cümle","3. cümle","4. cümle","5. cümle"],"a":1,"e":"Parçanın konusu tek: arıların çiçekte bıraktıkları <b>koku iziyle</b> haberleşmesi. Cümleleri sırayla takip et: 1 konuyu açıyor, 2 kokunun nasıl bırakıldığını, 4 diğer arıların bunu nasıl anladığını, 5 de sonucunu anlatıyor. 3. cümle ise <b>balın insan beslenmesindeki yeri</b>nden söz ediyor; bu, arıların haberleşmesiyle hiç ilgili değil. Doğru cevap <b>B</b> ✔\nA neden yanlış: 2. cümle, 1. cümledeki \"koku izi\"ni açıklıyor, akışın tam içinde.\nC neden yanlış: 4. cümle olayın devamı; kokuyu alan arının tepkisini veriyor.\nD neden yanlış: 5. cümle \"böylece\" diyerek 4'ün sonucunu bağlıyor.\nPüf noktası: Akışı bozan cümleyi bulmak için parçayı o cümleyi <b>çıkararak</b> bir kez daha oku. Anlam hiç bozulmadan akıyorsa doğru cümleyi yakalamışsındır."},{"s":"Türkçe","t":"Parça · cevabı bulunan soru","d":2,"q":"[P]Cam, doğada hazır bulunan bir madde değildir; kumun yaklaşık 1700 derecede eritilmesiyle elde edilir. Erimiş cam soğurken katılaşır ama kristal bir yapı kurmaz, işte bu yüzden ışığı geçirir. Üfleme tekniğinde usta, erimiş camı boru ucunda döndürerek biçim verir; soğuma çok hızlı olursa cam çatlar. Bu yüzden biçimlendirilen parçalar özel fırınlarda yavaş yavaş soğutulur.[/P]\nBu parçada aşağıdaki soruların hangisinin cevabı vardır?","o":["Cam üretiminde kullanılan kum hangi bölgelerden çıkarılır?","Camın ışığı geçirmesinin nedeni nedir?","Cam üfleme tekniği ilk kez nerede uygulanmıştır?","Bir cam ustasının yetişmesi ne kadar sürer?"],"a":1,"e":"Bu soru tipinde yapman gereken tek şey, her şıktaki sorunun cevabını parçada <b>parmağınla aramak</b>. Parçada şu cümle var: \"soğurken katılaşır ama kristal bir yapı kurmaz, işte bu yüzden ışığı geçirir.\" Bu, B'deki sorunun tam cevabıdır. Doğru cevap <b>B</b> ✔\nA neden yanlış: Kumun nereden çıkarıldığı parçada hiç geçmiyor, sadece camın kumdan yapıldığı söyleniyor.\nC neden yanlış: Üfleme tekniğinin <b>nasıl</b> uygulandığı anlatılıyor ama <b>nerede</b> ve <b>ne zaman</b> ortaya çıktığı yok.\nD neden yanlış: Ustanın yetişme süresiyle ilgili tek bir bilgi bile yok.\nPüf noktası: \"Parçada geçen bir kelime\" ile \"parçada cevabı olan soru\" aynı şey değil. C şıkkında \"üfleme tekniği\" geçiyor diye kanma; sorunun sorduğu bilgi orada var mı, ona bak."},{"s":"Türkçe","t":"Parça · değinilmemiştir (ters kök)","d":3,"q":"[P]Fotoğrafçı Nadia, yıllardır aynı sokağın aynı köşesini her ayın ilk pazarı fotoğraflıyor. Kadraj hiç değişmiyor; değişen yalnızca zaman: bir dükkânın tabelası iniyor, kaldırıma yeni bir ağaç dikiliyor, çocuklar büyüyor. Nadia bu çalışmayı sergilerken fotoğrafları tarih sırasına koymuyor, izleyicinin kendi sırasını kurmasını istiyor. Ona göre bir sokağın hikâyesi düz bir çizgi değil, üst üste binmiş anılardır.[/P]\nBu parçada Nadia'nın çalışmasıyla ilgili aşağıdakilerin hangisine <b>değinilmemiştir</b>?","o":["Çalışmasına hangi olaydan sonra başladığına","Fotoğrafları hangi sıklıkla çektiğine","Sergide fotoğrafları nasıl dizdiğine","Kadrajını değiştirmediğine"],"a":0,"e":"<b>Ters kök uyarısı!</b> \"Değinilmemiştir\" diyor; yani parçada <b>bulunmayan</b> bilgiyi arıyorsun. Üç adım: 1) Olumsuz kökü yuvarla. 2) Şıkların yanına ✓ (var) ya da ✗ (yok) koy. 3) Tek ✗'i işaretle.\nB ✓ \"her ayın ilk pazarı\" deniyor; sıklık verilmiş.\nC ✓ \"fotoğrafları tarih sırasına koymuyor\" deniyor; diziliş verilmiş.\nD ✓ \"Kadraj hiç değişmiyor\" deniyor.\nA ✗ Nadia'nın bu işe <b>neden</b> ya da <b>hangi olaydan sonra</b> başladığı hiç söylenmiyor. Doğru cevap <b>A</b> ✔\nPüf noktası: \"Değinilmemiştir\" sorularında en çok kaçırılan şey <b>başlangıç sebebi</b> ve <b>süre</b> bilgileridir. Parça bir kişiyi anlatıyorsa kendine \"niçin başlamış?\" diye sor; çoğu zaman cevap yoktur ve doğru şık odur."},{"s":"Türkçe","t":"Parça · anlatım özellikleri","d":2,"q":"[P]Sabah kalktığımda mutfakta beni bekleyen o küçük demlik, bir gemi düdüğü gibi öter. Sesini duyunca günün rotası çizilmiş sayılır. Çayın ilk buharı camda incecik bir sis bırakır; ben o sisin ardından sokağa bakarım. Kimi sabahlar bu bakış, kapağı yeni aralanmış bir kitap kadar sessizdir.[/P]\nBu parçanın anlatımıyla ilgili aşağıdakilerden hangisi söylenebilir?","o":["Kişileştirmeye başvurulmadan nesneler betimlenmiştir.","Okurun görüşünü almak için ona soru sorulmuştur.","Benzetmelerden yararlanılmıştır.","Olaylar oluş sırasına göre, tarih verilerek anlatılmıştır."],"a":2,"e":"Benzetmede bir varlık, bir yönüyle başka bir varlığa benzetilir; \"gibi, kadar, sanki\" gibi sözcükler ipucudur. Parçada iki tane var: \"bir gemi düdüğü <b>gibi</b> öter\" ve \"bir kitap <b>kadar</b> sessizdir.\" Doğru cevap <b>C</b> ✔\nA neden yanlış: Tam tersi, kişileştirme <b>var</b>. Demliğin \"beni beklemesi\" ve \"ötmesi\" insana ait özelliklerdir. Bu yüzden A elenir.\nB neden yanlış: Parçada okura yöneltilmiş tek bir soru cümlesi bile yok.\nD neden yanlış: Anlatılan şey bir sabah alışkanlığı; sıralanmış olaylar ve tarih yok.\nPüf noktası: Anlatım sorularında şıkkı okur okumaz parçada <b>kanıtını</b> ara. Kanıtı bir kelimeye kadar gösteremiyorsan o şık yanlıştır. Ayrıca A gibi \"...-madan, ...-maksızın\" içeren şıklar sinsi olur; olumsuzluğu atlamadan oku."},{"s":"Türkçe","t":"Parça · iki parçayı karşılaştırma","d":3,"q":"[P]<b>I. Parça:</b> Bir şehri tanımak için haritasına değil, sabah saat yedideki duraklarına bakmalı. Kimin nereye, hangi telaşla gittiğini gören, o şehrin nasıl bir yer olduğunu da anlar.\n<b>II. Parça:</b> Şehirler binalarıyla anlatılmaz. Bir meydanda akşamüstü kimlerin oturduğuna, hangi dilde konuşulduğuna bakarsan şehrin asıl yüzünü görürsün.[/P]\nI. ve II. parçada ortak olarak vurgulanan düşünce aşağıdakilerden hangisidir?","o":["Şehirlerin mimarisi, orada yaşayanların beğenisini yansıtır.","Büyük şehirlerde insanlar günün her saatinde telaşlıdır.","Bir şehri tanımanın en kısa yolu haritasını incelemektir.","Bir şehir, orada yaşayanların gündelik hâlleriyle anlaşılır."],"a":3,"e":"İki parçanın ortak düşüncesini bulurken her ikisinde de tekrarlanan fikri ara. I. parça \"duraklardaki insanlara bak\", II. parça \"meydanda oturanlara bak\" diyor. İkisi de aynı şeyi söylüyor: şehir, <b>haritayla ya da binayla değil, insanların günlük yaşamıyla</b> anlaşılır. Doğru cevap <b>D</b> ✔\nA neden yanlış: II. parça \"Şehirler binalarıyla anlatılmaz\" diyerek tam tersini savunuyor.\nB neden yanlış: Telaş yalnızca I. parçada, hem de sadece sabah saatine ilişkin bir ayrıntı olarak geçiyor; ortak düşünce olamaz.\nC neden yanlış: I. parça \"haritasına <b>değil</b>\" diyor; bu şık parçanın söylediğinin tersi.\nPüf noktası: Ortak düşünce sorularında bir şık yalnızca <b>tek bir parçada</b> geçiyorsa elenir. Şıkkı iki parçada da ayrı ayrı sına; ikisinde de destek bulamıyorsan o şık senin cevabın değildir."},{"s":"Türkçe","t":"Sözcükte anlam · terim anlam","d":1,"q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük terim anlamıyla kullanılmıştır?","o":["Şarkının <u>nakarat</u> bölümünü herkes bir ağızdan söyledi.","Sabah erkenden bahçedeki otları <u>temizledik</u>.","Çantasındaki defterleri masaya tek tek <u>dizdi</u>.","Rüzgâr, balkondaki çamaşırları yere <u>düşürdü</u>."],"a":0,"e":"Terim anlam, bir sözcüğün bir bilim, sanat ya da meslek dalına özgü <b>özel</b> anlamıdır. \"Nakarat\", müzikte bir şarkının her kıtadan sonra yinelenen bölümüne verilen addır; yani bir müzik terimidir. Doğru cevap <b>A</b> ✔\nB neden yanlış: \"Temizlemek\" burada bildiğimiz gerçek anlamıyla, otları koparıp atmak anlamında kullanılmış.\nC neden yanlış: \"Dizmek\" defterleri yan yana koymak demek; bu da gerçek anlam.\nD neden yanlış: \"Düşürmek\" bir şeyin yere inmesine yol açmak; yine gerçek anlam.\nPüf noktası: Bir sözcüğün terim olup olmadığını anlamak için kendine şunu sor: \"Bu kelime hangi dersin kitabında, tanımı verilerek geçer?\" Nakarat müzik dersinde geçer; temizlemek, dizmek, düşürmek hiçbir dersin özel terimi değildir."},{"s":"Türkçe","t":"Söz öbeğinde anlam · deyim (ters kök)","d":2,"q":"Aşağıdaki cümlelerin hangisinde deyim <b>kullanılmamıştır</b>?","o":["Sınav sonucunu duyunca sevinçten etekleri zil çaldı.","Onun bu sözleri babamın damarına bastı.","Yeni taşındığımız evin bahçesinde küçük bir havuz var.","Heyecanlanınca sırrı ağzından kaçırdı."],"a":2,"e":"<b>Ters kök uyarısı!</b> Soru \"kullanılmamıştır\" diyor; yani deyim <b>olmayan</b> cümleyi arıyorsun. Üç adım: 1) Olumsuz kökü yuvarla. 2) Şıkların yanına deyim varsa ✓, yoksa ✗ koy. 3) Tek ✗ kalanı işaretle.\nA ✓ \"etekleri zil çalmak\" = çok sevinmek.\nB ✓ \"damarına basmak\" = birini öfkelendirecek şeyi söylemek.\nD ✓ \"ağzından kaçırmak\" = söylememesi gerekeni istemeden söylemek.\nC ✗ Cümlede kalıplaşmış, mecazlı hiçbir söz yok; her kelime gerçek anlamında. Doğru cevap <b>C</b> ✔\nPüf noktası: Deyimin iki şartı vardır: <b>kalıplaşmıştır</b> (kelimeleri değiştirilemez) ve genellikle <b>mecaz anlamlıdır</b>. Bir söz öbeğini gerçek anlamıyla gözünde canlandırabiliyorsan (bahçede havuz var gibi) o deyim değildir."},{"s":"Türkçe","t":"Söz öbeğinde anlam · atasözü","d":2,"q":"[P]Takım kaptanı, maçta hakemin verdiği karara çok kızdı. Sesini yükseltip tartışmayı sürdürünce kırmızı kart gördü ve takımı sahada eksik kaldı. Sonunda öfkesinden en çok kendi takımı zarar görmüş oldu.[/P]\nBu parçada anlatılanlar aşağıdaki atasözlerinden hangisiyle özetlenebilir?","o":["Ayağını yorganına göre uzat.","Keskin sirke küpüne zarar.","Bir elin nesi var, iki elin sesi var.","Damlaya damlaya göl olur."],"a":1,"e":"Parçada kaptan öfkesini tutamıyor ve bu öfke en çok <b>kendi takımına</b> zarar veriyor. \"Keskin sirke küpüne zarar\" atasözü tam olarak bunu anlatır: aşırı öfkeli, sert kişi önce kendine zarar verir. Doğru cevap <b>B</b> ✔\nA neden yanlış: Bu atasözü, gelirine göre harcama yapmakla, yani tutumlu olmakla ilgilidir; parçada para konusu yok.\nC neden yanlış: Birlik olmanın gücünü anlatır. Parçada bir iş birliği durumu anlatılmıyor, bireysel bir öfke anlatılıyor.\nD neden yanlış: Küçük birikimlerin zamanla büyümesini anlatır; parçayla hiç ilgisi yok.\nPüf noktası: Atasözü sorularında önce parçanın <b>sonucunu</b> tek cümleyle özetle: \"Öfkesi kendine zarar verdi.\" Sonra bu özeti şıklarla eşleştir. Parçanın tamamını değil, vardığı yeri karşılayan atasözünü seç."},{"s":"Türkçe","t":"Cümlede anlam · neden-sonuç","d":1,"q":"Aşağıdaki cümlelerin hangisinde neden-sonuç ilişkisi vardır?","o":["Yağmur yağarsa yarınki pikniği iptal ederiz.","Kütüphaneye, sınav için kaynak kitap almaya gitti.","Bu roman, yazarın önceki romanından daha akıcıymış.","Servis otobüsü yolda bozulduğu için maça geç kaldık."],"a":3,"e":"Neden-sonuç cümlesinde bir iş, başka bir işin <b>sebebiyle</b> gerçekleşir. \"...-dığı için, ...-den dolayı, ...-diğinden\" gibi ekler ve sözler ipucudur. D'de otobüsün bozulması <b>neden</b>, maça geç kalmak <b>sonuç</b>. Doğru cevap <b>D</b> ✔\nA neden yanlış: \"Yağmur yağarsa\" bir <b>koşul</b> bildirir; yağmur yağmazsa piknik yapılacak. Koşul ile neden karışır: koşulda iş henüz olmamıştır, nedende olmuştur.\nB neden yanlış: \"Almaya gitti\" bir <b>amaç-sonuç</b> cümlesidir; gitmenin amacı kitap almak.\nC neden yanlış: \"daha akıcı\" diyerek iki romanı <b>karşılaştırıyor</b>.\nPüf noktası: Neden-sonuçta cümleye \"Niçin?\" diye sorduğunda cevap <b>olmuş bitmiş bir olay</b> olur. Amaç-sonuçta ise cevap <b>henüz gerçekleşmemiş bir istek</b>tir. \"Niçin geç kaldık? Otobüs bozuldu (oldu)\" → neden-sonuç."},{"s":"Türkçe","t":"Cümlede anlam · öznellik-nesnellik (ters kök)","d":2,"q":"Aşağıdaki cümlelerin hangisinde öznel bir yargı <b>yoktur</b>?","o":["Bu filmin müzikleri insanın içini ısıtıyor.","Kasabanın en güzel manzarası tepedeki taş evden görülür.","Yazarın son kitabı, öncekilerden çok daha sürükleyici.","Kitabın ikinci baskısı geçen ay yayımlandı."],"a":3,"e":"<b>Ters kök uyarısı!</b> Soru \"öznel yargı yoktur\" diyor; yani sen <b>nesnel</b> cümleyi arıyorsun. Üç adım: 1) Olumsuz kökü yuvarla. 2) Şıkların yanına kişisel yorum varsa ✓, yoksa ✗ koy. 3) Tek ✗ kalanı işaretle.\nA ✓ \"içini ısıtıyor\" tamamen kişisel bir duygu; herkes aynı şeyi hissetmez.\nB ✓ \"en güzel manzara\" bir beğeni ifadesi, kanıtlanamaz.\nC ✓ \"daha sürükleyici\" kişiden kişiye değişir.\nD ✗ Baskı tarihi kitabın künyesine bakılarak <b>doğrulanabilir</b>; yorum içermiyor. Doğru cevap <b>D</b> ✔\nPüf noktası: Nesnel cümlenin tek testi şudur: \"Bunu kanıtlayabilir miyim?\" Cevap evetse nesnel. Güzel, hoş, sıkıcı, sürükleyici, en iyi gibi <b>beğeni bildiren</b> sözcükleri gördüğün an o cümle özneldir."},{"s":"Türkçe","t":"Cümlede anlam · öneri-varsayım-eleştiri","d":2,"q":"[P]I. Sunumunu biraz daha kısaltırsan dinleyicilerin ilgisi dağılmaz.\nII. Diyelim ki tren rötar yaptı; o zaman toplantıya nasıl yetişeceksin?\nIII. Hikâyede olaylar güzel kurgulanmış ama kişiler çok yüzeysel kalmış.\nIV. Bu yolun yapımı üç yıl önce tamamlandı.[/P]\nNumaralanmış cümlelerle ilgili aşağıdaki eşleştirmelerden hangisi doğrudur?","o":["I - öneri, II - varsayım, III - eleştiri","I - varsayım, II - öneri, III - eleştiri","II - eleştiri, III - varsayım, IV - öneri","I - eleştiri, III - öneri, IV - varsayım"],"a":0,"e":"Cümleleri tek tek etiketleyelim:\nI. \"Kısaltırsan ilgi dağılmaz\" → karşıdakine bir <b>yol gösteriyor</b>, bu <b>öneri</b>.\nII. \"Diyelim ki\" → olmamış bir durumu olmuş gibi kabul ediyor, bu <b>varsayım</b>.\nIII. \"kurgu güzel <b>ama</b> kişiler yüzeysel\" → bir yapıtın eksik yönünü söylüyor, bu <b>eleştiri</b>.\nIV. Doğrulanabilir bir bilgi; nesnel bir anlatım cümlesi.\nBu etiketlere uyan tek şık <b>A</b> ✔\nB neden yanlış: I ile II'yi ters çevirmiş; \"Diyelim ki\" varsayımın en açık işaretidir.\nC neden yanlış: II varsayım, III eleştiri, IV ise öneri değil düz bilgi cümlesi; üçü de hatalı.\nD neden yanlış: I öneri iken eleştiri, III eleştiri iken öneri denmiş.\nPüf noktası: Anahtar sözcükleri ezberle: \"Diyelim ki / tut ki / farz edelim\" → varsayım. \"...-meli, ...-sa iyi olur, ...-sen\" → öneri. \"ama, ne yazık ki, eksik, yüzeysel\" → eleştiri."},{"s":"Türkçe","t":"Fiilimsiler · tür ayrımı","d":1,"q":"Aşağıdaki cümlelerin hangisinde zarf-fiil (bağ-fiil) kullanılmıştır?","o":["Sabahları koşmak, onun en sevdiği spordu.","Dün akşam kırılan bardakları çöpe attık.","Kapıyı açınca içeriye serin bir rüzgâr doldu.","Sınavda çıkacak konuları defterime listeledim."],"a":2,"e":"Fiilimsi türleri eklerinden tanınır:\n• İsim-fiil: <b>-mak/-mek, -ma/-me, -ış/-iş</b>\n• Sıfat-fiil: <b>-an/-en, -ası, -mez, -ar, -dik, -ecek, -miş</b>\n• Zarf-fiil: <b>-ince, -erek, -ip, -meden, -ken, -dikçe, -alı, -maksızın</b>\nC'deki \"açınca\" → <b>-ince</b> ekiyle kurulmuş zarf-fiildir; cümlede \"ne zaman doldu?\" sorusunun cevabıdır. Doğru cevap <b>C</b> ✔\nA neden yanlış: \"Koşmak\" → -mak eki, isim-fiil. Üstelik cümlenin öznesi durumunda.\nB neden yanlış: \"Kırılan\" → -an eki, sıfat-fiil. \"bardak\" ismini niteliyor.\nD neden yanlış: \"Çıkacak\" → -ecek eki, sıfat-fiil. \"konular\" ismini niteliyor.\nPüf noktası: Türü şaşırırsan fiilimsiye <b>soru sor</b>. \"Ne?\" cevabı veriyorsa isim-fiil, \"nasıl bir?\" cevabı veriyorsa sıfat-fiil, \"ne zaman / nasıl / niçin?\" cevabı veriyorsa zarf-fiildir."},{"s":"Türkçe","t":"Fiilimsiler · adlaşmış sıfat-fiil","d":2,"q":"Aşağıdaki cümlelerin hangisinde adlaşmış sıfat-fiil vardır?","o":["Çantasını sınıfta unutan öğrenci hemen geri döndü.","Bileti olmayanlar salona alınmadı.","Yarın gelecek misafirler için hazırlık yaptık.","Okunacak kitapları masanın üstüne koydum."],"a":1,"e":"Sıfat-fiil normalde bir ismi niteler: \"<u>unutan</u> <b>öğrenci</b>\" gibi. Nitelediği isim cümleden <b>düşer</b> ve sıfat-fiil o ismin yerine geçip çokluk, hâl ya da iyelik eki alırsa buna <b>adlaşmış sıfat-fiil</b> denir.\nB'de \"olmayanlar\" aslında \"bileti olmayan <b>kişiler</b>\" demek. \"Kişiler\" düşmüş, sıfat-fiil <b>-lar</b> çokluk ekini alıp isim gibi davranmış: cümlenin öznesi olmuş. Doğru cevap <b>B</b> ✔\nA neden yanlış: \"Unutan\" hemen yanındaki \"öğrenci\" ismini niteliyor; isim ortada, adlaşma yok.\nC neden yanlış: \"Gelecek\", \"misafirler\" ismini niteliyor; yine sadece sıfat-fiil.\nD neden yanlış: \"Okunacak\", \"kitapları\" ismini niteliyor. Buradaki -ı eki <b>kitap</b>a ait, sıfat-fiile değil.\nPüf noktası: Şu testi yap → sıfat-fiilin hemen <b>sağına</b> bak. Sağında nitelediği bir isim varsa sıfat-fiil; sağında isim yoksa ve ek doğrudan sıfat-fiile yapışmışsa <b>adlaşmıştır</b>. Bu üç denemede kaçırdığın nokta tam burasıydı: sağına bakmayı alışkanlık hâline getir."},{"s":"Türkçe","t":"Fiilimsiler · parçada sayma","d":3,"q":"[P]Denizden esen rüzgâr, sahilde yürüyen insanların yüzüne çarpıyordu. Kumda oynayan çocuklar, dalga gelince çığlık atarak geri kaçıyordu. Uzaktaki balıkçı ise ağını toplamak için sandalını kıyıya çekti.[/P]\nBu parçada kaç tane fiilimsi vardır?","o":["3","4","5","6"],"a":3,"e":"Fiilimsileri tek tek işaretleyelim:\n1. <b>esen</b> → -en, sıfat-fiil (rüzgârı niteliyor)\n2. <b>yürüyen</b> → -en, sıfat-fiil (insanları niteliyor)\n3. <b>oynayan</b> → -an, sıfat-fiil (çocukları niteliyor)\n4. <b>gelince</b> → -ince, zarf-fiil\n5. <b>atarak</b> → -arak, zarf-fiil\n6. <b>toplamak</b> → -mak, isim-fiil\nToplam <b>6</b> fiilimsi. Doğru cevap <b>D</b> ✔\nA, B ve C neden yanlış: 3, 4 ve 5 diyenler genellikle ya \"gelince\" ile \"atarak\" gibi zarf-fiilleri atlıyor ya da isim-fiil olan \"toplamak\"ı saymıyor.\n<b>Tuzak:</b> \"Uzaktaki\" sözcüğündeki <b>-ki</b> bir fiilimsi eki değildir, isme gelen bir ektir; sayma. \"Çarpıyordu, kaçıyordu, çekti\" ise çekimli fiillerdir, yani cümlenin yüklemidir; onlar da fiilimsi değildir.\nPüf noktası: Sayma sorularında parçayı iki kez tara. Birinci turda sadece <b>-an/-ecek/-dik/-mez</b> (sıfat-fiil), ikinci turda <b>-ince/-erek/-ip/-meden/-ken</b> (zarf-fiil) ve <b>-mak/-ma/-ış</b> (isim-fiil) ara. Tek turda saymak en sık yapılan hatadır."},{"s":"Türkçe","t":"Fiilimsiler · benzer eklerin ayrımı (ters kök)","d":3,"q":"Aşağıdaki cümlelerin hangisinde fiilimsi <b>yoktur</b>?","o":["Bahçedeki kuyunun suyu tuzluymuş, kimse içmedi.","Bu soruyu çözemeyen arkadaşına sen yardım et.","Yazmak, onun için bir alışkanlık hâline gelmiş.","Telefonu çalınca konuşmayı yarıda kesti."],"a":0,"e":"<b>Ters kök uyarısı!</b> Soru \"fiilimsi yoktur\" diyor; fiilimsi <b>bulunmayan</b> cümleyi arıyorsun. Üç adım: 1) Olumsuz kökü yuvarla. 2) Şıkların yanına fiilimsi varsa ✓, yoksa ✗ koy. 3) Tek ✗ kalanı işaretle.\nB ✓ \"çözemeyen\" → -en, sıfat-fiil.\nC ✓ \"Yazmak\" → -mak, isim-fiil.\nD ✓ \"çalınca\" → -ince zarf-fiil, \"konuşmayı\" → -ma isim-fiil. İki tane var.\nA ✗ Buradaki ekler fiilimsiye <b>benziyor</b> ama değil: \"Bahçe<b>deki</b>\"deki -ki isme gelen bir ektir; \"tuz<b>lu</b>\"daki -lu isimden sıfat yapan bir ektir; \"iç<b>me</b>di\"deki -me ise <b>olumsuzluk</b> ekidir, isim-fiil eki değildir. Doğru cevap <b>A</b> ✔\nPüf noktası: -ma/-me ekini ayırmak için cümleye \"değil\" anlamı katıp katmadığına bak. \"İçmedi\" = içme eylemini yapmadı → olumsuzluk. \"Konuşmayı kesti\" = konuşma <b>işini</b> kesti → isim-fiil. Ekin görünüşüne değil, cümleye kattığı anlama bak."},{"s":"Türkçe","t":"Yazım kuralları · de/da, ki, mi","d":1,"q":"Aşağıdaki cümlelerin hangisinde bir yazım yanlışı vardır?","o":["Sen de bizimle gelseydin çok iyi olurdu.","Yarın sinemaya gidelim mi diye sordu.","Kitabı okudumda hiçbir şey anlamadım.","Öyle yorulmuştu ki oturur oturmaz uyudu."],"a":2,"e":"Bağlaç olan <b>de/da</b> her zaman <b>ayrı</b> yazılır ve cümleden çıkarıldığında anlam bozulmaz, sadece zayıflar. C'de \"okudum <b>da</b> anlamadım\" cümlesindeki \"da\" bir bağlaçtır; \"okudumda\" diye bitişik yazılamaz. Doğru yazımı \"Kitabı okudum da hiçbir şey anlamadım\" olmalıydı. Doğru cevap <b>C</b> ✔\nA neden doğru yazılmış: \"Sen de\" buradaki de bağlaç, zaten ayrı yazılmış.\nB neden doğru yazılmış: Soru eki <b>mi</b> her zaman ayrı yazılır; \"gidelim mi\" doğrudur.\nD neden doğru yazılmış: Bağlaç olan <b>ki</b> ayrı yazılır; \"yorulmuştu ki\" doğrudur.\nPüf noktası: Bitişik yazılan <b>-de/-da</b> hâl ekidir ve \"nerede?\" sorusuna cevap verir (evde, okulda). Ayrı yazılan \"de/da\" ise \"da/de\" olarak cümleden atılabilir. \"Okudum da\" → \"Okudum, anlamadım\" olur, anlam ayakta kalır; demek ki bağlaç, demek ki ayrı."},{"s":"Türkçe","t":"Noktalama · virgül ve nokta","d":2,"q":"[P]Öğretmenimiz sınıfa girdi ( ) elindeki kâğıtları masaya bıraktı ( ) \"Bugün kısa bir yazılı yapacağız ( )\" dedi.[/P]\nBu parçada ayraçla ( ) belirtilen yerlere sırasıyla aşağıdaki noktalama işaretlerinden hangileri getirilmelidir?","o":["virgül (,) - iki nokta (:) - ünlem (!)","virgül (,) - virgül (,) - nokta (.)","noktalı virgül (;) - virgül (,) - ünlem (!)","iki nokta (:) - virgül (,) - nokta (.)"],"a":1,"e":"Sırayla düşünelim:\n1. yer: \"girdi\", \"bıraktı\" ve \"dedi\" sıralı yüklemlerdir; art arda gelen bu cümlecikleri ayırmak için <b>virgül</b> kullanılır.\n2. yer: Aynı gerekçeyle yine <b>virgül</b>.\n3. yer: Tırnak içindeki söz tamamlanmış bir cümledir; tırnağın <b>içinde</b> nokta ile biter.\nDoğru cevap <b>B</b> ✔\nA neden yanlış: İki nokta, bir açıklama ya da alıntı <b>öncesinde</b> kullanılır; burada \"dedi\" alıntıdan sonra geliyor, öncesinde iki noktaya gerek yok. Ayrıca cümlede seslenme ya da coşku olmadığı için ünlem de olmaz.\nC neden yanlış: Noktalı virgül, kendi içinde virgül bulunan uzun öbekleri ayırır; burada öyle bir durum yok.\nD neden yanlış: Yine gereksiz iki nokta hatası; \"bıraktı\" bir açıklama sunmuyor, sadece sıralı bir eylem.\nPüf noktası: İki nokta ancak \"şöyle dedi<b>:</b>\" gibi, alıntıyı <b>tanıtan</b> bir söz varsa konur. Alıntıdan sonra \"dedi\" geliyorsa öncesinde virgül yeterlidir."},{"s":"İnkılap Tarihi","t":"Bir Kahraman Doğuyor · Manastır yılları","d":1,"q":"[P]Mustafa Kemal'in 1896'da girdiği Manastır Askerî İdadisi'nde okuduğu yıllarda şehirde Sırp, Bulgar ve Yunan çetelerinin faaliyetleri hız kazanmıştı. Sınıf arkadaşı Ömer Naci sayesinde şiirle ve hitabetle tanıştı; tarih öğretmeni Mehmet Tevfik Bey ise onda güçlü bir tarih merakı uyandırdı. Okuduğu kitaplar ve arkadaşlarıyla vatanın durumu üzerine yaptığı tartışmalar, bu yıllarda onun düşünce dünyasını biçimlendirdi.[/P]Bu parçadan Mustafa Kemal'in Manastır yılları ile ilgili aşağıdakilerden hangisi <b>çıkarılamaz</b>?","o":["Bulunduğu şehrin siyasi ortamı, düşünce dünyasının gelişmesinde etkili olmuştur.","Öğretmenlerinden biri onda tarihe karşı ilgi uyandırmıştır.","Arkadaş çevresi, edebiyata yönelmesinde rol oynamıştır.","Askerî öğrenimini yarıda bırakarak edebiyat eğitimine geçmiştir."],"a":3,"e":"Soru kökü \"çıkarılamaz\" diyor. Yani senden parçada <b>söylenmeyeni</b> bulman isteniyor; doğru bilgileri değil!\nParçayı tarayalım:\nA → \"şehirde Sırp, Bulgar ve Yunan çetelerinin faaliyetleri hız kazanmıştı\" + \"düşünce dünyasını biçimlendirdi\" cümleleri bunu destekliyor, çıkarılır.\nB → \"tarih öğretmeni Mehmet Tevfik Bey onda güçlü bir tarih merakı uyandırdı\" diyor, çıkarılır.\nC → \"Sınıf arkadaşı Ömer Naci sayesinde şiirle ve hitabetle tanıştı\" diyor, çıkarılır.\nD → Parçada okulu bıraktığına dair <b>tek bir kelime yok</b>. Edebiyata ilgi duymak, askerî okulu bırakmak demek değil. Mustafa Kemal bu okulu bitirip 1899'da İstanbul'daki Harp Okulu'na gitmiştir. <b>Çıkarılamaz</b> ✔\nPüf noktası: \"çıkarılamaz\" sorularında üç şık doğru, bir şık yanlıştır. Parçada karşılığını bulduğun her şıkkın yanına zihninde bir tik at; tik atamadığın tek şık cevabındır."},{"s":"İnkılap Tarihi","t":"Bir Kahraman Doğuyor · kişilik özellikleri","d":2,"q":"[P]Mustafa Kemal, Harp Akademisi'ni kurmay yüzbaşı olarak bitirdikten sonra görevlendirildiği Şam'da, ülkenin gidişatından rahatsız olan güvendiği arkadaşlarını bir araya getirerek 1906'da Vatan ve Hürriyet Cemiyeti'ni kurdu. Kısa bir süre sonra gizlice Selanik'e geçti ve cemiyetin burada da bir şube açmasını sağladı.[/P]Bu bilgiler, Mustafa Kemal'in aşağıdaki kişilik özelliklerinden hangisine kanıt olarak gösterilebilir?","o":["Sanata ve edebiyata olan düşkünlüğüne","Teşkilatçılığına ve örgütleyici yönüne","Dürüstlüğüne ve açık sözlülüğüne","Öğrenmeye ve okumaya verdiği değere"],"a":1,"e":"Kişilik özelliği sorularında yöntem hep aynı: <b>metindeki eylemi</b> bul, sonra o eyleme hangi özellik yakışıyor diye sor.\nBuradaki eylemler: insanları \"bir araya getirmek\", bir \"cemiyet kurmak\", başka bir şehirde \"şube açmak\". Bunların hepsi bir yapı kurup insanları ortak amaç etrafında düzenlemektir → <b>teşkilatçılık ve örgütleyicilik</b> ✔ (B)\nA yanlış: parçada şiir, resim, edebiyat gibi hiçbir sanat işi geçmiyor.\nC yanlış: burası klasik tuzak. Metinde tam tersine \"<b>gizlice</b> Selanik'e geçti\" yazıyor; gizlilik açık sözlülüğün kanıtı olamaz.\nD yanlış: Harp Akademisi'ni bitirmesi öğrenimiyle ilgilidir ama parçanın anlattığı olay okumak değil, cemiyet kurmaktır.\nPüf noktası: Şıkta güzel duran bir özellik görünce hemen işaretleme; o özelliğin karşılığı olan <b>cümleyi</b> metinde parmağınla gösterebiliyor musun, ona bak."},{"s":"İnkılap Tarihi","t":"Bir Kahraman Doğuyor · fikir akımları","d":3,"q":"[P]Bir tarih öğretmeni tahtaya iki olay yazar:\nI. Balkan Savaşları'nda, yüzyıllardır Osmanlı yönetiminde yaşayan Balkan halklarının devlete karşı savaşması\nII. I. Dünya Savaşı sırasında Arapların, halifenin cihat çağrısına uymayarak İngilizlerin yanında yer alması[/P]Öğretmen, bu olayların sırasıyla hangi fikir akımlarının geçerliliğini yitirdiğini gösterdiğini söylemiştir?","o":["I. Türkçülük — II. Batıcılık","I. İslamcılık — II. Osmanlıcılık","I. Osmanlıcılık — II. İslamcılık","I. Batıcılık — II. Türkçülük"],"a":2,"e":"Önce akımların <b>iddiasını</b> hatırla, sonra olayın o iddiayı çürütüp çürütmediğine bak:\n<b>Osmanlıcılık</b>: \"Din ve milliyet farkı gözetmeden herkes Osmanlı vatandaşı sayılırsa devlet dağılmaz.\" → I. olayda Balkan halkları tam da devletten <b>ayrılmak için</b> savaştı. Osmanlıcılık çürüdü.\n<b>İslamcılık</b>: \"Bütün Müslümanlar halife etrafında birleşirse devlet ayakta kalır.\" → II. olayda Araplar halifenin çağrısını dinlemeyip düşmanın safına geçti. İslamcılık çürüdü.\nDoğru eşleşme: I. Osmanlıcılık — II. İslamcılık ✔ (C)\nA yanlış: Türkçülük, Türklerin birliğini savunur; Balkan halkları Türk değildi, bu olay Türkçülüğü çürütmez. Batıcılık ise bilim ve teknikte Batı'yı örnek almaktır, Arap isyanıyla ilgisi yoktur.\nB yanlış: eşleşmeler yer değiştirmiş. Balkanlar olayı dinle değil <b>vatandaşlık</b> fikriyle, Arap isyanı ise dinî birlik fikriyle ilgilidir.\nD yanlış: Batıcılık da Türkçülük de bu iki olayın çürüttüğü akımlar değildir.\nPüf noktası: Aklında iki çengel tut → <b>Balkan Savaşları = Osmanlıcılığın sonu</b>, <b>Arap İsyanı = İslamcılığın sonu</b>. Bu ikisini karıştırmazsan bu tip sorunun tamamını alırsın."},{"s":"İnkılap Tarihi"
